// 품목별 검수표 1개 품목을 원본 피킹지시서와 동일한 레이아웃의 시트 데이터(AOA)로 변환
function safeSheetName(name, used) {
  let base = String(name || "품목").replace(/[\\/?*[\]:]/g, "").slice(0, 28) || "품목";
  let candidate = base;
  let i = 2;
  while (used.has(candidate)) {
    candidate = `${base.slice(0, 25)}(${i})`;
    i++;
  }
  used.add(candidate);
  return candidate;
}

const XLFONT = "맑은 고딕";
const XL_THIN = { style: "thin", color: { argb: "FF000000" } };
const XL_MEDIUM = { style: "medium", color: { argb: "FF000000" } };
const XL_GRAY_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFD9D9D9" } };

// 실제 피킹지시서 디자인(테두리·음영·폰트 크기)을 그대로 적용해 1개 품목 시트를 만듦
function addStyledInspectionSheet(workbook, product, usedNames, date) {
  const pack = product.packQty || 0;
  const bd = (q) => (pack > 0 ? { box: Math.floor(q / pack), rem: q % pack } : { box: 0, rem: q });
  const ws = workbook.addWorksheet(safeSheetName(product.name, usedNames));
  ws.columns = [{ width: 34 }, { width: 8 }, { width: 31 }, { width: 10 }, { width: 12 }, { width: 11 }, { width: 9 }, { width: 9 }];

  // 인쇄 설정: 가로 방향 + 폭을 1페이지에 맞춰 자동 축소, 페이지 넘어가도 3행(헤더)은 반복
  ws.pageSetup = {
    orientation: "landscape",
    fitToPage: true,
    fitToWidth: 1,
    fitToHeight: 0,
    margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 },
  };
  ws.pageSetup.printTitlesRow = "1:3";

  // 전체 지역을 화주사 고정 순서(A→B→미지정)로 한 줄로 나열 (체크포인트 계산이 구역 경계를 넘어 전체를 봄)
  const flat = [];
  ["A", "B", "미지정"].forEach((zone) => {
    product.regionRows.filter((r) => r.zone === zone).forEach((r) => flat.push({ ...r, zone }));
  });
  // 체크포인트: 이 지역 "다음"부터 전체 끝까지 남은 낱개(소분) 합계를 박스로 환산
  const remAfter = new Array(flat.length + 1).fill(0);
  for (let i = flat.length - 1; i >= 0; i--) remAfter[i] = remAfter[i + 1] + bd(flat[i].qty).rem;

  // 1행: 장식용 빈 줄 (위쪽 굵은 테두리)
  ws.addRow([]);
  ws.getRow(1).height = 8;
  ws.mergeCells("A1:F1");
  ["A", "B", "C", "D", "E", "F"].forEach((col) => (ws.getCell(`${col}1`).border = { bottom: XL_MEDIUM }));

  // 2행: 날짜 | 공급자명(병합) | 박스 | 낱개
  const r2 = ws.addRow([date || todayStr(), product.supplier || "", "", "", "", "", "박스", "낱개"]);
  r2.height = 24.75;
  ws.mergeCells("B2:F2");
  const a2 = ws.getCell("A2");
  a2.font = { name: XLFONT, size: 14, bold: true };
  a2.alignment = { horizontal: "left", vertical: "middle" };
  a2.numFmt = "yyyy-mm-dd";
  a2.border = { top: XL_MEDIUM, bottom: XL_THIN, left: XL_MEDIUM, right: XL_THIN };
  const b2 = ws.getCell("B2");
  b2.font = { name: XLFONT, size: 14, bold: true };
  b2.alignment = { horizontal: "center", vertical: "middle" };
  b2.border = { top: XL_MEDIUM, bottom: XL_THIN, left: XL_THIN, right: XL_MEDIUM };
  ["C2", "D2", "E2"].forEach((a) => (ws.getCell(a).border = { top: XL_MEDIUM, bottom: XL_THIN }));
  ["G2", "H2"].forEach((a) => {
    const c = ws.getCell(a);
    c.font = { name: XLFONT, size: 13, bold: true };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_MEDIUM, bottom: XL_MEDIUM };
  });

  // 3행: 헤더
  const r3 = ws.addRow(["행 레이블", "입수", product.name, "박스", "센터명", "낱개"]);
  r3.height = 24;
  const headerSize = { A: 11, B: 11, C: 13, D: 12, E: 11, F: 12 };
  ["A", "B", "C", "D", "E", "F"].forEach((col) => {
    const c = ws.getCell(`${col}3`);
    c.font = { name: XLFONT, size: headerSize[col], bold: true };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_THIN, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
  });

  let bandIndex = 0; // 지역 데이터 행에서만 증가시키는 흰색/회색 교차용 카운터
  function addRegionRow(r, flatIdx) {
    const { box, rem } = bd(r.qty);
    const row = ws.addRow([r.label, pack || "", r.qty, box, r.shortName || "", rem]);
    row.height = 26.25;
    const size = { A: 11, B: 11, C: 14, D: 12, E: 14, F: 12 };
    const bold = { A: false, B: false, C: true, D: false, E: true, F: false };
    const alignH = { A: "left", B: "center", C: "right", D: "center", E: "center", F: "center" };
    const isGray = bandIndex % 2 === 0;
    bandIndex++;
    ["A", "B", "C", "D", "E", "F"].forEach((col) => {
      const c = row.getCell(col);
      c.font = { name: XLFONT, size: size[col], bold: bold[col] };
      if (isGray) c.fill = XL_GRAY_FILL;
      c.alignment = { horizontal: alignH[col], vertical: "middle" };
      c.border = { top: XL_THIN, bottom: XL_THIN, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
    });
    // 체크포인트: 화주사가 지정한 특정 지역에서만 표시 (강릉·신광주2·아신A·김포3·도화2·신오산3)
    if (pack > 0 && r.checkpoint && flatIdx < flat.length - 1) {
      const remainingRem = remAfter[flatIdx + 1];
      const cpBox = Math.floor(remainingRem / pack);
      const cpRem = remainingRem - cpBox * pack;
      ["G", "H"].forEach((col) => {
        const c = row.getCell(col);
        c.font = { name: XLFONT, size: 11, bold: true };
        c.alignment = { horizontal: "center", vertical: "middle" };
        c.border = { top: XL_THIN, bottom: XL_THIN, left: col === "G" ? XL_THIN : undefined, right: XL_THIN };
      });
      row.getCell("G").value = cpBox;
      row.getCell("H").value = cpRem;
    }
  }

  function addTotalRow(label, qty) {
    const { box, rem } = bd(qty);
    const row = ws.addRow([label, pack || "", qty, box, "", rem]);
    row.height = 27;
    const alignH = { A: "center", B: "center", C: "right", D: "center", E: "center", F: "center" };
    ["A", "B", "C", "D", "E", "F"].forEach((col) => {
      const c = row.getCell(col);
      c.font = { name: XLFONT, size: 16, bold: true };
      c.alignment = { horizontal: alignH[col], vertical: "middle" };
      c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
    });
    return row;
  }

  let flatIdx = 0;
  ["A", "B", "미지정"].forEach((zone) => {
    const rows = product.regionRows.filter((r) => r.zone === zone);
    if (rows.length === 0) return;
    rows.forEach((r) => {
      addRegionRow(r, flatIdx);
      flatIdx++;
    });
    ws.addRow([]);
    addTotalRow(zone === "미지정" ? "미지정 지역 합계" : `${zone}구역 합계`, rows.reduce((a, r) => a + r.qty, 0));
    ws.addRow([]);
  });

  // 총합계 (전체를 하나로 합쳐 나눴을 때) + "소분박스/소분낱개" 라벨
  const grandRow = addTotalRow("총합계", product.totalQty);
  ["G", "H"].forEach((col) => {
    const c = grandRow.getCell(col);
    c.value = col === "G" ? "소분박스" : "소분낱개";
    c.font = { name: XLFONT, size: 12, bold: true };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: XL_THIN, right: XL_THIN };
  });

  // 대분(총 박스 수량, 지역별 박스 합) / 소분(총 낱개 수량, 지역별 낱개 합 → 다시 박스로 재환산)
  const totalBoxSum = flat.reduce((a, r) => a + bd(r.qty).box, 0);
  const totalRemSum = flat.reduce((a, r) => a + bd(r.qty).rem, 0);
  const subBox = pack > 0 ? Math.floor(totalRemSum / pack) : 0;
  const subRem = totalRemSum - subBox * pack;
  const finalRow = ws.addRow(["총 박스 수량 / 총 낱개 수량", "", "", totalBoxSum, "", totalRemSum, subBox, subRem]);
  finalRow.height = 27;
  const finalAlign = { A: "left", B: "center", C: "right", D: "center", E: "center", F: "center" };
  ["A", "B", "C", "D", "E", "F"].forEach((col) => {
    const c = finalRow.getCell(col);
    c.font = { name: XLFONT, size: 16, bold: true };
    c.alignment = { horizontal: finalAlign[col], vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
  });
  ["G", "H"].forEach((col) => {
    const c = finalRow.getCell(col);
    c.font = { name: XLFONT, size: 20, bold: true };
    c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFF00" } };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: XL_THIN, right: XL_THIN };
  });
}

async function downloadStyledInspectionExcel(products, filename, setBusy, date) {
  if (setBusy) setBusy(true);
  try {
    const workbook = new ExcelJS.Workbook();
    const usedNames = new Set();
    products.forEach((p) => addStyledInspectionSheet(workbook, p, usedNames, date));
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } finally {
    if (setBusy) setBusy(false);
  }
}

/* ================= 거래명세서(공급사별) 생성 - 저스트그린 실물 양식 기준 ================= */

function addDaysStr(dateStr, days) {
  const d = new Date(`${dateStr}T00:00:00`);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// buildProductsForDate() 결과(상품→지역별 수량)에서 특정 공급사만 골라
// "지역별로 어떤 상품을 얼마나 보냈는지"로 뒤집는다 (상품 기준 → 지역 기준).
function buildInvoiceRegionsForSupplier(products, supplierKey) {
  const supplierProducts = products.filter((p) => supplierGroupKey(p.supplier) === supplierKey);
  if (supplierProducts.length === 0) return [];

  const byRegion = {}; // code -> { code, order, items: [{name, packQty, qty}], totalQty }
  supplierProducts.forEach((p) => {
    p.regionRows.forEach((r) => {
      if (!REGION_ORDER_MAP[r.key]) return; // 고정 지역표에 없는 코드는 거래명세서 대상 아님
      if (!byRegion[r.key]) byRegion[r.key] = { code: r.key, order: r.order, items: [], totalQty: 0 };
      byRegion[r.key].items.push({ name: p.name, packQty: p.packQty, qty: r.qty });
      byRegion[r.key].totalQty += r.qty;
    });
  });

  // 실제로 뭐라도 나간(총수량 > 0) 지역만 거래명세서를 발행한다 (원본 샘플도 신제주처럼 0인 곳은 시트 자체가 없었음)
  return Object.values(byRegion)
    .filter((r) => r.totalQty > 0)
    .sort((a, b) => a.order - b.order);
}

// 거래명세서 1장(=지역 1곳) 시트. "공급받는자 보관용" + "공급자 보관용" 2부를 위아래로 반복해서 담는다.
function addStyledInvoiceSheet(workbook, region, supplierInfo, date, usedNames) {
  const info = REGION_ADDRESS_MAP[region.code] || { vvLabel: region.code, centerName: region.code, address: "(주소 미등록 - 나중에 REGION_ADDRESS_MAP에 추가 필요)" };
  const remarkDate = addDaysStr(date, 3); // 비고란 날짜 = 발주일 + 3일 (실제 명세서 원본에서 확인된 고정 간격)
  const ws = workbook.addWorksheet(safeSheetName(`${info.centerName}_${region.code}`, usedNames));
  ws.columns = [{ width: 13 }, { width: 15 }, { width: 15 }, { width: 10 }, { width: 10 }, { width: 15 }];
  ws.pageSetup = {
    orientation: "portrait",
    fitToPage: true,
    fitToWidth: 1,
    fitToHeight: 0,
    margins: { left: 0.4, right: 0.4, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 },
  };

  function headerCell(cell, { bold = true, size = 10.5, align = "center", fill } = {}) {
    cell.font = { name: XLFONT, size, bold };
    cell.alignment = { horizontal: align, vertical: "middle", wrapText: true };
    cell.border = { top: XL_THIN, bottom: XL_THIN, left: XL_THIN, right: XL_THIN };
    if (fill) cell.fill = XL_GRAY_FILL;
  }

  function addCopy(copyLabel) {
    const title = ws.addRow(["", `거 래 명 세 표 (${copyLabel})`, "", "", "", ""]);
    ws.mergeCells(`B${title.number}:E${title.number}`);
    title.getCell(2).font = { name: XLFONT, size: 15, bold: true };
    title.getCell(2).alignment = { horizontal: "center", vertical: "middle" };
    title.height = 26;

    // 공급받는자 / 공급자 정보 블록
    const r1 = ws.addRow(["등록번호", info.vvLabel, "", "등록번호", supplierInfo.regNo, ""]);
    ws.mergeCells(`B${r1.number}:C${r1.number}`);
    ws.mergeCells(`E${r1.number}:F${r1.number}`);
    headerCell(r1.getCell(1), { fill: true });
    headerCell(r1.getCell(2), { bold: false, align: "left" });
    headerCell(r1.getCell(4), { fill: true });
    headerCell(r1.getCell(5), { bold: false, align: "left" });

    const r2 = ws.addRow(["상호(법인명)", info.centerName, "", "상호(법인명)", supplierInfo.name, ""]);
    ws.mergeCells(`B${r2.number}:C${r2.number}`);
    ws.mergeCells(`E${r2.number}:F${r2.number}`);
    headerCell(r2.getCell(1), { fill: true });
    headerCell(r2.getCell(2), { bold: false, align: "left" });
    headerCell(r2.getCell(4), { fill: true });
    headerCell(r2.getCell(5), { bold: false, align: "left" });

    const r3 = ws.addRow(["사업장주소", info.address, "", "사업장주소", supplierInfo.address, ""]);
    r3.height = 30;
    ws.mergeCells(`B${r3.number}:C${r3.number}`);
    ws.mergeCells(`E${r3.number}:F${r3.number}`);
    headerCell(r3.getCell(1), { fill: true });
    headerCell(r3.getCell(2), { bold: false, align: "left" });
    headerCell(r3.getCell(4), { fill: true });
    headerCell(r3.getCell(5), { bold: false, align: "left" });

    const r4 = ws.addRow(["", "", "", "업태 / 종목", `${supplierInfo.bizType} / ${supplierInfo.bizItem}`, ""]);
    ws.mergeCells(`E${r4.number}:F${r4.number}`);
    headerCell(r4.getCell(4), { fill: true });
    headerCell(r4.getCell(5), { bold: false, align: "left" });
    [1, 2, 3].forEach((c) => (r4.getCell(c).border = undefined));

    // 품목 테이블 헤더
    const th = ws.addRow(["년월일", "품목", "", "입수", "수량", "비고"]);
    ws.mergeCells(`B${th.number}:C${th.number}`);
    [1, 2, 4, 5, 6].forEach((c) => headerCell(th.getCell(c), { fill: true }));

    let bandIndex = 0;
    region.items.forEach((item, idx) => {
      const row = ws.addRow([idx === 0 ? date : "", item.name, "", item.packQty || "", item.qty, remarkDate]);
      ws.mergeCells(`B${row.number}:C${row.number}`);
      const isGray = bandIndex % 2 === 0;
      bandIndex++;
      [1, 2, 4, 5, 6].forEach((c) => {
        const cell = row.getCell(c);
        cell.font = { name: XLFONT, size: 10.5 };
        cell.alignment = { horizontal: c === 2 ? "left" : "center", vertical: "middle" };
        cell.border = { top: XL_THIN, bottom: XL_THIN, left: XL_THIN, right: XL_THIN };
        if (isGray) cell.fill = XL_GRAY_FILL;
      });
      row.getCell(1).numFmt = "yyyy-mm-dd";
      row.getCell(6).numFmt = "yyyy-mm-dd";

    totalRow.getCell(5).border = { top: XL_MEDIUM, bottom: XL_MEDIUM, left: XL_THIN, right: XL_THIN };

    const footer = ws.addRow([supplierInfo.agent.replace(/\n/g, " "), "", "", info.address, "", ""]);
    ws.mergeCells(`A${footer.number}:C${footer.number}`);
    ws.mergeCells(`D${footer.number}:F${footer.number}`);
    footer.height = 26;
    footer.getCell(1).font = { name: XLFONT, size: 9.5 };

    footer.getCell(4).font = { name: XLFONT, size: 9.5 };
    footer.getCell(4).alignment = { horizontal: "left", vertical: "middle", wrapText: true };

    ws.addRow([]);
    ws.addRow([]);
  }

  addCopy("공급받는자 보관용");
  addCopy("공급자 보관용");
}

async function downloadSupplierInvoiceExcel(products, supplierKey, date, filename, setBusy) {
  if (setBusy) setBusy(true);
  try {
    const info = SUPPLIER_INVOICE_INFO[supplierKey];
    if (!info) throw new Error(`"${supplierKey}"의 거래명세서용 사업자 정보가 아직 등록되지 않았어요. (SUPPLIER_INVOICE_INFO에 추가 필요)`);
    const regions = buildInvoiceRegionsForSupplier(products, supplierKey);
    if (regions.length === 0) throw new Error(`${date}에 "${supplierKey}" 발주가 없어서 거래명세서를 만들 수 없어요.`);
    const workbook = new ExcelJS.Workbook();
    const usedNames = new Set();
    regions.forEach((r) => addStyledInvoiceSheet(workbook, r, info, date, usedNames));
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } finally {
    if (setBusy) setBusy(false);
  }
}

/* ================= 품목별 검수표 (상품 → 지역별 수량 breakdown, 고정 순서/구역 기준) ================= */
// 화주사 기준표의 A/B 구역 그대로 사용 (임의 반분 없음). 기준표에 없는 지역은 "미지정"으로 맨 뒤에 붙음
function buildTableRowsForProduct(product) {
  if (!product) return [];
  const bd = (q) => (product.packQty > 0 ? { box: Math.floor(q / product.packQty), rem: q % product.packQty } : { box: 0, rem: q });
  const zoneOrder = ["A", "B", "미지정"];
  const out = [];
  zoneOrder.forEach((zone) => {
    const rows = product.regionRows.filter((r) => r.zone === zone);
    if (rows.length === 0) return;
    rows.forEach((r) => out.push({ type: "region", ...r, ...bd(r.qty) }));
    const zoneTotalQty = rows.reduce((a, r) => a + r.qty, 0);
    out.push({ type: "zoneTotal", label: zone === "미지정" ? "미지정 지역 합계" : `${zone}구역 합계`, qty: zoneTotalQty, ...bd(zoneTotalQty) });
  });
  return out;
}

// 엑셀 다운로드와 완전히 동일한 계산(체크포인트, 대분/소분)을 그대로 반영한 데이터 빌더
function buildFullInspectionData(product) {
  const pack = product.packQty || 0;
  const bd = (q) => (pack > 0 ? { box: Math.floor(q / pack), rem: q % pack } : { box: 0, rem: q });
  const flat = [];
  ["A", "B", "미지정"].forEach((zone) => {
    product.regionRows.filter((r) => r.zone === zone).forEach((r) => flat.push({ ...r, zone }));
  });
  const remAfter = new Array(flat.length + 1).fill(0);
  for (let i = flat.length - 1; i >= 0; i--) remAfter[i] = remAfter[i + 1] + bd(flat[i].qty).rem;

  let bandIndex = 0;
  const zones = [];
  ["A", "B", "미지정"].forEach((zone) => {
    const rows = product.regionRows.filter((r) => r.zone === zone);
    if (rows.length === 0) return;
    const zoneRows = rows.map((r) => {
      const flatIdx = flat.findIndex((f) => f.key === r.key && f.zone === zone);
      const { box, rem } = bd(r.qty);
      const isGray = bandIndex % 2 === 0;
      bandIndex++;
      let checkpoint = null;
      if (pack > 0 && r.checkpoint && flatIdx < flat.length - 1) {
        const remainingRem = remAfter[flatIdx + 1];
        const cpBox = Math.floor(remainingRem / pack);
        checkpoint = { box: cpBox, rem: remainingRem - cpBox * pack };
      }
      return { ...r, box, rem, isGray, checkpoint };
    });
    const zoneTotalQty = rows.reduce((a, r) => a + r.qty, 0);
    zones.push({ zone, rows: zoneRows, total: { qty: zoneTotalQty, ...bd(zoneTotalQty) } });
  });

  const grand = bd(product.totalQty);
  const totalBoxSum = flat.reduce((a, r) => a + bd(r.qty).box, 0);
  const totalRemSum = flat.reduce((a, r) => a + bd(r.qty).rem, 0);
  const subBox = pack > 0 ? Math.floor(totalRemSum / pack) : 0;
  const subRem = totalRemSum - subBox * pack;

  return { zones, grand, totalBoxSum, totalRemSum, sub: { box: subBox, rem: subRem } };
}

// 발주번호는 무시하고, 상품(SKU) 기준으로 지역(납품처)별 수량을 집계 (특정 날짜 하나만).
// 피킹지시서 출력과 거래명세서 생성이 공통으로 쓰는 핵심 집계 함수.
function buildProductsForDate(orders, activeDate) {
  const bySku = {};
  // 발주파일에 업로드된 순서(seq) 그대로 처리 - 화면에 뜨는 상품 순서가 파일 순서와 같아지도록 함
  const ordered = [...orders].sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));

  // 지역코드 -> 정식 매장명(발주파일에 실제로 찍혀온 이름). 이 상품엔 발주가 0건이라도
  // 다른 상품이 같은 지역으로 나갔다면 그 이름을 그대로 재사용한다.
  const regionLabelMap = {};
  orders.forEach((o) => {
    const regionKey = o.storeCode || o.customer;
    if (!regionKey || regionLabelMap[regionKey]) return;
    regionLabelMap[regionKey] = o.storeCode ? `${o.storeCode} ${o.customer}` : o.customer;
  });

  ordered.forEach((o) => {
    if (o.status === "NEW") return; // 아직 할당 전인 발주는 제외
    if (activeDate && o.createdAt !== activeDate) return; // 다른 날짜 발주는 제외
    const regionKey = o.storeCode || o.customer;
    const ref = REGION_ORDER_MAP[regionKey];
    const regionLabel = o.storeCode ? `${o.storeCode} ${o.customer}` : o.customer;
    o.lines.forEach((l) => {
      if (l.allocatedQty <= 0) return;
      if (!bySku[l.sku]) bySku[l.sku] = { sku: l.sku, name: l.name, packQty: l.packQty, supplier: o.supplier || "", regions: {} };
      if (!bySku[l.sku].regions[regionKey]) {
        bySku[l.sku].regions[regionKey] = {
          key: regionKey,
          label: regionLabel,
          shortName: ref ? ref.shortName : null,
          zone: ref ? ref.zone : "미지정",
          order: ref ? ref.order : 9999,
          checkpoint: ref ? ref.checkpoint : false,
          qty: 0,
        };
      }
      bySku[l.sku].regions[regionKey].qty += l.allocatedQty;
    });
  });
  // 이름순 정렬 없이, 위에서 처음 등장한 순서(=발주파일 업로드 순서)를 기본으로 하되
  // 1편이 전부 먼저, 2편이 전부 나중에 오도록 다시 묶음 (그룹 안에서는 업로드 순서 유지)
  return Object.values(bySku)
    .map((p) => {
      // 오피킹 방지 고정 지역표(A/B구역 37곳)는 이 상품에 발주가 없어도 항상 0으로 표시
      REGION_ORDER_TABLE.forEach((r) => {
        if (p.regions[r.code]) return;
        p.regions[r.code] = {
          key: r.code,
          label: regionLabelMap[r.code] || `${r.code} ${r.name}`,
          shortName: r.name,
          zone: r.zone,
          order: REGION_ORDER_MAP[r.code].order,
          checkpoint: !!r.checkpoint,
          qty: 0,
        };
      });
      const regionRows = Object.values(p.regions).sort((a, b) => a.order - b.order || a.label.localeCompare(b.label));
      const totalQty = regionRows.reduce((a, r) => a + r.qty, 0);
      return { ...p, regionRows, totalQty, part: detectPart(p.name) };
    })
    .sort((a, b) => supplierPriority(a.supplier) - supplierPriority(b.supplier) || a.part - b.part);
}

function PickingInspection({ orders }) {
  const [selectedSku, setSelectedSku] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [printMode, setPrintMode] = useState(null); // null | "single" | "all"
  const [supplierFilter, setSupplierFilter] = useState("all");
  const [searchQuery, setSearchQuery] = useState("");

  useEffect(() => {
    if (!printMode) return;
    document.body.classList.add("portal-printing");
    const timer = setTimeout(() => window.print(), 150);
    const onAfterPrint = () => {
      document.body.classList.remove("portal-printing");
      setPrintMode(null);
    };
    window.addEventListener("afterprint", onAfterPrint);
    return () => {
      clearTimeout(timer);
      window.removeEventListener("afterprint", onAfterPrint);
      document.body.classList.remove("portal-printing");
    };
  }, [printMode]);

  // 피킹은 날짜 단위 작업이므로, 날짜를 하나 선택해서 그 날짜의 발주만 집계
  const dateOptions = useMemo(() => {
    const set = new Set(orders.map((o) => o.createdAt));
    return Array.from(set).sort((a, b) => (a < b ? 1 : -1));
  }, [orders]);
  const [selectedDate, setSelectedDate] = useState(null);
  const activeDate = selectedDate && dateOptions.includes(selectedDate) ? selectedDate : dateOptions[0] || null;

  const products = useMemo(() => buildProductsForDate(orders, activeDate), [orders, activeDate]);


  // 필터 드롭다운에 뿌릴 공급사 목록 (이 날짜에 실제로 존재하는 공급사만, 같은 회사는 하나로 묶어서, 고정 순서표 순으로)
  const supplierOptions = useMemo(() => {
    const set = new Set(products.map((p) => supplierGroupKey(p.supplier)));
    return Array.from(set).sort((a, b) => supplierPriority(a) - supplierPriority(b) || a.localeCompare(b));
  }, [products]);

  // 공급사 선택 + 상품명/코드 검색어로 좌측 목록을 좁힘. 이 결과가 그대로 엑셀 일괄 다운로드 대상이 됨.
  const filteredProducts = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return products.filter((p) => {
      if (supplierFilter !== "all" && supplierGroupKey(p.supplier) !== supplierFilter) return false;
      if (q && !p.name.toLowerCase().includes(q) && !String(p.sku).toLowerCase().includes(q)) return false;
      return true;
    });
  }, [products, supplierFilter, searchQuery]);

  const selected = products.find((p) => p.sku === selectedSku) || filteredProducts[0] || products[0] || null;

  return (
    <div>
      <PageHeader title="피킹지시서 출력" sub="발주번호와 상관없이, 상품 하나를 기준으로 화주사 지정 순서·A/B구역대로 지역별 수량을 정리합니다" />
      {dateOptions.length === 0 ? (
        <div style={cardStyle}>
          <EmptyRow text="할당된 품목이 없습니다. 먼저 발주파일을 업로드해주세요." />
        </div>
      ) : (
        <>
          <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: T.inkSoft }}>피킹 날짜</span>
            <select style={{ ...inputStyle, width: 200 }} value={activeDate || ""} onChange={(e) => { setSelectedDate(e.target.value); setSelectedSku(null); }}>
              {dateOptions.map((d) => (
                <option key={d} value={d}>
                  {fmtDate(d)}
                </option>
              ))}
            </select>
            <span style={{ fontSize: 12, color: T.inkSoft }}>※ 선택한 날짜의 발주만 집계합니다 (다른 날짜와 섞이지 않음)</span>
          </div>
          {products.length === 0 ? (
            <div style={cardStyle}>
              <EmptyRow text="이 날짜에 할당된 품목이 없습니다." />

                        setExporting,
                        activeDate

                    disabled={exporting || filteredProducts.length === 0}
                    className="primary-btn"
                    style={{ ...primaryBtnStyle, flex: 1, justifyContent: "center", opacity: exporting || filteredProducts.length === 0 ? 0.7 : 1 }}
                  >
                    <Download size={15} />{" "}
                    {exporting

                      : supplierFilter !== "all" || searchQuery
                      ? `필터 결과만 엑셀 (${filteredProducts.length}개 시트)`
                      : `엑셀 (${products.length}개 시트)`}
                  </button>
                  <button
                    disabled
                    title="인쇄/PDF 디자인을 다듬는 중이에요. 지금은 엑셀 다운로드를 이용해주세요."
                    className="ghost-btn"
                    style={{ ...smallBtnStyle, flex: 1, justifyContent: "center", opacity: 0.5, cursor: "not-allowed" }}

                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                  <select

                    onChange={(e) => setSupplierFilter(e.target.value)}

                    <option value="all">전체 공급사 ({products.length})</option>
                    {supplierOptions.map((s) => (
                      <option key={s} value={s}>
                        {s} ({products.filter((p) => supplierGroupKey(p.supplier) === s).length})
                      </option>
                    ))}
                  </select>
                  <div style={{ position: "relative" }}>
                    <Search size={14} style={{ position: "absolute", left: 9, top: 10, color: T.inkSoft }} />
                    <input
                      style={{ ...inputStyle, width: "100%", paddingLeft: 28 }}
                      placeholder="상품명 또는 상품코드 검색"
                      value={searchQuery}

                    />
                  </div>
                  {(supplierFilter !== "all" || searchQuery) && (

                      <span>{filteredProducts.length}개 표시 중</span>

                    <button
                      key={p.sku}
                      onClick={() => setSelectedSku(p.sku)}
                      className="rowhover"

                        <div style={{ fontSize: 13, fontWeight: 600 }}>{p.name}</div>

                      <div style={{ fontSize: 11, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace", marginTop: 2 }}>

  );
}

/* ================= 거래명세서 ================= */
function InvoiceView({ orders }) {
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const invoiced = orders.filter((o) => o.invoiceIssued);
  const filtered = invoiced.filter((o) => !query || o.orderNo.toLowerCase().includes(query.toLowerCase()) || o.customer.includes(query));
  const selected = invoiced.find((o) => o.id === selectedId) || null;

  // 공급사별 거래명세서 일괄 생성 (사업자 정보가 SUPPLIER_INVOICE_INFO에 등록된 공급사만 가능 - 현재는 저스트그린)
  const dateOptions = useMemo(() => {
    const set = new Set(orders.map((o) => o.createdAt));
    return Array.from(set).sort((a, b) => (a < b ? 1 : -1));
  }, [orders]);
  const [invoiceDate, setInvoiceDate] = useState(null);
  const activeInvoiceDate = invoiceDate && dateOptions.includes(invoiceDate) ? invoiceDate : dateOptions[0] || null;
  const invoiceProducts = useMemo(() => buildProductsForDate(orders, activeInvoiceDate), [orders, activeInvoiceDate]);
  const invoiceSupplierOptions = useMemo(() => {
    const set = new Set(invoiceProducts.map((p) => supplierGroupKey(p.supplier)));
    return Array.from(set)
      .filter((s) => SUPPLIER_INVOICE_INFO[s])
      .sort((a, b) => supplierPriority(a) - supplierPriority(b));
  }, [invoiceProducts]);
  const [invoiceSupplier, setInvoiceSupplier] = useState(null);
  const activeInvoiceSupplier = invoiceSupplierOptions.includes(invoiceSupplier) ? invoiceSupplier : invoiceSupplierOptions[0] || null;
  const [invoiceBusy, setInvoiceBusy] = useState(false);
  const [invoiceErr, setInvoiceErr] = useState("");
  const invoiceRegions = useMemo(
    () => (activeInvoiceSupplier ? buildInvoiceRegionsForSupplier(invoiceProducts, activeInvoiceSupplier) : []),
    [invoiceProducts, activeInvoiceSupplier]
  );

  async function handleGenerateInvoice() {
    if (!activeInvoiceDate || !activeInvoiceSupplier) return;
    setInvoiceErr("");
    try {
      await downloadSupplierInvoiceExcel(
        invoiceProducts,
        activeInvoiceSupplier,
        activeInvoiceDate,
        `거래명세서_${activeInvoiceSupplier}_${activeInvoiceDate}.xlsx`,
        setInvoiceBusy
      );
    } catch (e) {
      setInvoiceErr(e.message);
    }
  }

  return (
    <div>
      <PageHeader title="거래명세서" sub="출고 완료된 발주의 거래명세서를 조회·출력합니다 (추후 자동 발행으로 고도화 예정)" />

      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>공급사별 거래명세서 일괄 생성</div>
        <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 14 }}>
          선택한 날짜에 그 공급사 상품을 받은 지역마다 거래명세서(공급받는자/공급자 보관용 2부)를 자동으로 만들어요. 총수량은 피킹지시서와 항상 일치합니다.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <Field label="날짜">
            <select style={inputStyle} value={activeInvoiceDate || ""} onChange={(e) => setInvoiceDate(e.target.value)}>
              {dateOptions.length === 0 && <option value="">발주 없음</option>}
              {dateOptions.map((d) => (
                <option key={d} value={d}>
                  {fmtDate(d)}
                </option>
              ))}
            </select>
          </Field>
          <Field label="공급사">
            <select style={inputStyle} value={activeInvoiceSupplier || ""} onChange={(e) => setInvoiceSupplier(e.target.value)}>
              {invoiceSupplierOptions.length === 0 && <option value="">해당 없음</option>}
              {invoiceSupplierOptions.map((s) => (
                <option key={s} value={s}>
                  {s}
                </option>
              ))}
            </select>
          </Field>
          <button
            onClick={handleGenerateInvoice}
            disabled={invoiceBusy || !activeInvoiceSupplier || invoiceRegions.length === 0}
            className="primary-btn"
            style={{ ...primaryBtnStyle, opacity: invoiceBusy || !activeInvoiceSupplier || invoiceRegions.length === 0 ? 0.6 : 1 }}
          >
            <Download size={15} /> {invoiceBusy ? "생성 중..." : `거래명세서 생성 (${invoiceRegions.length}개 지역)`}
          </button>
        </div>
        {invoiceErr && <div style={{ marginTop: 10, fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{invoiceErr}</div>}
        {!invoiceErr && activeInvoiceSupplier && invoiceRegions.length === 0 && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: T.inkSoft }}>이 날짜엔 {activeInvoiceSupplier} 발주가 없어요.</div>
        )}
        {!invoiceErr && invoiceSupplierOptions.length === 0 && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: T.inkSoft }}>
            이 날짜엔 사업자 정보가 등록된 공급사(현재는 저스트그린만) 발주가 없어요.
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 320px" }}>
          <div style={{ position: "relative", marginBottom: 12 }}>
            <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
            <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="발주번호 또는 발주처 검색" value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden", maxHeight: 480, overflowY: "auto" }}>
            {filtered.length === 0 ? (
              <EmptyRow text="출고 완료(거래명세서 발행)된 발주가 없습니다." />
            ) : (
              filtered.map((o) => (
                <button
                  key={o.id}
                  onClick={() => setSelectedId(o.id)}
                  className="rowhover"
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "12px 14px", border: "none", background: selectedId === o.id ? T.bg : "transparent", borderBottom: `1px solid #EEECE3`, cursor: "pointer", fontFamily: "inherit" }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 13 }}>{o.orderNo}</span>
                    <OrderStatusPill status={o.status} />
                  </div>
                  <div style={{ fontSize: 11.5, color: T.inkSoft, marginTop: 2 }}>
                    {o.customer} · {fmtDate(o.createdAt)}
                  </div>
                </button>
              ))
            )}
          </div>
        </div>
        <div style={{ flex: "1 1 380px" }}>
          {!selected ? (
            <div style={cardStyle}>
              <div style={{ fontSize: 13, color: T.inkSoft }}>왼쪽 목록에서 발주를 선택하세요.</div>
            </div>
          ) : (
            <div style={cardStyle} className="print-area">
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 16 }}>거래명세서</div>
                  <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 2 }}>{fmtDate(selected.completedAt || selected.createdAt)}</div>
                </div>
                <button onClick={() => window.print()} className="ghost-btn no-print" style={smallBtnStyle}>
                  <Printer size={14} /> 출력하기
                </button>
              </div>
              <div style={{ fontSize: 13, color: T.inkSoft, marginBottom: 4 }}>발주번호: <b style={{ color: T.ink }}>{selected.orderNo}</b></div>
              <div style={{ fontSize: 13, color: T.inkSoft, marginBottom: 4 }}>발주처: <b style={{ color: T.ink }}>{selected.customer}</b></div>
              <div style={{ fontSize: 13, color: T.inkSoft, marginBottom: 12 }}>공급사: <b style={{ color: T.ink }}>{selected.supplier || "-"}</b></div>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>SKU</th>
                      <th>품목명</th>
                      <th>수량</th>
                      <th>로케이션</th>
                    </tr>
                  </thead>
                  <tbody>
                    {selected.lines
                      .filter((l) => l.allocatedQty > 0)
                      .map((l) => (
                        <tr key={l.sku}>
                          <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{l.sku}</td>
                          <td style={{ fontWeight: 600 }}>{l.name}</td>
                          <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>
                            {l.allocatedQty} {l.unit}
                          </td>
                          <td>
                            <LocationTag loc={l.location} />
                          </td>
                        </tr>
                      ))}
                  </tbody>
                </table>
              </div>
              <div style={{ fontSize: 11, color: T.inkSoft, marginTop: 12 }}>
                * 현재는 수량 기준 명세서입니다. 단가·금액 자동 반영은 추후 화주사 단가 정보 연동 후 지원됩니다.
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ================= VII. 출고처리 ================= */
function Shipping({ orders, stores, onShip, onCancelShip, onConfirmPms }) {
  const [storeFilter, setStoreFilter] = useState("전체");
  const [checked, setChecked] = useState({});
  const [expanded, setExpanded] = useState(null);
  const relevant = orders.filter((o) => ["PICK_CONFIRMED", "SHIPPED", "DONE"].includes(o.status) && (storeFilter === "전체" || o.customer === storeFilter));
  const anyChecked = Object.values(checked).some(Boolean);

  function shipSelected() {
    orders.forEach((o) => {
      if (checked[o.id] && o.status === "PICK_CONFIRMED") onShip(o.id);
    });
    setChecked({});
  }

  return (
    <div>
      <PageHeader title="VII. 출고처리" sub="피킹 확정된 발주를 매장(관할센터)별로 출고 처리합니다" />
      <div style={{ display: "flex", gap: 10, marginBottom: 12, alignItems: "center", flexWrap: "wrap" }}>
        <select style={{ ...inputStyle, width: 200 }} value={storeFilter} onChange={(e) => setStoreFilter(e.target.value)}>
          <option>전체</option>
          {stores.map((s) => (
            <option key={s.id}>{s.name}</option>
          ))}
        </select>
        {anyChecked && (
          <button onClick={shipSelected} className="primary-btn" style={primaryBtnStyle}>
            <Truck size={15} /> 선택 항목 출고처리
          </button>
        )}
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th></th>
              <th>발주번호</th>
              <th>발주처</th>
              <th>상태</th>
              <th>PMS 전송</th>
              <th>거래명세서</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {relevant.length === 0 ? (
              <tr>
                <td colSpan={7}>
                  <EmptyRow text="출고 대상 발주가 없습니다." />
                </td>
              </tr>
            ) : (
              relevant.map((o) => (
                <React.Fragment key={o.id}>
                  <tr>
                    <td>
                      {o.status === "PICK_CONFIRMED" && (
                        <input type="checkbox" checked={!!checked[o.id]} onChange={(e) => setChecked((prev) => ({ ...prev, [o.id]: e.target.checked }))} />
                      )}
                    </td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{o.orderNo}</td>
                    <td>{o.customer}</td>
                    <td>
                      <OrderStatusPill status={o.status} />
                    </td>
                    <td>{o.pmsStatus || "-"}</td>
                    <td>{o.invoiceIssued ? "발행됨" : "-"}</td>
                    <td>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {o.invoiceIssued && (
                          <button onClick={() => setExpanded(expanded === o.id ? null : o.id)} className="ghost-btn" style={{ ...smallBtnStyle, padding: "6px 10px" }}>
                            거래명세서
                          </button>
                        )}
                        {o.status === "SHIPPED" && (
                          <>
                            <button onClick={() => onConfirmPms(o.id)} className="ghost-btn" style={{ ...smallBtnStyle, padding: "6px 10px", color: T.tealDeep }}>
                              출고확정(PMS전송)
                            </button>
                            <button onClick={() => onCancelShip(o.id)} className="ghost-btn" style={{ ...smallBtnStyle, padding: "6px 10px", color: T.danger }}>
                              출고취소
                            </button>
                          </>
                        )}
                      </div>
                    </td>
                  </tr>
                  {expanded === o.id && (
                    <tr>
                      <td colSpan={7} style={{ background: T.bg }}>
                        <div style={{ padding: "10px 6px" }}>
                          <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>거래명세서 - {o.orderNo}</div>
                          {o.lines
                            .filter((l) => l.allocatedQty > 0)
                            .map((l) => (
                              <div key={l.sku} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "4px 0", color: T.inkSoft }}>
                                <span>{l.name} ({l.sku})</span>
                                <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{l.allocatedQty} {l.unit}</span>
                              </div>
                            ))}
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= VIII. 기준정보체크 ================= */
function MasterDataCheck({ items, stores, vehicles, courses, cells }) {
  const unmappedStores = stores.filter((s) => !s.vehicleId);
  const itemIssues = items.filter((i) => !i.tempZone || !i.workType || !i.location);
  const usedVehicleIds = new Set([...stores.map((s) => s.vehicleId), ...courses.map((c) => c.vehicleId)].filter(Boolean));
  const unmappedVehicles = vehicles.filter((v) => !usedVehicleIds.has(v.id));
  const locRegex = /^[A-Za-z]{1,2}-\d{2}-\d{2}$/;
  const locationIssues = items.filter((i) => !locRegex.test(i.location || ""));

  const Section = ({ title, rows, renderRow, empty }) => (

  return (

      />
      <Section
        title="품목정보 - 필수정보 누락 품목"

          </div>

      />
      <Section
        title="차량정보 - 매장/코스 미매핑 차량"

        empty="모든 차량이 매장 또는 배송코스에 매핑되어 있습니다."
        renderRow={(v) => (
          <div key={v.id} style={{ fontSize: 12.5, padding: "6px 10px", background: T.bg, borderRadius: 6 }}>

      <Section

}

function ProductMaster({ items, onSave, onCreate, onDelete }) {
  const [selectedSku, setSelectedSku] = useState(items[0]?.sku || null);
  const [query, setQuery] = useState("");
  const [form, setForm] = useState(null);
  const [mode, setMode] = useState("edit"); // "edit" | "create"
  const [createForm, setCreateForm] = useState({ sku: "", name: "", category: "", tempZone: TEMP_ZONES[0], workType: WORK_TYPES[0], location: "", unit: "EA", unitQty: 1, boxQty: 1, cbm: 0, qty: 0, safety: 0 });
  const [createErr, setCreateErr] = useState("");

  const selected = items.find((i) => i.sku === selectedSku) || null;
  const filtered = items.filter((i) => !query || i.name.includes(query) || i.sku.toLowerCase().includes(query.toLowerCase()));

  function openEdit(item) {
    setMode("edit");
    setSelectedSku(item.sku);
    setForm({ tempZone: item.tempZone, workType: item.workType, location: item.location, unitQty: item.unitQty, boxQty: item.boxQty, cbm: item.cbm, qty: item.qty });
  }
  function save() {
    if (!selected || !form) return;
    onSave(selected.sku, form);
  }
  function submitCreate() {
    setCreateErr("");
    if (!createForm.sku.trim() || !createForm.name.trim()) return setCreateErr("SKU와 품목명은 필수입니다.");
    if (items.some((i) => i.sku === createForm.sku.trim())) return setCreateErr("이미 존재하는 SKU입니다.");
    onCreate({ ...createForm, sku: createForm.sku.trim(), location: createForm.location.trim() || "미배정" });
    setCreateForm({ sku: "", name: "", category: "", tempZone: TEMP_ZONES[0], workType: WORK_TYPES[0], location: "", unit: "EA", unitQty: 1, boxQty: 1, cbm: 0, qty: 0, safety: 0 });

  return (
    <div>

              <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="품목명 또는 SKU 검색" value={query} onChange={(e) => setQuery(e.target.value)} />

            <table>

                <tr>
                  <th>SKU</th>
                  <th>품목명</th>
                  <th>온도구역</th>
                  <th>작업유형</th>
                  <th>로케이션</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr>
                    <td colSpan={6}>
                      <EmptyRow text="등록된 품목이 없습니다." />
                    </td>
                  </tr>
                ) : (
                  filtered.map((i) => (
                    <tr key={i.id} className="rowhover">
                      <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{i.sku}</td>
                      <td style={{ fontWeight: 600 }}>{i.name}</td>
                      <td>{i.tempZone}</td>
                      <td>{i.workType}</td>
                      <td>
                        <LocationTag loc={i.location} />

                      <td>

                  <input style={inputStyle} value={createForm.name} onChange={(e) => setCreateForm({ ...createForm, name: e.target.value })} placeholder="품목명을 입력하세요" />

                </Field>
                <div className="field-row" style={{ display: "flex", gap: 10 }}>
                  <Field label="낱개단위">
                    <input style={inputStyle} type="number" value={createForm.unitQty} onChange={(e) => setCreateForm({ ...createForm, unitQty: Number(e.target.value) })} />
                  </Field>
                  <Field label="박스단위(입수)">
                    <input style={inputStyle} type="number" value={createForm.boxQty} onChange={(e) => setCreateForm({ ...createForm, boxQty: Number(e.target.value) })} />

                <div className="field-row" style={{ display: "flex", gap: 10 }}>

/* ================= XI. 창고CELL ================= */
function WarehouseCell({ cells, onAdd, onDelete }) {
  const [area, setArea] = useState("");
  const [startFloor, setStartFloor] = useState(1);
  const [endFloor, setEndFloor] = useState(4);
  const [cellCount, setCellCount] = useState(10);
  const [pickZoneDefault, setPickZoneDefault] = useState(true);
  const [err, setErr] = useState("");

  function submit() {
    setErr("");
    if (!area.trim()) return setErr("AREA 코드를 입력해주세요.");
    if (endFloor < startFloor) return setErr("끝 계층은 시작 계층보다 크거나 같아야 합니다.");
    onAdd({ area: area.trim().toUpperCase(), startFloor: Number(startFloor), endFloor: Number(endFloor), cellCount: Number(cellCount), pickZoneDefault });
    setArea("");
  }

  return (
    <div>
      <PageHeader title="XI. 창고CELL" sub="AREA·계층·셀 구조로 랙 로케이션 범위를 설정합니다 (예: AA-01-01 ~ AA-10-04)" />
      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div className="field-row" style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <Field label="AREA">
            <input style={{ ...inputStyle, width: 100 }} value={area} onChange={(e) => setArea(e.target.value)} placeholder="AA" />
          </Field>
          <Field label="시작 계층">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={startFloor} onChange={(e) => setStartFloor(e.target.value)} />
          </Field>
          <Field label="끝 계층">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={endFloor} onChange={(e) => setEndFloor(e.target.value)} />
          </Field>
          <Field label="셀 (개수)">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={cellCount} onChange={(e) => setCellCount(e.target.value)} />
          </Field>
          <Field label="피킹존 기본값">
            <label style={{ display: "flex", alignItems: "center", gap: 6, height: 38, fontSize: 13 }}>
              <input type="checkbox" checked={pickZoneDefault} onChange={(e) => setPickZoneDefault(e.target.checked)} /> 01번 셀 피킹존
            </label>
          </Field>
        </div>
        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600, marginTop: 10 }}>{err}</div>}
        <button onClick={submit} className="primary-btn" style={{ ...primaryBtnStyle, marginTop: 12 }}>
          <Plus size={14} /> CELL 생성
        </button>
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>AREA</th>
              <th>계층 범위</th>
              <th>셀 개수</th>
              <th>예상 로케이션 수</th>
              <th>피킹존 기본</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {cells.length === 0 ? (
              <tr>
                <td colSpan={6}>
                  <EmptyRow text="등록된 CELL 구조가 없습니다." />
                </td>
              </tr>
            ) : (
              cells.map((c) => (
                <tr key={c.id}>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{c.area}</td>
                  <td>
                    {c.area}-01-{String(c.startFloor).padStart(2, "0")} ~ {c.area}-{String(c.cellCount).padStart(2, "0")}-{String(c.endFloor).padStart(2, "0")}
                  </td>
                  <td>{c.cellCount}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{(c.endFloor - c.startFloor + 1) * c.cellCount}</td>
                  <td>{c.pickZoneDefault ? "01번 셀" : "-"}</td>
                  <td>
                    <button onClick={() => onDelete(c.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.danger }}>
                      <Trash2 size={15} />
                    </button>
                  </td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

            <select style={{ ...inputStyle, width: 100 }} value={name} onChange={(e) => setName(e.target.value)}>
              {COURSE_NAMES.map((c) => (
                <option key={c}>{c}</option>
              ))}
            </select>
          </Field>
          <Field label="차량">
            <select style={{ ...inputStyle, width: 220 }} value={vehicleId} onChange={(e) => setVehicleId(e.target.value)}>
              {vehicles.map((v) => (
                <option key={v.id} value={v.id}>
                  {v.name}
                </option>
              ))}
            </select>
          </Field>
          <Field label="차수">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={round} onChange={(e) => setRound(e.target.value)} />
          </Field>
        </div>
        <button onClick={submit} className="primary-btn" style={{ ...primaryBtnStyle, marginTop: 12 }}>
          <Plus size={14} /> 차량차수 맵핑 추가
        </button>
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>코스</th>
              <th>차량</th>
              <th>차수</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {courses.length === 0 ? (
              <tr>
                <td colSpan={4}>
                  <EmptyRow text="등록된 배송코스가 없습니다." />
                </td>
              </tr>
            ) : (
              courses.map((c) => (
                <tr key={c.id}>
                  <td style={{ fontWeight: 700 }}>{c.name}</td>
                  <td>{vehicleName(c.vehicleId)}</td>
                  <td>{c.round}차</td>
                  <td>
                    <button onClick={() => onDelete(c.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.danger }}>
                      <Trash2 size={15} />
                    </button>
                  </td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- inbound ---------- */
function Inbound({ items, onSubmit }) {
  const [mode, setMode] = useState("existing");
  const [sku, setSku] = useState(items[0]?.sku || "");
  const [qty, setQty] = useState("");
  const [location, setLocation] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayStr());
  const [newItem, setNewItem] = useState({ sku: "", name: "", category: CATEGORIES[0], location: "", unit: "개", safety: "" });
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");

  const selected = items.find((i) => i.sku === sku);

  useEffect(() => {
    if (mode === "existing" && selected) setLocation(selected.location);
  }, [sku, mode]); // eslint-disable-line

  function submit() {
    setErr("");
    const q = Number(qty);
    if (!q || q <= 0) return setErr("수량은 1 이상의 숫자여야 합니다.");
    if (mode === "existing") {
      if (!selected) return setErr("품목을 선택해주세요.");
      onSubmit({ sku: selected.sku, name: selected.name, category: selected.category, location: location || selected.location, unit: selected.unit, qty: q, date, memo });
      setToast(`${selected.name} ${q}${selected.unit} 입고 처리되었습니다.`);
    } else {
      if (!newItem.sku || !newItem.name || !newItem.location) return setErr("SKU, 품목명, 로케이션을 모두 입력해주세요.");
      if (items.some((i) => i.sku === newItem.sku)) return setErr("이미 존재하는 SKU입니다.");
      onSubmit({ ...newItem, safety: Number(newItem.safety) || 10, qty: q, date, memo });
      setToast(`${newItem.name} 신규 등록 및 입고 처리되었습니다.`);
      setNewItem({ sku: "", name: "", category: CATEGORIES[0], location: "", unit: "개", safety: "" });
    }
    setQty("");
    setMemo("");
    setTimeout(() => setToast(""), 3500);
  }

  return (
    <div style={{ maxWidth: 560 }}>
      <PageHeader title="입고 등록" sub="기존 품목에 재고를 추가하거나 신규 품목을 등록합니다" />
      <ModeToggle mode={mode} setMode={setMode} labels={["existing", "new"]} display={["기존 품목", "신규 품목"]} accent={T.teal} />

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", gap: 14, marginTop: 14 }}>
        {mode === "existing" ? (
          <Field label="품목 선택">
            <select style={inputStyle} value={sku} onChange={(e) => setSku(e.target.value)}>
              {items.map((i) => (
                <option key={i.id} value={i.sku}>
                  {i.sku} · {i.name} (현재 {i.qty}{i.unit})
                </option>
              ))}
            </select>
          </Field>
        ) : (
          <>
            <div style={{ display: "flex", gap: 12 }}>
              <Field label="SKU">
                <input style={inputStyle} value={newItem.sku} onChange={(e) => setNewItem({ ...newItem, sku: e.target.value })} placeholder="예: ELEC-1003" />
              </Field>
              <Field label="카테고리">
                <select style={inputStyle} value={newItem.category} onChange={(e) => setNewItem({ ...newItem, category: e.target.value })}>
                  {CATEGORIES.map((c) => (
                    <option key={c}>{c}</option>
                  ))}
                </select>
              </Field>
            </div>
            <Field label="품목명">
              <input style={inputStyle} value={newItem.name} onChange={(e) => setNewItem({ ...newItem, name: e.target.value })} placeholder="품목명을 입력하세요" />
            </Field>
            <div style={{ display: "flex", gap: 12 }}>
              <Field label="단위">
                <input style={inputStyle} value={newItem.unit} onChange={(e) => setNewItem({ ...newItem, unit: e.target.value })} placeholder="개 / 박스 / 세트" />
              </Field>
              <Field label="안전재고">
                <input style={inputStyle} type="number" value={newItem.safety} onChange={(e) => setNewItem({ ...newItem, safety: e.target.value })} placeholder="10" />
              </Field>
            </div>
            <Field label="로케이션">
              <input style={inputStyle} value={newItem.location} onChange={(e) => setNewItem({ ...newItem, location: e.target.value })} placeholder="예: A-01-03" />
            </Field>
          </>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="입고 수량">
            <input style={inputStyle} type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="0" />
          </Field>
          <Field label="입고일">
            <input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
        </div>
        {mode === "existing" && (
          <Field label="로케이션 (변경 시에만 수정)">
            <input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} />
          </Field>
        )}
        <Field label="메모 (선택)">
          <input style={inputStyle} value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 정기 발주 입고" />
        </Field>

        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{err}</div>}

        <button
          onClick={submit}
          className="primary-btn"
          style={{ background: T.steel, color: "#fff", border: "none", borderRadius: 6, padding: "11px 16px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <ArrowDownToLine size={15} /> 입고 처리
        </button>
        {toast && <Toast text={toast} color={T.teal} />}
      </div>
    </div>
  );
}

/* ---------- outbound ---------- */
function Outbound({ items, onSubmit }) {
  const [sku, setSku] = useState(items[0]?.sku || "");
  const [qty, setQty] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayStr());
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");
  const selected = items.find((i) => i.sku === sku);

  function submit() {
    setErr("");
    const q = Number(qty);
    if (!selected) return setErr("품목을 선택해주세요.");
    if (!q || q <= 0) return setErr("수량은 1 이상의 숫자여야 합니다.");
    if (q > selected.qty) return setErr(`현재 재고(${selected.qty}${selected.unit})보다 많은 수량은 출고할 수 없습니다.`);
    onSubmit({ sku: selected.sku, name: selected.name, location: selected.location, qty: q, date, memo });
    setToast(`${selected.name} ${q}${selected.unit} 출고 처리되었습니다.`);
    setQty("");
    setMemo("");
    setTimeout(() => setToast(""), 3500);
  }

  return (
    <div style={{ maxWidth: 560 }}>
      <PageHeader title="출고 등록" sub="현재 재고에서 수량을 차감하고 이력을 기록합니다" />
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="품목 선택">
          <select style={inputStyle} value={sku} onChange={(e) => setSku(e.target.value)}>
            {items.map((i) => (
              <option key={i.id} value={i.sku}>
                {i.sku} · {i.name} (현재 {i.qty}{i.unit})
              </option>
            ))}
          </select>
        </Field>

        {selected && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: T.bg, borderRadius: 6, padding: "10px 14px" }}>
            <LocationTag loc={selected.location} />
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 700 }}>
              현재 재고 {selected.qty.toLocaleString()} {selected.unit}
            </span>
          </div>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="출고 수량">
            <input style={inputStyle} type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="0" />
          </Field>
          <Field label="출고일">
            <input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
        </div>
        <Field label="메모 (선택)">
          <input style={inputStyle} value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 온라인몰 주문 출고" />
        </Field>

        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{err}</div>}

        <button
          onClick={submit}
          className="primary-btn"
          style={{ background: T.steel, color: "#fff", border: "none", borderRadius: 6, padding: "11px 16px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <ArrowUpFromLine size={15} /> 출고 처리
        </button>
        {toast && <Toast text={toast} color={T.clay} />}
      </div>
    </div>
  );
}

function Toast({ text, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#F4FBF8", border: `1px solid ${color}33`, color: T.tealDeep, borderRadius: 6, padding: "9px 12px", fontSize: 13, fontWeight: 600 }}>
      <Check size={15} /> {text}
    </div>
  );
}

function ModeToggle({ mode, setMode, labels, display, accent }) {
  return (
    <div style={{ display: "inline-flex", background: "#EAE7DC", borderRadius: 7, padding: 3, gap: 2 }}>
      {labels.map((l, idx) => (
        <button
          key={l}
          onClick={() => setMode(l)}
          style={{
            border: "none",
            borderRadius: 5,
            padding: "7px 16px",
            fontSize: 13,
            fontWeight: 600,
            cursor: "pointer",
            fontFamily: "inherit",
            background: mode === l ? T.surface : "transparent",
            color: mode === l ? T.ink : T.inkSoft,
            boxShadow: mode === l ? "0 1px 2px rgba(0,0,0,0.08)" : "none",
          }}
        >
          {display[idx]}
        </button>
      ))}
    </div>
  );
}

/* ---------- history ---------- */
function HistoryView({ tx }) {
  const [type, setType] = useState("전체");
  const [q, setQ] = useState("");

  const filtered = tx.filter((t) => {
    const matchType = type === "전체" || t.type === type;
    const matchQ = !q || t.name.includes(q) || t.sku.toLowerCase().includes(q.toLowerCase());
    return matchType && matchQ;
  });

  return (
    <div>
      <PageHeader title="입출고 이력" sub={`총 ${tx.length}건 중 ${filtered.length}건 표시`} />
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 260px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
          <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="품목명, SKU 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select style={{ ...inputStyle, width: 130 }} value={type} onChange={(e) => setType(e.target.value)}>
          <option>전체</option>
          <option value="IN">입고</option>
          <option value="OUT">출고</option>
        </select>
      </div>

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>구분</th>
              <th>SKU</th>
              <th>품목명</th>
              <th>수량</th>
              <th>로케이션</th>
              <th>일자</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr>
                <td colSpan={7}>
                  <EmptyRow text="이력이 없습니다." />
                </td>
              </tr>
            ) : (
              filtered.map((t) => (
                <tr key={t.id} className="rowhover">
                  <td>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <TxBadge type={t.type} />
                      <span style={{ fontSize: 12.5, fontWeight: 700, color: t.type === "IN" ? T.tealDeep : T.clayDeep }}>{t.type === "IN" ? "입고" : "출고"}</span>
                    </div>
                  </td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{t.sku}</td>
                  <td style={{ fontWeight: 600 }}>{t.name}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>
                    {t.type === "IN" ? "+" : "−"}{t.qty}
                  </td>
                  <td>
                    <LocationTag loc={t.location} />
                  </td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5 }}>{fmtDate(t.date)}</td>
                  <td style={{ color: T.inkSoft }}>{t.memo || "-"}</td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<WMSApp />);

</script>
</body>
</html>

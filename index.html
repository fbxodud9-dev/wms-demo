function supplierPriority(supplier) {
  const s = String(supplier || "");
  const idx = SUPPLIER_ORDER_LIST.findIndex((name) => s.includes(name));
  return idx === -1 ? SUPPLIER_ORDER_LIST.length : idx;
}

// 원본 발주파일의 공급사명은 "(주)영진베이커리(12.5%)" / "(주)영진베이커리(PB, 11.3%)" 처럼
// 같은 회사라도 괄호(원료비율·구분 등)가 달라서 서로 다른 문자열로 들어옴.
// 필터 목록에서는 이런 변형을 하나로 묶기 위해 대표 이름(그룹핑 키)을 뽑아낸다.
function supplierGroupKey(supplier) {
  const s = String(supplier || "").trim();
  if (!s) return "미지정";
  const idx = SUPPLIER_ORDER_LIST.findIndex((name) => s.includes(name));
  if (idx !== -1) return SUPPLIER_ORDER_LIST[idx]; // 고정 순서표에 있는 이름이면 그걸 대표명으로
  // 순서표에 없는 공급사는 괄호(비율·구분 표기)와 법인격 접두어를 떼어 대표명 추정
  const cleaned = s
    .replace(/\([^)]*\)/g, "")
    .replace(/^(주식회사|농업회사법인\s*주식회사|농업회사법인)\s*/, "")
    .trim();
  return cleaned || s;
}

// 상품명 끝의 "1편"/"2편" 또는 숫자만으로 편을 판별. 숫자가 아예 없으면 기본 1편.
function detectPart(name) {
  const m = String(name || "").match(/(\d)\s*편?\s*$/);
  if (m) return m[1] === "2" ? 2 : 1;
  return 1;
}

function stockStatus(item) {
  if (item.qty <= 0) return { label: "재고없음", color: T.danger, bg: "#FBEAEA" };
  if (item.qty < item.safety) return { label: "부족", color: T.danger, bg: "#FBEAEA" };
  if (item.qty < item.safety * 1.3) return { label: "주의", color: T.amberDeep, bg: "#FCF1DD" };
  return { label: "정상", color: T.tealDeep, bg: "#E7F4EF" };
}

function boxBreakdown(qty, packQty) {
  const pq = Number(packQty) || 0;
  if (!pq || pq <= 0) return `${qty}개`;
  const box = Math.floor(qty / pq);
  const rem = qty % pq;
  if (box > 0 && rem > 0) return `${box}박스 ${rem}개`;
  if (box > 0) return `${box}박스`;
  return `${qty}개`;
}

// 백엔드 서버 주소가 바뀌면 이 값만 수정하면 됩니다.
const API_BASE_URL = "https://wms-backend-rk07.onrender.com";

async function apiFetch(path, token, options = {}) {
  let res;
  try {
    res = await fetch(API_BASE_URL + path, {
      method: options.method || "GET",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
  } catch (networkErr) {
    throw new Error("서버에 연결할 수 없습니다. 인터넷 연결이나 백엔드 상태를 확인해주세요.");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `요청이 실패했습니다 (${res.status})`);
  return data;
}

          </div>
        </div>
        <Field label="아이디">
          <input style={inputStyle} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="staff1" autoFocus />
        </Field>

        </Field>

function WMSApp() {
  const [authToken, setAuthToken] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);

  const [tab, setTabState] = useState(() => {
    try {
      const h = window.location.hash.replace("#", "");
      return h || "dashboard";
    } catch (e) {
      return "dashboard";
    }
  });
  const setTab = useCallback((next) => {
    setTabState(next);
    try {
      window.location.hash = next;
    } catch (e) {}
  }, []);
  const [items, setItems] = useState([]);
  const [tx, setTx] = useState([]);
  const [orders, setOrders] = useState([]);
  const [pickingDocs, setPickingDocs] = useState([]);
  const [replenishedSkus, setReplenishedSkus] = useState({});

  const [stores, setStores] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [courses, setCourses] = useState([]);
  const [cells, setCells] = useState([]);

  const [ready, setReady] = useState(false);
  const [apiErr, setApiErr] = useState("");

  // 로그인 정보 복원 (토큰은 로컬에 저장하지만, 실제 데이터는 전부 서버에서 가져옵니다)
  useEffect(() => {
    try {
      const raw = localStorage.getItem("wms-auth");
      if (raw) {
        const parsed = JSON.parse(raw);
        setAuthToken(parsed.token);
        setAuthUser(parsed.user);
      }
    } catch (e) {}
    setAuthReady(true);
  }, []);

  // 아직 서버로 옮기지 않은 로컬 전용 기준정보(매장/차량/코스/셀, 보충 체크상태)
  useEffect(() => {
    try {
      const raw = localStorage.getItem("wms-local-masters");
      if (raw) {
        const parsed = JSON.parse(raw);
        setStores(parsed.stores || seedStores());
        setVehicles(parsed.vehicles || seedVehicles());
        setCourses(parsed.courses || seedCourses());
        setCells(parsed.cells || seedCells());
        setReplenishedSkus(parsed.replenishedSkus || {});
      } else {
        setStores(seedStores());
        setVehicles(seedVehicles());
        setCourses(seedCourses());
        setCells(seedCells());
      }
    } catch (e) {
      setStores(seedStores());
      setVehicles(seedVehicles());
      setCourses(seedCourses());
      setCells(seedCells());
    }
  }, []);
  useEffect(() => {
    try {
      localStorage.setItem("wms-local-masters", JSON.stringify({ stores, vehicles, courses, cells, replenishedSkus }));
    } catch (e) {}
  }, [stores, vehicles, courses, cells, replenishedSkus]);

  const loadCoreData = useCallback(async () => {
    if (!authToken) return;
    try {
      setApiErr("");
      const [itemsRes, ordersRes, txRes, docsRes] = await Promise.all([
        apiFetch("/items", authToken),
        apiFetch("/orders", authToken),
        apiFetch("/transactions?limit=300", authToken),
        apiFetch("/orders/picking-docs", authToken),
      ]);
      setItems(itemsRes.items.map(mapItemFromApi));
      setOrders(ordersRes.orders.map(mapOrderFromApi));
      setTx(txRes.transactions.map(mapTxFromApi));
      setPickingDocs(docsRes.docs.map(mapDocFromApi));
    } catch (e) {
      setApiErr(e.message);
      if (String(e.message).includes("토큰")) doLogout();
    } finally {
      setReady(true);
    }
  }, [authToken]);

  useEffect(() => {
    if (authToken) loadCoreData();
  }, [authToken]); // eslint-disable-line

  function doLogin(token, user) {
    setAuthToken(token);
    setAuthUser(user);
    try {
      localStorage.setItem("wms-auth", JSON.stringify({ token, user }));
    } catch (e) {}
  }
  function doLogout() {
    setAuthToken(null);
    setAuthUser(null);
    setItems([]);
    setTx([]);
    setOrders([]);
    setPickingDocs([]);
    setReady(false);
    try {
      localStorage.removeItem("wms-auth");
    } catch (e) {}
  }

  const itemsView = useMemo(() => items.map((i) => ({ ...i, replenished: !!replenishedSkus[i.sku] })), [items, replenishedSkus]);

  const lowStock = useMemo(() => items.filter((i) => i.qty < i.safety), [items]);
  const totalQty = useMemo(() => items.reduce((a, b) => a + b.qty, 0), [items]);
  const todayTx = useMemo(() => tx.filter((t) => t.date === todayStr()), [tx]);
  const newOrderCount = useMemo(() => orders.filter((o) => o.status === "NEW").length, [orders]);
  const allocatedCount = useMemo(() => orders.filter((o) => o.status === "ALLOCATED").length, [orders]);
  const readyToShipCount = useMemo(() => orders.filter((o) => o.status === "PICK_CONFIRMED").length, [orders]);

  const applyInbound = useCallback(
    async (payload) => {
      try {
        const exists = items.find((i) => i.sku === payload.sku);
        if (!exists) {
          await apiFetch("/items", authToken, {
            method: "POST",
            body: {
              sku: payload.sku,
              name: payload.name,
              category: payload.category,
              location: payload.location,
              unit: payload.unit,
              qty: 0,
              safety: payload.safety || 10,
              temp_zone: payload.tempZone || "상온",
              work_type: payload.workType || "피킹",
              unit_qty: 1,
              box_qty: 1,
              cbm: 0.01,
            },
          });
        }
        await apiFetch(`/items/${encodeURIComponent(payload.sku)}/inbound`, authToken, {
          method: "POST",
          body: { qty: payload.qty, memo: payload.memo, date: payload.date, location: payload.location },
        });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [items, authToken, loadCoreData]
  );

  const applyOutbound = useCallback(
    async (payload) => {
      try {
        await apiFetch(`/items/${encodeURIComponent(payload.sku)}/outbound`, authToken, {
          method: "POST",
          body: { qty: payload.qty, memo: payload.memo, date: payload.date },
        });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const addOrder = useCallback(
    async (order) => {
      try {
        await apiFetch("/orders", authToken, {
          method: "POST",
          body: {
            orderNo: order.orderNo,
            orderDate: order.createdAt,
            customer: order.customer,
            storeCode: order.storeCode,
            supplier: order.supplier,
            supplierCode: order.supplierCode,
            channel: order.channel,
            lines: order.lines.map((l) => ({ sku: l.sku, name: l.name, qty: l.qty, packQty: l.packQty, location: l.location, unit: l.unit })),
          },
        });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // 발주파일 업로드처럼 여러 건을 한 번에 등록할 때 사용 (건마다 새로고침하지 않아 훨씬 빠름)
  const addOrdersBulk = useCallback(
    async (orderList) => {
      try {
        const body = {
          orders: orderList.map((order) => ({
            orderNo: order.orderNo,
            orderDate: order.createdAt,
            customer: order.customer,
            storeCode: order.storeCode,
            supplier: order.supplier,
            supplierCode: order.supplierCode,
            channel: order.channel,
            lines: order.lines.map((l) => ({ sku: l.sku, name: l.name, qty: l.qty, packQty: l.packQty, location: l.location, unit: l.unit })),
          })),
        };
        const res = await apiFetch("/orders/bulk", authToken, { method: "POST", body });
        await loadCoreData();
        return res;
      } catch (e) {
        setApiErr(e.message);
        return { createdCount: 0, skippedCount: orderList.length, skippedOrderNos: [] };
      }
    },
    [authToken, loadCoreData]
  );

  // 발주파일 업로드 시 미등록 품목을 한 번에 등록 (품목 개수만큼 반복 호출하지 않음)
  const registerItemsBulk = useCallback(
    async (skuNamePairs) => {
      if (skuNamePairs.length === 0) return;
      try {
        await apiFetch("/orders/bulk-register-items", authToken, {
          method: "POST",
          body: { items: skuNamePairs.map(([sku, name]) => ({ sku, name })) },
        });
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken]
  );

  const updateChangedQty = useCallback(
    async (orderId, sku, value) => {
      try {
        await apiFetch(`/orders/${orderId}/lines/${encodeURIComponent(sku)}`, authToken, { method: "PATCH", body: { changedQty: value } });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // II. 상품할당
  const allocateOrder = useCallback(
    async (orderId) => {
      try {
        await apiFetch(`/orders/${orderId}/allocate`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // I. 주문정보 - 공급사별 "피킹지시서 변환하기"
  const convertSupplierToPicking = useCallback(
    async (supplierKey) => {
      try {
        await apiFetch("/orders/convert-to-picking", authToken, { method: "POST", body: { supplierKey } });
        await loadCoreData();
        setTab("pickingconfirm");
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // III. 할당리스트 - 할당취소
  const cancelAllocationLine = useCallback(
    async (orderId, sku) => {
      try {
        await apiFetch(`/orders/${orderId}/lines/${encodeURIComponent(sku)}/cancel-allocation`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // IV. 보충지시 (아직 서버로 옮기지 않은 로컬 전용 기능)
  const toggleReplenish = useCallback((sku) => {
    setReplenishedSkus((prev) => ({ ...prev, [sku]: !prev[sku] }));
  }, []);

  // V. 피킹리스트
  const togglePicked = useCallback(
    async (orderId, sku) => {
      try {
        const order = orders.find((o) => o.id === orderId);
        const line = order && order.lines.find((l) => l.sku === sku);
        const nextPicked = !(line && line.picked);
        await apiFetch(`/orders/${orderId}/lines/${encodeURIComponent(sku)}/pick`, authToken, { method: "PATCH", body: { picked: nextPicked } });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [orders, authToken, loadCoreData]
  );

  const confirmPicking = useCallback(
    async (orderId) => {
      try {
        await apiFetch(`/orders/${orderId}/confirm-pick`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const cancelPickingConfirm = useCallback(
    async (orderId) => {
      try {
        await apiFetch(`/orders/${orderId}/cancel-pick`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // VI. 피킹재발행
  const reissueDoc = useCallback(
    async (docNo) => {
      try {
        await apiFetch(`/orders/picking-docs/${encodeURIComponent(docNo)}/reissue`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // VII. 출고처리
  const shipOrder = useCallback(
    async (orderId) => {
      try {
        await apiFetch(`/orders/${orderId}/ship`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const cancelShip = useCallback(
    async (orderId) => {
      try {
        await apiFetch(`/orders/${orderId}/cancel-ship`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const confirmPms = useCallback(
    async (orderId) => {
      try {
        await apiFetch(`/orders/${orderId}/confirm-pms`, authToken, { method: "POST" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // IX. 차량/매장 매핑 (로컬 전용)
  const addVehicle = useCallback((name) => {
    setVehicles((prev) => [...prev, { id: uid(), name }]);
  }, []);
  const mapStoreVehicle = useCallback((storeId, vehicleId) => {
    setStores((prev) => prev.map((s) => (s.id === storeId ? { ...s, vehicleId: vehicleId || null } : s)));
  }, []);

  // X. 상품마스터
  const updateItemMaster = useCallback(
    async (sku, fields) => {
      try {
        const body = {};
        if (fields.tempZone !== undefined) body.temp_zone = fields.tempZone;
        if (fields.workType !== undefined) body.work_type = fields.workType;
        if (fields.location !== undefined) body.location = fields.location;
        if (fields.unitQty !== undefined) body.unit_qty = fields.unitQty;
        if (fields.boxQty !== undefined) body.box_qty = fields.boxQty;
        if (fields.cbm !== undefined) body.cbm = fields.cbm;
        if (fields.qty !== undefined) body.qty = fields.qty;
        await apiFetch(`/items/${encodeURIComponent(sku)}`, authToken, { method: "PATCH", body });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // 발주파일에 있지만 상품마스터에 없는 바코드를 "미배정" 상태로 자동 등록
  // 테스트 데이터 초기화 (모든 발주 삭제, 재고/상품마스터는 유지)
  const resetAllOrders = useCallback(async () => {
    try {
      await apiFetch("/orders/reset-all", authToken, { method: "DELETE" });
      await loadCoreData();
    } catch (e) {
      setApiErr(e.message);
    }
  }, [authToken, loadCoreData]);

  // 특정 날짜의 발주만 삭제 (다른 날짜는 그대로 유지, 테스트 데이터 정리용)
  const deleteOrdersByDate = useCallback(
    async (date) => {
      try {
        await apiFetch(`/orders/by-date/${date}`, authToken, { method: "DELETE" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const registerPlaceholderItem = useCallback(
    async (sku, name) => {
      try {
        await apiFetch("/items", authToken, {
          method: "POST",
          body: { sku, name, category: null, location: "미배정", unit: "EA", qty: 0, safety: 0, temp_zone: "상온", work_type: "피킹", unit_qty: 1, box_qty: 1, cbm: 0 },
        });
      } catch (e) {
        // 이미 있으면 이름만 갱신되고 넘어감
      }
    },
    [authToken]
  );

  // X. 상품마스터 - 신규 품목 직접 등록
  const createItem = useCallback(
    async (fields) => {
      try {
        await apiFetch("/items", authToken, {
          method: "POST",
          body: {
            sku: fields.sku,
            name: fields.name,
            category: fields.category || null,
            location: fields.location || "미배정",
            unit: fields.unit || "EA",
            qty: fields.qty || 0,
            safety: fields.safety || 0,
            temp_zone: fields.tempZone || "상온",
            work_type: fields.workType || "피킹",
            unit_qty: fields.unitQty || 1,
            box_qty: fields.boxQty || 1,
            cbm: fields.cbm || 0,
          },
        });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const deleteItem = useCallback(
    async (sku) => {
      try {
        await apiFetch(`/items/${encodeURIComponent(sku)}`, authToken, { method: "DELETE" });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  // XI. 창고CELL (로컬 전용)
  const addCell = useCallback((cell) => {
    setCells((prev) => [...prev, { id: uid(), ...cell }]);
  }, []);
  const deleteCell = useCallback((id) => {
    setCells((prev) => prev.filter((c) => c.id !== id));
  }, []);

  // XII. 배송코스차수 (로컬 전용)
  const addCourse = useCallback((course) => {
    setCourses((prev) => [...prev, { id: uid(), ...course }]);
  }, []);
  const deleteCourse = useCallback((id) => {
    setCourses((prev) => prev.filter((c) => c.id !== id));
  }, []);

  const navGroups = [
    { label: "개요", items: [{ key: "dashboard", label: "대시보드", icon: LayoutDashboard }] },
    {
      label: "재고",
      items: [
        { key: "inventory", label: "재고현황", icon: Boxes },
        { key: "3d", label: "3D 로케이션", icon: Box3dIcon },
        { key: "inbound", label: "입고등록", icon: ArrowDownToLine },
        { key: "outbound", label: "출고등록", icon: ArrowUpFromLine },
        { key: "history", label: "입출고이력", icon: History },
      ],
    },
    {
      label: "주문정보",
      items: [
        { key: "orderinfo", label: "I. 주문정보 (GS)", icon: ClipboardList },
        { key: "orderinfo-bgf", label: "주문정보 (BGF)", icon: ClipboardList },
        { key: "orderinfo-emart", label: "주문정보 (E.MART)", icon: ClipboardList },
      ],
    },
    {
      label: "보충 · 피킹",
      items: [
        { key: "replenish", label: "IV. 보충지시", icon: Thermometer },
        { key: "pickingconfirm", label: "V. 피킹 확정", icon: ListOrdered, badgeKey: "alloc" },
        { key: "pickinginspection", label: "피킹지시서 출력", icon: Grid3x3 },
      ],
    },
    {
      label: "출고",
      items: [
        { key: "shipping", label: "VII. 출고처리", icon: Truck, badgeKey: "ship" },
        { key: "invoice", label: "거래명세서", icon: FileText },
      ],
    },
    {
      label: "VIII~XII  기준정보",
      items: [
        { key: "masdatacheck", label: "VIII. 기준정보체크", icon: ShieldCheck },
        { key: "vehiclemap", label: "IX. 차량/매장 매핑", icon: MapPinned },
        { key: "productmaster", label: "X. 상품마스터", icon: Tag },
        { key: "cell", label: "XI. 창고CELL", icon: Grid3x3 },
        { key: "course", label: "XII. 배송코스차수", icon: Route },
      ],
    },
  ];
  const badgeCount = { new: newOrderCount, alloc: allocatedCount, ship: readyToShipCount };

  if (!authReady) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: T.inkSoft, gap: 8, fontFamily: "'IBM Plex Sans KR', sans-serif" }}>
        <Loader2 size={18} className="spin" />
        불러오는 중...
      </div>
    );
  }

  if (!authToken) {
    return <LoginScreen onLogin={doLogin} />;
  }

  if (!ready) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: T.inkSoft, gap: 8, fontFamily: "'IBM Plex Sans KR', sans-serif" }}>
        <Loader2 size={18} className="spin" />
        서버에서 데이터를 불러오는 중...
      </div>
    );
  }

  return (
    <div
      className="wms-shell"
      style={{
        fontFamily: "'IBM Plex Sans KR', sans-serif",
        background: T.bg,
        color: T.ink,
        display: "flex",
        width: "100%",
        minHeight: "100vh",
      }}
    >
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        .navbtn:hover { background: #3A424B !important; }
        .rowhover:hover { background: #FAF9F5; }
        .primary-btn:hover { background: #232830 !important; }
        .ghost-btn:hover { background: #EFEDE4 !important; }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input:focus, select:focus, textarea:focus { border-color: ${T.steel} !important; box-shadow: 0 0 0 2px rgba(43,50,57,0.12); }
        table { border-collapse: collapse; width: 100%; min-width: 620px; }
        th { text-align: left; font-size: 12px; color: ${T.inkSoft}; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid ${T.border}; white-space: nowrap; }
        td { padding: 12px; font-size: 13.5px; border-bottom: 1px solid #EEECE3; vertical-align: middle; }
        .table-wrap { overflow-x: auto !important; overflow-y: hidden; -webkit-overflow-scrolling: touch; max-width: 100%; }
        input, select, textarea { max-width: 100%; }
        .navgroup-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #7C838B; padding: 14px 12px 6px; }
        .print-only { display: none; }
        .print-portal { display: none; }
        @media print {
          @page { size: landscape; margin: 5mm; }
          body * { visibility: hidden; }
          .print-area, .print-area * { visibility: visible; }
          .print-area { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; }
          .print-only { display: block !important; }
          .no-print { display: none !important; }
          body.portal-printing #root { display: none !important; }
          body.portal-printing .print-portal,
          body.portal-printing .print-portal * { visibility: visible !important; }
          body.portal-printing .print-portal { display: block !important; position: static !important; }
        }
        @media (max-width: 720px) {
          .wms-shell { flex-direction: column !important; }
          .wms-sidebar { width: 100% !important; flex-direction: row !important; align-items: center !important; gap: 4px !important; padding: 8px !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; }
          .wms-brand { display: none !important; }
          .wms-footer { display: none !important; }
          .navgroup { display: flex !important; flex-direction: row !important; }
          .navgroup-label { display: none !important; }
          .navbtn { flex: 0 0 auto !important; white-space: nowrap !important; padding: 8px 12px !important; font-size: 12.5px !important; }
          .wms-main { padding: 14px !important; }
          .field-row { flex-direction: column !important; gap: 12px !important; }
          .wms-3d-mount { height: 300px !important; }
          h1 { font-size: 18px !important; }
        }
        @media (max-width: 420px) {
          .navbtn span.navlabel { display: none; }
        }
      `}</style>

      {/* sidebar */}
      <div className="wms-sidebar" style={{ width: 236, background: T.steel, color: "#fff", padding: "20px 10px", display: "flex", flexDirection: "column", gap: 2, flexShrink: 0, overflowY: "auto" }}>
        <div className="wms-brand" style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 10px 16px" }}>
          <div style={{ width: 30, height: 30, borderRadius: 6, background: T.amber, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Package size={17} color={T.steel} strokeWidth={2.5} />
          </div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.2 }}>창고관리시스템</div>
            <div style={{ fontSize: 10.5, color: "#A9AFB6" }}>WMS · HUB CENTER</div>
          </div>
        </div>

        {navGroups.map((g) => (
          <div className="navgroup" key={g.label}>
            <div className="navgroup-label">{g.label}</div>
            {g.items.map((n) => {
              const Icon = n.icon;
              const active = tab === n.key;
              const count = n.badgeKey ? badgeCount[n.badgeKey] : n.key === "dashboard" ? lowStock.length : 0;
              return (
                <button
                  key={n.key}
                  className="navbtn"
                  onClick={() => setTab(n.key)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 9,
                    padding: "9px 12px",
                    borderRadius: 6,
                    border: "none",
                    cursor: "pointer",
                    background: active ? T.amber : "transparent",
                    color: active ? T.steel : "#D7DBDE",
                    fontWeight: active ? 700 : 500,
                    fontSize: 12.8,
                    textAlign: "left",
                    fontFamily: "inherit",
                    width: "100%",
                  }}
                >
                  <Icon size={15} strokeWidth={2.2} />
                  <span className="navlabel">{n.label}</span>
                  {count > 0 && (
                    <span
                      style={{
                        marginLeft: "auto",
                        fontSize: 10.5,
                        background: active ? T.steel : n.key === "dashboard" ? T.danger : T.amber,
                        color: active ? "#fff" : n.key === "dashboard" ? "#fff" : T.steel,
                        borderRadius: 999,
                        padding: "1px 6px",
                        fontFamily: "'JetBrains Mono', monospace",
                      }}
                    >
                      {count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        ))}

        <div className="wms-footer" style={{ marginTop: "auto", padding: "10px", borderTop: "1px solid #3E4750", display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ fontSize: 11.5, color: "#C7CCD1" }}>{authUser?.name || authUser?.username} 님</div>
          <button
            onClick={doLogout}
            style={{ background: "transparent", border: "1px solid #3E4750", color: "#D7DBDE", borderRadius: 5, padding: "5px 8px", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}
          >
            로그아웃
          </button>
        </div>
      </div>

      {/* content */}
      <div className="wms-main" style={{ flex: 1, padding: "24px 28px", overflow: "auto", minWidth: 0 }}>
        {apiErr && (
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8, background: "#FBEAEA", border: `1px solid ${T.danger}55`, borderRadius: 6, padding: "10px 12px", marginBottom: 16, fontSize: 12.5, color: T.danger, fontWeight: 600 }}>
            <AlertTriangle size={14} style={{ marginTop: 1, flexShrink: 0 }} />
            {apiErr}
            <button onClick={() => setApiErr("")} style={{ marginLeft: "auto", border: "none", background: "transparent", cursor: "pointer", color: T.danger }}>
              <X size={14} />
            </button>
          </div>
        )}
        {tab === "dashboard" && <Dashboard items={itemsView} tx={tx} lowStock={lowStock} totalQty={totalQty} todayTx={todayTx} goTo={setTab} />}
        {tab === "inventory" && <Inventory items={itemsView} />}
        {tab === "3d" && <ThreeDView items={itemsView} />}
        {tab === "inbound" && <Inbound items={itemsView} onSubmit={applyInbound} />}
        {tab === "outbound" && <Outbound items={itemsView} onSubmit={applyOutbound} />}
        {tab === "history" && <HistoryView tx={tx} />}

        {tab === "orderinfo" && (
          <OrderInfo
            items={itemsView}
            orders={orders}
            onAdd={addOrder}
            onAddBulk={addOrdersBulk}
            onRegisterItemsBulk={registerItemsBulk}
            onUpdateChangedQty={updateChangedQty}
            onConvert={convertSupplierToPicking}
            onRegisterItem={registerPlaceholderItem}
            onReset={resetAllOrders}
            onDeleteDate={deleteOrdersByDate}
          />
        )}
        {tab === "orderinfo-bgf" && <ComingSoon title="주문정보 (BGF)" />}
        {tab === "orderinfo-emart" && <ComingSoon title="주문정보 (E.MART)" />}

        {tab === "replenish" && <Replenishment items={itemsView} onToggle={toggleReplenish} />}
        {tab === "pickingconfirm" && (
          <PickingList orders={orders} items={itemsView} onToggle={togglePicked} onConfirm={confirmPicking} onCancelConfirm={cancelPickingConfirm} onReallocate={allocateOrder} />
        )}
        {tab === "pickinginspection" && <PickingInspection orders={orders} />}

        {tab === "shipping" && (
          <Shipping orders={orders} stores={stores} onShip={shipOrder} onCancelShip={cancelShip} onConfirmPms={confirmPms} />
        )}
        {tab === "invoice" && <InvoiceView orders={orders} />}

        {tab === "masdatacheck" && <MasterDataCheck items={itemsView} stores={stores} vehicles={vehicles} courses={courses} cells={cells} />}
        {tab === "vehiclemap" && <VehicleStoreMap stores={stores} vehicles={vehicles} onAddVehicle={addVehicle} onMap={mapStoreVehicle} />}
        {tab === "productmaster" && <ProductMaster items={itemsView} onSave={updateItemMaster} onCreate={createItem} onDelete={deleteItem} />}
        {tab === "cell" && <WarehouseCell cells={cells} onAdd={addCell} onDelete={deleteCell} />}
        {tab === "course" && (
          <DeliveryCourse courses={courses} vehicles={vehicles} onAdd={addCourse} onDelete={deleteCourse} />
        )}
      </div>
    </div>
  );
}

/* ---------- dashboard ---------- */
function Dashboard({ items, tx, lowStock, totalQty, todayTx, goTo }) {
  const inCount = todayTx.filter((t) => t.type === "IN").length;
  const outCount = todayTx.filter((t) => t.type === "OUT").length;
  return (
    <div>
      <PageHeader title="대시보드" sub={`오늘, ${fmtDate(todayStr())}`} />
      <div style={{ display: "flex", gap: 14, marginBottom: 22, flexWrap: "wrap" }}>
        <Metric label="총 품목 수" value={items.length} sub="등록된 SKU" />
        <Metric label="총 재고 수량" value={totalQty.toLocaleString()} sub="전체 로케이션 합산" />
        <Metric label="재고 부족 품목" value={lowStock.length} sub="안전재고 미달" accent={lowStock.length ? T.danger : T.ink} />
        <Metric label="오늘 입출고" value={`${inCount + outCount}건`} sub={`입고 ${inCount} · 출고 ${outCount}`} />
      </div>

      <div style={{ display: "flex", gap: 18, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 340px", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
          <SectionHead icon={AlertTriangle} title="재고 부족 알림" color={T.danger} onMore={() => goTo("inventory")} />
          {lowStock.length === 0 ? (
            <EmptyRow text="안전재고 미달 품목이 없습니다." />
          ) : (
            <div>
              {lowStock.slice(0, 6).map((i) => (
                <div key={i.id} className="rowhover" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 16px", borderBottom: `1px solid #EEECE3` }}>
                  <div>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{i.name}</div>
                    <div style={{ fontSize: 11.5, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{i.sku}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 13, fontFamily: "'JetBrains Mono', monospace", color: T.danger, fontWeight: 700 }}>
                      {i.qty} / {i.safety} {i.unit}
                    </div>
                    <LocationTag loc={i.location} />
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{ flex: "1 1 340px", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
          <SectionHead icon={Clock} title="최근 입출고 내역" color={T.steel} onMore={() => goTo("history")} />
          {tx.length === 0 ? (
            <EmptyRow text="입출고 이력이 없습니다." />
          ) : (
            <div>
              {tx.slice(0, 6).map((t) => (
                <div key={t.id} className="rowhover" style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 16px", borderBottom: `1px solid #EEECE3` }}>
                  <TxBadge type={t.type} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{t.name}</div>
                    <div style={{ fontSize: 11.5, color: T.inkSoft }}>{fmtDate(t.date)} · {t.memo || "-"}</div>
                  </div>
                  <div style={{ fontSize: 13, fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: t.type === "IN" ? T.tealDeep : T.clayDeep }}>
                    {t.type === "IN" ? "+" : "−"}{t.qty}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TxBadge({ type }) {
  const isIn = type === "IN";
  return (
    <div
      style={{
        width: 26,
        height: 26,
        borderRadius: 6,
        background: isIn ? "#E7F4EF" : "#F7E9E2",
        color: isIn ? T.tealDeep : T.clayDeep,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        flexShrink: 0,
      }}
    >

/* ---------- 3D location view ---------- */
const CAT_COLOR = {
  가전: 0x3e6fa6,
  생활용품: 0x1e8a6e,
  문구용품: 0x8a5a0b,
  식품: 0xc1562f,
  포장자재: 0x6b6a63,
};
const FALLBACK_COLORS = [0x534ab7, 0x2b6cb0, 0x9c4221, 0x2f7a5c, 0x7a4a8a];

function parseLocation(loc) {
  const parts = (loc || "").split("-");
  return {
    zone: parts[0] || "X",
    aisle: parseInt(parts[1], 10) || 1,
    level: parseInt(parts[2], 10) || 1,
  };
}

function buildZoneLayout(items) {
  const map = {};
  items.forEach((it) => {
    const { zone, aisle, level } = parseLocation(it.location);
    if (!map[zone]) map[zone] = { key: zone, items: [], maxAisle: 1, maxLevel: 1, categories: {} };
    map[zone].items.push({ ...it, _aisle: aisle, _level: level });
    map[zone].maxAisle = Math.max(map[zone].maxAisle, aisle);
    map[zone].maxLevel = Math.max(map[zone].maxLevel, level);
    map[zone].categories[it.category] = (map[zone].categories[it.category] || 0) + 1;
  });
  return Object.values(map)
    .sort((a, b) => a.key.localeCompare(b.key))
    .map((z) => {
      const aisles = Math.max(z.maxAisle, 3);
      const levels = Math.max(z.maxLevel, 3);
      const topCategory = Object.entries(z.categories).sort((a, b) => b[1] - a[1])[0]?.[0] || "기타";
      const bins = [];
      for (let l = 1; l <= levels; l++) {
        for (let a = 1; a <= aisles; a++) {
          const found = z.items.find((it) => it._aisle === a && it._level === l);
          bins.push({
            aisle: a,
            level: l,
            item: found || null,
            code: `${z.key}-${String(a).padStart(2, "0")}-${String(l).padStart(2, "0")}`,
          });
        }
      }
      return { key: z.key, category: topCategory, aisles, levels, bins };
    });
}

function ThreeDView({ items }) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const [selectedCode, setSelectedCode] = useState(null);
  const [query, setQuery] = useState("");

  const zones = useMemo(() => buildZoneLayout(items), [items]);
  const allBins = useMemo(
    () => zones.flatMap((z) => z.bins.map((b) => ({ ...b, zoneKey: z.key, category: z.category }))),
    [zones]
  );
  const searchResults = query
    ? allBins.filter((b) => b.item && (b.item.name.includes(query) || b.item.sku.toLowerCase().includes(query.toLowerCase()))).slice(0, 6)
    : [];
  const selectedBin = allBins.find((b) => b.code === selectedCode) || null;

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    const width = mount.clientWidth || 400;
    const height = mount.clientHeight || 440;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(width, height);
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 0.6);
    dl.position.set(140, 240, 180);
    scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0xffffff, 0.25);
    dl2.position.set(-160, 120, -140);
    scene.add(dl2);

    const XSTEP = 42, YSTEP = 34, ZSTEP = 130, BIN = 30, BINH = 24;
    const maxAisles = Math.max(...zones.map((z) => z.aisles), 1);
    const maxLevels = Math.max(...zones.map((z) => z.levels), 1);
    const totalWidth = (maxAisles - 1) * XSTEP;
    const totalDepth = Math.max(zones.length - 1, 0) * ZSTEP;
    const totalHeight = (maxLevels - 1) * YSTEP;

    const floorGeo = new THREE.PlaneGeometry(totalWidth + 260, totalDepth + 260);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xedeae0, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(totalWidth / 2, -6, totalDepth / 2);
    scene.add(floor);

    const grid = new THREE.GridHelper(Math.max(totalWidth, totalDepth, 200) + 320, 24, 0xd3cfc2, 0xe4e1d6);
    grid.position.set(totalWidth / 2, -5.5, totalDepth / 2);
    scene.add(grid);

    function makeTextSprite(text, opts = {}) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 512;
      canvas.height = 128;
      ctx.font = `700 ${opts.fontSize || 40}px 'IBM Plex Sans KR', sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = opts.color || "#1B1D1A";
      ctx.fillText(text, 8, 64);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set((opts.scale && opts.scale[0]) || 100, (opts.scale && opts.scale[1]) || 25, 1);
      return sprite;
    }

    const binMeshes = new Map();

    zones.forEach((zone, zi) => {
      const zBase = zi * ZSTEP;
      const color = CAT_COLOR[zone.category] != null ? CAT_COLOR[zone.category] : FALLBACK_COLORS[zi % FALLBACK_COLORS.length];

      for (let l = 1; l <= zone.levels; l++) {
        const plankW = (zone.aisles - 1) * XSTEP + BIN + 20;
        const plankGeo = new THREE.BoxGeometry(plankW, 3, BIN + 26);
        const plankMat = new THREE.MeshLambertMaterial({ color: 0xd9d5c8 });
        const plank = new THREE.Mesh(plankGeo, plankMat);
        plank.position.set(((zone.aisles - 1) * XSTEP) / 2, (l - 1) * YSTEP - BINH / 2 - 4, zBase);
        scene.add(plank);
      }

      const label = makeTextSprite(`${zone.key}구역 · ${zone.category}`, { fontSize: 42, scale: [110, 27] });
      label.position.set(-78, (zone.levels - 1) * YSTEP + 34, zBase);
      scene.add(label);

      zone.bins.forEach((bin) => {
        const x = (bin.aisle - 1) * XSTEP;
        const y = (bin.level - 1) * YSTEP;
        const z = zBase;
        let mesh;
        if (bin.item) {
          const geo = new THREE.BoxGeometry(BIN, BINH, BIN);
          const mat = new THREE.MeshLambertMaterial({ color });
          mesh = new THREE.Mesh(geo, mat);
          mesh.userData.baseColor = color;
          mesh.userData.clickable = true;
        } else {
          const geo = new THREE.BoxGeometry(BIN * 0.86, BINH * 0.86, BIN * 0.86);
          const edges = new THREE.EdgesGeometry(geo);
          const mat = new THREE.LineBasicMaterial({ color: 0xc7c2b4, transparent: true, opacity: 0.55 });
          mesh = new THREE.LineSegments(edges, mat);
          mesh.userData.clickable = false;
        }
        mesh.position.set(x, y, z);
        mesh.userData.code = bin.code;
        scene.add(mesh);
        binMeshes.set(bin.code, mesh);

        if (bin.item && bin.item.qty < bin.item.safety) {
          const warnGeo = new THREE.SphereGeometry(4, 12, 12);
          const warnMat = new THREE.MeshBasicMaterial({ color: 0xc23b3b });
          const warn = new THREE.Mesh(warnGeo, warnMat);
          warn.position.set(x, y + BINH / 2 + 9, z);
          scene.add(warn);
        }
      });
    });

    const target = new THREE.Vector3(totalWidth / 2, totalHeight / 2 - 6, totalDepth / 2);
    const radius0 = Math.max(totalWidth, totalDepth, 260) * 1.45 + 140;
    const theta0 = Math.PI * 0.32;
    const phi0 = 1.0;
    let radius = radius0, theta = theta0, phi = phi0;

    function updateCamera() {
      const cx = target.x + radius * Math.cos(phi) * Math.sin(theta);
      const cy = target.y + radius * Math.sin(phi);
      const cz = target.z + radius * Math.cos(phi) * Math.cos(theta);
      camera.position.set(cx, cy, cz);
      camera.lookAt(target);
    }
    updateCamera();

    let dragging = false, moved = false, lastX = 0, lastY = 0;
    function onPointerDown(e) {
      dragging = true;
      moved = false;
      lastX = e.clientX;
      lastY = e.clientY;
      try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      theta -= dx * 0.006;
      phi = Math.min(1.45, Math.max(0.18, phi + dy * 0.006));
      lastX = e.clientX;
      lastY = e.clientY;
      updateCamera();
    }
    function onPointerUp(e) {
      dragging = false;
      if (!moved) handlePick(e);
    }
    function onWheel(e) {
      e.preventDefault();
      radius = Math.min(1600, Math.max(180, radius + e.deltaY * 0.4));
      updateCamera();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    function handlePick(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const candidates = Array.from(binMeshes.values()).filter((m) => m.userData.clickable);
      const hits = raycaster.intersectObjects(candidates);
      if (hits.length > 0) {
        const code = hits[0].object.userData.code;
        stateRef.current.onSelect && stateRef.current.onSelect(code);
      }
    }

    renderer.domElement.style.touchAction = "none";
    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointermove", onPointerMove);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

    let rafId;
    function animate() {
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(animate);
    }
    animate();

    function handleResize() {
      const w = mount.clientWidth, h = mount.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    const ro = new ResizeObserver(handleResize);
    ro.observe(mount);

    stateRef.current = {
      binMeshes,
      onSelect: null,
      resetView: () => {
        radius = radius0;
        theta = theta0;
        phi = phi0;
        updateCamera();
      },
    };

    return () => {
      cancelAnimationFrame(rafId);
      ro.disconnect();
      renderer.domElement.removeEventListener("pointerdown", onPointerDown);
      renderer.domElement.removeEventListener("pointermove", onPointerMove);
      renderer.domElement.removeEventListener("pointerup", onPointerUp);
      renderer.domElement.removeEventListener("wheel", onWheel);
      scene.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
          else obj.material.dispose();
        }
      });
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, [zones]);

  useEffect(() => {
    stateRef.current.onSelect = (code) => setSelectedCode((prev) => (prev === code ? null : code));
  });

  useEffect(() => {
    const bm = stateRef.current.binMeshes;
    if (!bm) return;
    bm.forEach((mesh, code) => {
      if (!mesh.userData.clickable) return;
      const isSel = code === selectedCode;
      mesh.material.color.setHex(isSel ? 0xf2a93b : mesh.userData.baseColor);
      const s = isSel ? 1.2 : 1;
      mesh.scale.set(s, s, s);
    });
  }, [selectedCode]);

  const legendCats = Array.from(new Set(zones.map((z) => z.category)));

  return (
    <div>
      <PageHeader title="3D 로케이션 뷰" sub="드래그로 회전 · 스크롤로 확대 · 박스 클릭으로 상세 정보 확인" />
      <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ flex: "2 1 460px", minWidth: 320 }}>
          <div
            ref={mountRef}
            style={{ height: 440, background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, position: "relative", cursor: "grab" }}
          />
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
            <button
              onClick={() => stateRef.current.resetView && stateRef.current.resetView()}
              className="ghost-btn"
              style={{ display: "flex", alignItems: "center", gap: 6, border: `1px solid ${T.border}`, background: "#fff", borderRadius: 6, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: T.ink, fontFamily: "inherit" }}
            >
              <RotateCcw size={13} /> 시점 초기화
            </button>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              {legendCats.map((c) => (
                <div key={c} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.inkSoft }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: `#${(CAT_COLOR[c] != null ? CAT_COLOR[c] : FALLBACK_COLORS[0]).toString(16).padStart(6, "0")}` }} />
                  {c}
                </div>
              ))}
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.inkSoft }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: T.danger }} />
                안전재고 미달
              </div>
            </div>
          </div>
        </div>

        <div style={{ flex: "1 1 260px", minWidth: 250, display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ position: "relative" }}>
            <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
            <input
              style={{ ...inputStyle, width: "100%", paddingLeft: 32 }}
              placeholder="품목명 또는 SKU로 위치 찾기"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
          </div>
          {query && (
            <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
              {searchResults.length === 0 ? (
                <EmptyRow text="검색 결과가 없습니다." />
              ) : (
                searchResults.map((b) => (
                  <button
                    key={b.code}
                    onClick={() => setSelectedCode(b.code)}
                    className="rowhover"
                    style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 12px", border: "none", background: "transparent", borderBottom: `1px solid #EEECE3`, cursor: "pointer", fontFamily: "inherit" }}
                  >
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{b.item.name}</div>
                    <div style={{ fontSize: 11.5, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>
                      {b.zoneKey}구역 · {b.aisle}열 · {b.level}단
                    </div>
                  </button>
                ))
              )}
            </div>
          )}

          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 16, minHeight: 160 }}>
            {!selectedBin ? (
              <div style={{ fontSize: 13, color: T.inkSoft, lineHeight: 1.6 }}>
                박스를 클릭하거나 위 검색으로 품목을 찾으면<br />구역 · 열 · 단 위치가 여기에 표시됩니다.
              </div>
            ) : selectedBin.item ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div
                  style={{
                    fontFamily: "'JetBrains Mono', monospace",
                    fontWeight: 700,
                    fontSize: 15,
                    color: T.steel,
                    background: T.bg,
                    borderRadius: 6,
                    padding: "8px 10px",
                  }}
                >
                  {selectedBin.zoneKey}구역 · {selectedBin.aisle}열 · {selectedBin.level}단
                </div>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 700 }}>{selectedBin.item.name}</div>
                  <div style={{ fontSize: 12, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{selectedBin.item.sku}</div>
                </div>
                <div style={{ fontSize: 13, color: T.inkSoft }}>{selectedBin.category}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 700 }}>
                  {selectedBin.item.qty.toLocaleString()} / {selectedBin.item.safety.toLocaleString()} {selectedBin.item.unit}
                </div>
                <StockGauge qty={selectedBin.item.qty} safety={selectedBin.item.safety} />
                <StatusPill status={stockStatus(selectedBin.item)} />
              </div>
            ) : (
              <div style={{ fontSize: 13, color: T.inkSoft }}>비어있는 공간입니다.</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

  PICK_CONFIRMED: { label: "피킹확정", color: "#0E4F3F", bg: "#E7F4EF" },
  SHIPPED: { label: "출고완료", color: "#7A331A", bg: "#F7E9E2" },
  DONE: { label: "PMS전송완료", color: "#0E4F3F", bg: "#E7F4EF" },
};
function OrderStatusPill({ status }) {
  const s = ORDER_STATUS[status] || ORDER_STATUS.NEW;
  return (
    <span style={{ fontSize: 11.5, fontWeight: 700, padding: "2px 9px", borderRadius: 999, color: s.color, background: s.bg, whiteSpace: "nowrap" }}>

}
const cardStyle = { background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20 };
const smallBtnStyle = {
  display: "flex",
  alignItems: "center",
  gap: 6,
  border: `1px solid ${T.border}`,
  background: "#fff",
  borderRadius: 6,
  padding: "8px 13px",
  fontSize: 12.5,
  fontWeight: 600,
  cursor: "pointer",
  color: T.ink,
  fontFamily: "inherit",
};
const primaryBtnStyle = {
  background: T.steel,
  color: "#fff",
  border: "none",
  borderRadius: 6,
  padding: "9px 16px",
  fontWeight: 700,
  fontSize: 13,
  cursor: "pointer",
  display: "flex",
  alignItems: "center",
  gap: 6,
  fontFamily: "inherit",
};

/* ================= I. 주문정보 ================= */
function OrderInfo({ items, orders, onAdd, onAddBulk, onRegisterItemsBulk, onUpdateChangedQty, onConvert, onRegisterItem, onReset, onDeleteDate }) {
  const [showForm, setShowForm] = useState(false);
  const [customer, setCustomer] = useState(STORE_NAMES[0]);
  const [orderType, setOrderType] = useState(ORDER_TYPES[0]);
  const [draftLines, setDraftLines] = useState([{ sku: items[0]?.sku || "", qty: "" }]);
  const [formErr, setFormErr] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [statusFilter, setStatusFilter] = useState("전체");
  const [uploadMsg, setUploadMsg] = useState("");
  const [uploadErr, setUploadErr] = useState("");
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  const selected = orders.find((o) => o.id === selectedId) || null;
  const [storeFilter, setStoreFilter] = useState("전체");
  const [downloading, setDownloading] = useState(false);
  const [deletingDate, setDeletingDate] = useState(null); // 삭제 진행 중인 날짜 (버튼 중복 클릭 방지용)
  const storeOptions = useMemo(() => {
    const map = new Map();
    orders.forEach((o) => {
      const key = o.storeCode || o.customer;
      if (!map.has(key)) map.set(key, { key, label: o.storeCode ? `${o.storeCode} ${o.customer}` : o.customer });
    });
    return Array.from(map.values());
  }, [orders]);
  const filtered = orders.filter(
    (o) => (statusFilter === "전체" || o.status === statusFilter) && (storeFilter === "전체" || (o.storeCode || o.customer) === storeFilter)
  );
  const dateGroups = useMemo(() => {
    const map = new Map();
    orders.forEach((o) => {
      if (!map.has(o.createdAt)) map.set(o.createdAt, { date: o.createdAt, orders: [], orderCount: 0, lineCount: 0, totalQty: 0 });
      const g = map.get(o.createdAt);
      g.orders.push(o);
      g.orderCount += 1;
      g.lineCount += o.lines.length;
      g.totalQty += o.lines.reduce((a, l) => a + l.qty, 0);
    });
    return Array.from(map.values()).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [orders]);

  const supplierGroups = useMemo(() => {
    const map = {};
    orders
      .filter((o) => o.status === "NEW")
      .forEach((o) => {
        const key = o.supplierCode || o.supplier || "기타";
        if (!map[key]) map[key] = { key, name: o.supplier || "기타 화주사", orderCount: 0, skuSet: new Set(), totalQty: 0 };
        map[key].orderCount += 1;
        o.lines.forEach((l) => {
          map[key].skuSet.add(l.sku);
          map[key].totalQty += l.qty;
        });
      });
    return Object.values(map).map((g) => ({ ...g, skuCount: g.skuSet.size }));
  }, [orders]);

  async function parseOneFile(file) {
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let rows = [];

    const isZip = bytes[0] === 0x50 && bytes[1] === 0x4b; // 진짜 xlsx/xls 바이너리(ZIP)
    if (isZip && typeof XLSX !== "undefined") {
      const wb = XLSX.read(bytes, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
    } else {
      // 국내 물류/발주 시스템에서 흔한 "HTML 표를 .xls로 저장" 방식 (대개 EUC-KR 인코딩)
      let text;
      try {
        text = new TextDecoder("euc-kr").decode(bytes);
      } catch (e) {
        text = new TextDecoder("utf-8").decode(bytes);
      }
      if (!/<table/i.test(text)) text = new TextDecoder("utf-8").decode(bytes);
      const doc = new DOMParser().parseFromString(text, "text/html");
      const tables = Array.from(doc.querySelectorAll("table"));
      let best = null,
        bestRows = 0;
      tables.forEach((t) => {
        const n = t.querySelectorAll("tr").length;
        if (n > bestRows) {
          bestRows = n;
          best = t;
        }
      });
      if (best) {
        rows = Array.from(best.querySelectorAll("tr")).map((tr) =>
          Array.from(tr.querySelectorAll("td,th")).map((td) => td.textContent.replace(/\u00a0/g, " ").trim())
        );
      }
    }

    if (rows.length < 2) throw new Error(`${file.name}: 표 형식의 데이터를 찾지 못했습니다.`);
    const header = rows[0].map((h) => (h == null ? "" : String(h)));
    const dataRows = rows.slice(1).filter((r) => r.some((c) => c !== "" && c != null));

    const findCol = (candidates) => {
      for (const cand of candidates) {
        const idx = header.findIndex((h) => h && h.includes(cand));
        if (idx !== -1) return idx;
      }
      return -1;
    };
    const col = {
      orderNo: findCol(["발주번호", "주문번호"]),
      store: findCol(["납품처", "배송처", "발주처"]),
      supplier: findCol(["공급자", "화주사"]),
      sku: findCol(["상품코드", "품목코드", "SKU"]),
      name: findCol(["상품명", "품목명"]),
      qty: findCol(["낱개수량", "발주량", "수량"]),
      packQty: findCol(["입수"]),
      unit: findCol(["단위"]),
      date: findCol(["발주일자", "발주일"]),
      type: findCol(["발주타입", "발주유형"]),
    };
    if (col.sku === -1 || col.qty === -1) {
      throw new Error(`${file.name}: '상품코드/품목코드'와 '수량' 컬럼을 찾지 못했습니다. 헤더명을 확인해주세요.`);
    }

    // "VV99 (주)지에스리테일고촌2저온" 처럼 코드+명칭이 붙어있는 셀을 정확히 분리
    // (예: "고촌"과 "고촌2"처럼 이름이 비슷해도 코드로 구분해 절대 섞이지 않도록 함)
    const splitCodeName = (raw) => {
      const s = String(raw || "").trim();
      const m = s.match(/^([A-Za-z0-9]+)\s+(.+)$/);
      if (m) return { code: m[1], name: m[2].trim() };
      return { code: "", name: s };
    };

    const groups = {};
    const unmatchedMap = new Map(); // sku -> name (자동 등록용)
    dataRows.forEach((r) => {
      const orderNoRaw = col.orderNo !== -1 ? r[col.orderNo] : "";
      const storeSplit = splitCodeName(col.store !== -1 ? r[col.store] : "미지정 매장");
      const supplierSplit = splitCodeName(col.supplier !== -1 ? r[col.supplier] : "기타 화주사");
      // 그룹 키는 반드시 코드 기준 (이름이 비슷해도 코드가 다르면 다른 그룹)
      const key = (orderNoRaw || "UPLOAD") + "__" + (storeSplit.code || storeSplit.name);
      if (!groups[key]) {
        groups[key] = {
          id: uid(),
          orderNo: orderNoRaw ? String(orderNoRaw) : genOrderNo(),
          customer: storeSplit.name || "미지정 매장",
          storeCode: storeSplit.code,
          supplier: supplierSplit.name || "기타 화주사",
          supplierCode: supplierSplit.code,
          channel: (col.type !== -1 && r[col.type]) || "화주사발주",
          createdAt: (col.date !== -1 && r[col.date] && String(r[col.date]).slice(0, 10)) || todayStr(),
          status: "NEW",
          pickDocNo: null,
          pmsStatus: null,
          invoiceIssued: false,
          lines: [],
        };
      }
      const sku = String(r[col.sku] ?? "").trim();
      if (!sku) return;
      const name = (col.name !== -1 && r[col.name]) || sku;
      const qty = Number(r[col.qty]) || 0;
      if (qty <= 0) return;
      const unit = (col.unit !== -1 && r[col.unit]) || "EA";
      const packQty = col.packQty !== -1 ? Number(r[col.packQty]) || 0 : 0;
      const packQtyFixed = PACK_QTY_OVERRIDES[sku]; // 이 상품이면 파일 값 무시하고 고정값 사용
      const matched = items.find((i) => i.sku === sku || i.name === name);
      if (!matched && !unmatchedMap.has(sku)) unmatchedMap.set(sku, name);
      groups[key].lines.push({
        sku,
        name,
        qty,
        changedQty: qty,
        allocatedQty: 0,
        allocStatus: "미할당",
        location: matched ? matched.location : "-",
        unit,
        packQty: packQtyFixed ?? (packQty || matched?.boxQty || 0),
        picked: false,
      });
    });

    const newOrders = Object.values(groups).filter((o) => o.lines.length > 0);
    if (newOrders.length === 0) throw new Error(`${file.name}: 유효한 발주 라인을 찾지 못했습니다.`);
    return { newOrders, unmatchedMap };
  }

  async function handleFiles(fileList) {
    const files = Array.from(fileList);
    setUploadErr("");
    setUploadMsg("");
    setUploading(true);
    const allNewOrders = [];
    const allUnmatched = new Map();
    const fileErrors = [];
    try {
      for (const file of files) {
        try {
          const { newOrders, unmatchedMap } = await parseOneFile(file);
          allNewOrders.push(...newOrders);
          unmatchedMap.forEach((name, sku) => {
            if (!allUnmatched.has(sku)) allUnmatched.set(sku, name);
          });
        } catch (e) {
          fileErrors.push(e.message);
        }
      }

      const unmatchedList = Array.from(allUnmatched.entries());
      if (onRegisterItemsBulk) {
        await onRegisterItemsBulk(unmatchedList);
      } else {
        for (const [sku, name] of unmatchedList) {
          if (onRegisterItem) await onRegisterItem(sku, name);
        }
      }

      let skippedCount = 0;
      if (allNewOrders.length > 0) {
        if (onAddBulk) {
          const res = await onAddBulk(allNewOrders);
          skippedCount = res?.skippedCount || 0;
        } else {
          for (const o of allNewOrders) {
            await onAdd(o);
          }
        }
      }

      const totalLines = allNewOrders.reduce((a, o) => a + o.lines.length, 0);
      const supplierCount = new Set(allNewOrders.map((o) => o.supplierCode || o.supplier)).size;
      if (allNewOrders.length > 0) {
        setUploadMsg(
          `파일 ${files.length}개 중 ${files.length - fileErrors.length}개 처리 완료 · 공급사 ${supplierCount}곳 · 발주 ${allNewOrders.length - skippedCount}건 · 총 ${totalLines}개 라인을 불러왔습니다.` +
            (skippedCount > 0 ? ` (이미 등록된 발주번호 ${skippedCount}건은 건너뛰었습니다.)` : "") +
            (allUnmatched.size > 0 ? ` (상품마스터에 없던 품목 ${allUnmatched.size}건은 '미배정' 위치로 자동 등록되었습니다.)` : "")
        );
      }
      if (fileErrors.length > 0) {
        setUploadErr(fileErrors.join(" / "));
      }
    } finally {
      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  }

  function randomOrder() {
    const inStock = items.filter((i) => i.qty > 0);
    if (inStock.length === 0) return;
    const lineCount = Math.min(inStock.length, 1 + Math.floor(Math.random() * 3));
    const shuffled = [...inStock].sort(() => Math.random() - 0.5).slice(0, lineCount);
    const lines = shuffled.map((i) => {
      const qty = Math.min(i.qty, 1 + Math.floor(Math.random() * 3));
      return { sku: i.sku, name: i.name, qty, changedQty: qty, allocatedQty: 0, allocStatus: "미할당", location: i.location, unit: i.unit, packQty: i.boxQty || 0, picked: false };
    });
    onAdd({
      id: uid(),
      orderNo: genOrderNo(),
      customer: STORE_NAMES[Math.floor(Math.random() * STORE_NAMES.length)],
      storeCode: "",
      supplier: "샘플 발주",
      supplierCode: "",
      channel: ORDER_TYPES[Math.floor(Math.random() * ORDER_TYPES.length)],
      createdAt: todayStr(),
      status: "NEW",
      pickDocNo: null,
      pmsStatus: null,
      invoiceIssued: false,
      lines,
    });
  }

  function addLine() {
    setDraftLines((prev) => [...prev, { sku: items[0]?.sku || "", qty: "" }]);
  }
  function removeLine(idx) {
    setDraftLines((prev) => prev.filter((_, i) => i !== idx));
  }
  function updateLine(idx, field, val) {
    setDraftLines((prev) => prev.map((l, i) => (i === idx ? { ...l, [field]: val } : l)));
  }
  function submitManual() {
    setFormErr("");
    const lines = draftLines
      .filter((l) => Number(l.qty) > 0)
      .map((l) => {
        const it = items.find((i) => i.sku === l.sku);
        const qty = Number(l.qty);
        return { sku: l.sku, name: it ? it.name : l.sku, qty, changedQty: qty, allocatedQty: 0, allocStatus: "미할당", location: it ? it.location : "-", unit: it ? it.unit : "", packQty: it?.boxQty || 0, picked: false };
      });
    if (lines.length === 0) return setFormErr("수량이 1 이상인 품목을 하나 이상 추가해주세요.");
    onAdd({
      id: uid(),
      orderNo: genOrderNo(),
      customer,
      storeCode: "",
      supplier: "직접입력",
      supplierCode: "",
      channel: orderType,
      createdAt: todayStr(),
      status: "NEW",
      pickDocNo: null,
      pmsStatus: null,
      invoiceIssued: false,
      lines,
    });
    setDraftLines([{ sku: items[0]?.sku || "", qty: "" }]);
    setShowForm(false);
  }

  if (selected) {
    return (
      <div>
        <button onClick={() => setSelectedId(null)} className="ghost-btn" style={{ ...smallBtnStyle, marginBottom: 14 }}>
          <ChevronRight size={14} style={{ transform: "rotate(180deg)" }} /> 목록으로
        </button>
        <div style={cardStyle}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 16 }}>{selected.orderNo}</span>
                <OrderStatusPill status={selected.status} />
              </div>
              <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 4 }}>
                {selected.customer} · {selected.channel} · 발주일 {fmtDate(selected.createdAt)}
              </div>
            </div>
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>SKU</th>
                  <th>품목명</th>
                  <th>주문수량</th>
                  <th>박스/낱개 환산</th>
                  <th>변경단위수량</th>
                  <th>할당수량</th>
                  <th>할당상태</th>
                  <th>로케이션</th>
                </tr>
              </thead>
              <tbody>
                {selected.lines.map((l) => (
                  <tr key={l.sku}>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{l.sku}</td>
                    <td style={{ fontWeight: 600 }}>{l.name}</td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{l.qty}</td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.tealDeep, fontWeight: 600 }}>{boxBreakdown(l.qty, l.packQty)}</td>
                    <td>
                      <input
                        type="number"
                        value={l.changedQty}
                        onChange={(e) => onUpdateChangedQty(selected.id, l.sku, Number(e.target.value))}
                        disabled={selected.status !== "NEW"}
                        style={{ ...inputStyle, width: 80, padding: "6px 8px" }}
                      />
                    </td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{l.allocatedQty}</td>
                    <td>{l.allocStatus}</td>
                    <td>
                      <LocationTag loc={l.location} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ fontSize: 11.5, color: T.inkSoft, marginTop: 12 }}>
            * 변경단위수량은 거래명세서 발행 시 명시되는 수량입니다. 신규 상태에서만 수정할 수 있습니다.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <PageHeader title="I. 주문정보" sub="화주사 발주파일을 업로드하거나 관할센터 발주를 직접 접수합니다" />
      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
          <div style={{ fontSize: 13, color: T.inkSoft }}>
            화주사 발주파일(xls/xlsx)을 업로드하면 자동으로 발주 등록과 할당까지 한 번에 완료됩니다. 바로 품목별 검수표에서 확인하세요.
            <br />
            여러 파일을 한 번에 선택해서 업로드할 수 있어요.
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls,.csv"
              multiple
              style={{ display: "none" }}
              onChange={(e) => e.target.files.length > 0 && handleFiles(e.target.files)}
            />
            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={uploading} className="primary-btn" style={primaryBtnStyle}>
              <Upload size={14} /> {uploading ? "읽는 중..." : "발주파일 업로드"}
            </button>
            <button onClick={randomOrder} className="ghost-btn" style={smallBtnStyle}>
              <ClipboardList size={14} /> 샘플 발주 가져오기
            </button>
            <button onClick={() => setShowForm((s) => !s)} className="ghost-btn" style={smallBtnStyle}>
              <Plus size={14} /> 직접 입력
            </button>
            <button
              onClick={() => {
                if (window.confirm("모든 발주 데이터를 삭제합니다. 재고/상품마스터는 그대로 유지됩니다. 계속할까요?")) onReset();
              }}
              className="ghost-btn"
              style={{ ...smallBtnStyle, color: T.danger, borderColor: T.danger + "55" }}
            >
              <Trash2 size={14} /> 테스트 데이터 초기화
            </button>
          </div>
        </div>
        {uploadMsg && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: T.tealDeep, fontWeight: 600, display: "flex", alignItems: "flex-start", gap: 6 }}>
            <Check size={14} style={{ marginTop: 1, flexShrink: 0 }} /> {uploadMsg}
          </div>
        )}
        {uploadErr && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: T.danger, fontWeight: 600, display: "flex", alignItems: "flex-start", gap: 6 }}>
            <AlertTriangle size={14} style={{ marginTop: 1, flexShrink: 0 }} /> {uploadErr}
          </div>
        )}
        {showForm && (
          <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${T.border}`, display: "flex", flexDirection: "column", gap: 12 }}>
            <div className="field-row" style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <Field label="발주처 (관할센터)">
                  <select style={inputStyle} value={customer} onChange={(e) => setCustomer(e.target.value)}>
                    {STORE_NAMES.map((c) => (
                      <option key={c}>{c}</option>
                    ))}
                  </select>
                </Field>
              </div>
              <div style={{ flex: 1 }}>
                <Field label="발주 유형">
                  <select style={inputStyle} value={orderType} onChange={(e) => setOrderType(e.target.value)}>
                    {ORDER_TYPES.map((t) => (
                      <option key={t}>{t}</option>
                    ))}
                  </select>
                </Field>
              </div>
            </div>
            {draftLines.map((l, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>

function PickingList({ orders, items, onToggle, onConfirm, onCancelConfirm, onReallocate }) {
  const [selectedId, setSelectedId] = useState(null);
  const relevant = orders.filter((o) => o.status === "ALLOCATED" || o.status === "PICK_CONFIRMED");
  const selected = relevant.find((o) => o.id === selectedId) || null;

  if (selected) {
    const sortedLines = [...selected.lines]
      .filter((l) => l.allocatedQty > 0)
      .sort((a, b) => {
        const pa = parseLocation(a.location), pb = parseLocation(b.location);
        if (pa.zone !== pb.zone) return pa.zone.localeCompare(pb.zone);
        if (pa.aisle !== pb.aisle) return pa.aisle - pb.aisle;
        return pa.level - pb.level;
      });
    const allPicked = sortedLines.every((l) => l.picked);
    const canConfirm = selected.status === "ALLOCATED" && allPicked && sortedLines.length > 0;

    return (
      <div>
        <button onClick={() => setSelectedId(null)} className="ghost-btn no-print" style={{ ...smallBtnStyle, marginBottom: 14 }}>
          <ChevronRight size={14} style={{ transform: "rotate(180deg)" }} /> 목록으로
        </button>
        <div style={cardStyle} className="print-area">

              <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 4 }}>

                  <input

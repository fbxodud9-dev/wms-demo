function supplierGroupKey(supplier) {
  const s = String(supplier || "").trim();
  if (!s) return "미지정";
  const idx = SUPPLIER_ORDER_LIST.findIndex((name) => s.includes(name) || (SUPPLIER_ALIASES[name] || []).some((a) => s.includes(a)));
  if (idx !== -1) return SUPPLIER_ORDER_LIST[idx]; // 고정 순서표에 있는 이름이면 그걸 대표명으로
  // 순서표에 없는 공급사는 괄호(비율·구분 표기)와 법인격 접두어를 떼어 대표명 추정
  const cleaned = s
    .replace(/\([^)]*\)/g, "")
    .replace(/^(주식회사|농업회사법인\s*주식회사|농업회사법인)\s*/, "")
    .trim();
  return cleaned || s;
}

function stockStatus(item) {
  if (item.qty <= 0) return { label: "재고없음", color: T.danger, bg: "#FBEAEA" };
  if (item.qty < item.safety) return { label: "부족", color: T.danger, bg: "#FBEAEA" };
  if (item.qty < item.safety * 1.3) return { label: "주의", color: T.amberDeep, bg: "#FCF1DD" };
  return { label: "정상", color: T.tealDeep, bg: "#E7F4EF" };
}

function boxBreakdown(qty, packQty) {
  const pq = Number(packQty) || 0;
  if (!pq || pq <= 0) return `${qty}개`;
  const box = Math.floor(qty / pq);
  const rem = qty % pq;
  if (box > 0 && rem > 0) return `${box}박스 ${rem}개`;
  if (box > 0) return `${box}박스`;
  return `${qty}개`;
}

// 백엔드 서버 주소가 바뀌면 이 값만 수정하면 됩니다.
const API_BASE_URL = "https://wms-backend-rk07.onrender.com";

async function apiFetch(path, token, options = {}) {
  let res;
  try {
    res = await fetch(API_BASE_URL + path, {
      method: options.method || "GET",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
  } catch (networkErr) {
    throw new Error("서버에 연결할 수 없습니다. 인터넷 연결이나 백엔드 상태를 확인해주세요.");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `요청이 실패했습니다 (${res.status})`);
  return data;
}

function WMSApp() {
  const [authToken, setAuthToken] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);

  const [tab, setTabState] = useState(() => {
    try {
      const h = window.location.hash.replace("#", "");
      return h || "dashboard";
    } catch (e) {
      return "dashboard";
    }
  });
  const setTab = useCallback((next) => {
    setTabState(next);
    try {
      window.location.hash = next;
    } catch (e) {}
  }, []);
  const [items, setItems] = useState([]);
  const [tx, setTx] = useState([]);
  const [orders, setOrders] = useState([]);
  const [pickingDocs, setPickingDocs] = useState([]);
  const [replenishedSkus, setReplenishedSkus] = useState({});

  const [stores, setStores] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [courses, setCourses] = useState([]);
  const [cells, setCells] = useState([]);

  const [ready, setReady] = useState(false);
  const [apiErr, setApiErr] = useState("");

  // 로그인 정보 복원 (토큰은 로컬에 저장하지만, 실제 데이터는 전부 서버에서 가져옵니다)
  useEffect(() => {
    try {
      const raw = localStorage.getItem("wms-auth");
      if (raw) {
        const parsed = JSON.parse(raw);
        setAuthToken(parsed.token);
        setAuthUser(parsed.user);
      }
    } catch (e) {}
    setAuthReady(true);
  }, []);

  // 아직 서버로 옮기지 않은 로컬 전용 기준정보(매장/차량/코스/셀, 보충 체크상태)
  useEffect(() => {
    try {
      const raw = localStorage.getItem("wms-local-masters");
      if (raw) {
        const parsed = JSON.parse(raw);
        setStores(parsed.stores || seedStores());
        setVehicles(parsed.vehicles || seedVehicles());
        setCourses(parsed.courses || seedCourses());
        setCells(parsed.cells || seedCells());
        setReplenishedSkus(parsed.replenishedSkus || {});
      } else {
        setStores(seedStores());
        setVehicles(seedVehicles());
        setCourses(seedCourses());
        setCells(seedCells());
      }
    } catch (e) {
      setStores(seedStores());
      setVehicles(seedVehicles());
      setCourses(seedCourses());
      setCells(seedCells());
    }
  }, []);
  useEffect(() => {
    try {
      localStorage.setItem("wms-local-masters", JSON.stringify({ stores, vehicles, courses, cells, replenishedSkus }));
    } catch (e) {}
  }, [stores, vehicles, courses, cells, replenishedSkus]);

  const loadCoreData = useCallback(async () => {
    if (!authToken) return;
    try {
      setApiErr("");
      const [itemsRes, ordersRes, txRes, docsRes] = await Promise.all([
        apiFetch("/items", authToken),
        apiFetch("/orders", authToken),
        apiFetch("/transactions?limit=300", authToken),
        apiFetch("/orders/picking-docs", authToken),
      ]);
      setItems(itemsRes.items.map(mapItemFromApi));
      setOrders(ordersRes.orders.map(mapOrderFromApi));
      setTx(txRes.transactions.map(mapTxFromApi));
      setPickingDocs(docsRes.docs.map(mapDocFromApi));
    } catch (e) {
      setApiErr(e.message);
      if (String(e.message).includes("토큰")) doLogout();
    } finally {
      setReady(true);
    }
  }, [authToken]);

  useEffect(() => {
    if (authToken) loadCoreData();
  }, [authToken]); // eslint-disable-line

  // 직원이 상품마스터에서 바꾼 상품 정보(입수·소비기한·표시 상품명·DC/당착 분류)를 로그인 후 한 번 불러온다
  const [productInfo, setProductInfoState] = useState({});
  const applyProductInfo = useCallback((value) => {
    setProductInfo(value);
    setProductInfoState({ ...PRODUCT_INFO });
  }, []);
  useEffect(() => {
    if (!authToken) return;
    let cancelled = false;
    (async () => {
      let value = null;
      try {
        const res = await apiFetch("/settings/product_info", authToken);
        value = res.value;
      } catch (e) {
        try {
          value = JSON.parse(localStorage.getItem("wms-product-info") || "null");
        } catch (e2) {
          value = null;
        }
      }
      if (!cancelled) applyProductInfo(value);
    })();
    return () => {
      cancelled = true;
    };
  }, [authToken, applyProductInfo]);

  // 전산팀이 저장해 둔 피킹지 순서 설정을 로그인 후 한 번 불러온다 (저장된 게 없으면 기본 순서)
  const [orderCfg, setOrderCfg] = useState({ suppliers: null, products: {} });
  const applyOrderCfg = useCallback((value) => {
    setPickingOrderConfig(value);
    setOrderCfg({ suppliers: PICKING_ORDER_CONFIG.suppliers, products: PICKING_ORDER_CONFIG.products });
  }, []);
  useEffect(() => {
    if (!authToken) return;
    let cancelled = false;
    (async () => {
      let value = null;
      try {
        const res = await apiFetch("/settings/picking_order", authToken);
        value = res.value;
      } catch (e) {
        try {
          value = JSON.parse(localStorage.getItem("wms-picking-order") || "null");
        } catch (e2) {
          value = null;
        }
      }
      if (!cancelled) applyOrderCfg(value);
    })();
    return () => {
      cancelled = true;
    };
  }, [authToken, applyOrderCfg]);

  function doLogin(token, user) {
    setAuthToken(token);
    setAuthUser(user);
    try {
      localStorage.setItem("wms-auth", JSON.stringify({ token, user }));
    } catch (e) {}
  }
  function doLogout() {
    setAuthToken(null);
    setAuthUser(null);
    setItems([]);
    setTx([]);
    setOrders([]);
    setPickingDocs([]);
    setReady(false);
    try {
      localStorage.removeItem("wms-auth");
    } catch (e) {}
  }

  const itemsView = useMemo(() => items.map((i) => ({ ...i, replenished: !!replenishedSkus[i.sku] })), [items, replenishedSkus]);

  const lowStock = useMemo(() => items.filter((i) => i.qty < i.safety), [items]);
  const totalQty = useMemo(() => items.reduce((a, b) => a + b.qty, 0), [items]);
  const todayTx = useMemo(() => tx.filter((t) => t.date === todayStr()), [tx]);
  const newOrderCount = useMemo(() => orders.filter((o) => o.status === "NEW").length, [orders]);
  const allocatedCount = useMemo(() => orders.filter((o) => o.status === "ALLOCATED").length, [orders]);
  const readyToShipCount = useMemo(() => orders.filter((o) => o.status === "PICK_CONFIRMED").length, [orders]);

  const applyInbound = useCallback(
    async (payload) => {
      try {
        const exists = items.find((i) => i.sku === payload.sku);
        if (!exists) {
          await apiFetch("/items", authToken, {
            method: "POST",
            body: {
              sku: payload.sku,
              name: payload.name,
              category: payload.category,
              location: payload.location,
              unit: payload.unit,
              qty: 0,
              safety: payload.safety || 10,
              temp_zone: payload.tempZone || "상온",
              work_type: payload.workType || "피킹",
              unit_qty: 1,
              box_qty: 1,
              cbm: 0.01,
            },
          });
        }
        await apiFetch(`/items/${encodeURIComponent(payload.sku)}/inbound`, authToken, {
          method: "POST",
          body: { qty: payload.qty, memo: payload.memo, date: payload.date, location: payload.location },
        });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [items, authToken, loadCoreData]
  );

  const applyOutbound = useCallback(
    async (payload) => {
      try {
        await apiFetch(`/items/${encodeURIComponent(payload.sku)}/outbound`, authToken, {
          method: "POST",
          body: { qty: payload.qty, memo: payload.memo, date: payload.date },
        });
        await loadCoreData();
      } catch (e) {
        setApiErr(e.message);
      }
    },
    [authToken, loadCoreData]
  );

  const addOrder = useCallback(
    async (order) => {
      try {
        await apiFetch("/orders", authToken, {
          method: "POST",
          body: {
            orderNo: order.orderNo,
            orderDate: order.createdAt,
            customer: order.customer,
            storeCode: order.storeCode,
            supplier: order.supplier,
            supplierCode: order.supplierCode,
            channel: order.channel,

  const rekeyItems = useCallback(
    async (pairs) => {

        const res = await apiFetch("/items/rekey", authToken, { method: "POST", body: { pairs: pairs.map(([from, to]) => ({ from, to })) } });
        return { renamed: res.renamed || 0, conflicts: (res.results || []).filter((r) => r.status === "conflict").length };

        setApiErr(e.message);
        return { renamed: 0, conflicts: 0, failed: true };

];
const VOLUME_AUTO_KEYS = ["gs_1", "gs_cold", "gs_2"]; // 주문 데이터에서 자동 집계되는 칸

function localDateStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function shiftDateStr(str, days) {
  const [y, m, d] = str.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}
function weekdayKo(str) {
  const [y, m, d] = str.split("-").map(Number);
  return ["일", "월", "화", "수", "목", "금", "토"][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}
const fmtNum = (n) => Number(n || 0).toLocaleString();

// GS 자동 집계: 피킹지시서와 같은 기준(할당 수량). DC 상품은 "냉장/당착", 나머지는 상품명 끝의 1편/2편으로 구분
function computeGsAuto(orders, date) {
  const auto = { gs_1: 0, gs_cold: 0, gs_2: 0 };
  buildProductsForDate(orders, date).forEach((p) => {
    const k = isDcProduct(p.name) ? "gs_cold" : p.part === 2 ? "gs_2" : "gs_1";
    auto[k] += p.totalQty;
  });
  return auto;
}

// saved: 그 날짜에 직접 입력해 저장한 값({key: 숫자}). GS 3칸은 입력이 없으면 주문 데이터 자동값을 쓴다.
function computeVolumeDay(auto, saved) {
  const rows = {};
  VOLUME_ROW_DEFS.forEach(([key]) => {
    const s = saved ? saved[key] : undefined;
    const entered = s !== undefined && s !== null && s !== "";
    const isAuto = VOLUME_AUTO_KEYS.includes(key);
    rows[key] = { value: entered ? Number(s) : isAuto ? auto[key] : 0, entered, fromOrders: isAuto && !entered, autoValue: isAuto ? auto[key] : null };
  });
  const channels = VOLUME_CHANNELS.map((ch) => {
    const parts = VOLUME_ROW_DEFS.filter((d) => d[2] === ch.id).map((d) => ({ key: d[0], label: d[1], value: rows[d[0]].value }));
    return { ...ch, parts, total: parts.reduce((a, p) => a + p.value, 0) };
  });
  const groups = VOLUME_GROUPS.map((g) => ({ ...g, total: channels.filter((c) => c.group === g.id).reduce((a, c) => a + c.total, 0) }));
  return { rows, channels, groups, total: groups.reduce((a, g) => a + g.total, 0) };
}

const VOLUME_LS_KEY = "wms-volumes";
function readLocalVolumes() {
  try {
    return JSON.parse(localStorage.getItem(VOLUME_LS_KEY) || "{}") || {};
  } catch (e) {
    return {};
  }
}
function writeLocalVolume(date, data) {
  try {
    const all = readLocalVolumes();
    all[date] = data;
    localStorage.setItem(VOLUME_LS_KEY, JSON.stringify(all));
  } catch (e) {
    /* 저장 공간이 막힌 브라우저면 무시 */
  }
}

function DeltaBadge({ diff, pct, size = 12.5 }) {
  if (diff === null) return null;
  const up = diff > 0;
  const flat = diff === 0;
  const color = flat ? T.inkSoft : up ? T.teal : T.clay;
  return (
    <span style={{ fontSize: size, fontWeight: 700, color, fontFamily: "'JetBrains Mono', monospace", whiteSpace: "nowrap" }}>
      {flat ? "±0" : `${up ? "▲" : "▼"} ${fmtNum(Math.abs(diff))}`}
      {pct !== null && !flat ? ` (${up ? "+" : "-"}${Math.abs(pct).toFixed(1)}%)` : ""}
    </span>
  );
}

      f[key] = saved && saved[key] !== undefined && saved[key] !== null ? String(saved[key]) : "";
    });
    return f;
  });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const parse = (s) => {
    const t = String(s).replace(/,/g, "").trim();
    if (t === "") return null;
    const n = Number(t);
    return Number.isFinite(n) && n >= 0 ? Math.round(n) : NaN;
  };
  const data = {};
  let invalid = false;
  VOLUME_ROW_DEFS.forEach(([key]) => {
    const v = parse(form[key]);
    if (Number.isNaN(v)) invalid = true;
    else if (v !== null) data[key] = v;
  });

    if (invalid) return setErr("숫자만 입력해주세요 (0 이상).");

    setErr("");
    try {
      await onSave(date, data);

      setErr(e.message);

      setBusy(false);

            </div>
          </div>
          <button onClick={onClose} style={{ marginLeft: "auto", border: "none", background: "transparent", cursor: "pointer", color: T.inkSoft }}>
            <X size={18} />
          </button>
        </div>
        <div style={{ overflowY: "auto", padding: "6px 20px 14px" }}>
          {VOLUME_GROUPS.map((g) => (
            <div key={g.id}>

function VolumeDashboard({ orders, authToken }) {
  const today = localDateStr();
  const [baseDate, setBaseDate] = useState(today);
  const [savedMap, setSavedMap] = useState({});
  const [notice, setNotice] = useState("");
  const [editingDate, setEditingDate] = useState(null);

  // 기준일 앞 3주치 저장값을 한 번에 불러온다 (전일 = 기준일 이전에 주문/입력이 있는 가장 가까운 날)
  useEffect(() => {
    if (!authToken) return;
    let cancelled = false;
    const from = shiftDateStr(baseDate, -21);
    (async () => {
      try {
        const res = await apiFetch(`/volumes?from=${from}&to=${baseDate}`, authToken);
        if (cancelled) return;
        const map = {};
        (res.volumes || []).forEach((v) => {
          map[v.date] = v.data || {};
        });
        setSavedMap(map);
        setNotice("");
      } catch (e) {
        if (cancelled) return;
        setSavedMap(readLocalVolumes());
        setNotice(`서버에서 물동량을 불러오지 못해 이 브라우저에 저장된 값을 보여줘요 (${e.message})`);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [authToken, baseDate]);

  const orderDates = useMemo(() => new Set(orders.map((o) => o.createdAt)), [orders]);
  const prevDate = useMemo(() => {
    for (let i = 1; i <= 21; i++) {
      const d = shiftDateStr(baseDate, -i);
      if (orderDates.has(d) || (savedMap[d] && Object.keys(savedMap[d]).length)) return d;
    }
    return shiftDateStr(baseDate, -1);
  }, [baseDate, orderDates, savedMap]);

  const autoToday = useMemo(() => computeGsAuto(orders, baseDate), [orders, baseDate]);
  const autoPrev = useMemo(() => computeGsAuto(orders, prevDate), [orders, prevDate]);
  const dayToday = useMemo(() => computeVolumeDay(autoToday, savedMap[baseDate]), [autoToday, savedMap, baseDate]);
  const dayPrev = useMemo(() => computeVolumeDay(autoPrev, savedMap[prevDate]), [autoPrev, savedMap, prevDate]);

  async function handleSave(date, data) {
    try {
      const res = await apiFetch(`/volumes/${date}`, authToken, { method: "PUT", body: { data } });

/* ---------- 3D location view ---------- */
const CAT_COLOR = {
  가전: 0x3e6fa6,
  생활용품: 0x1e8a6e,
  문구용품: 0x8a5a0b,
  식품: 0xc1562f,
  포장자재: 0x6b6a63,
};
const FALLBACK_COLORS = [0x534ab7, 0x2b6cb0, 0x9c4221, 0x2f7a5c, 0x7a4a8a];

function parseLocation(loc) {
  const parts = (loc || "").split("-");
  return {
    zone: parts[0] || "X",
    aisle: parseInt(parts[1], 10) || 1,
    level: parseInt(parts[2], 10) || 1,
  };
}

function buildZoneLayout(items) {
  const map = {};
  items.forEach((it) => {
    const { zone, aisle, level } = parseLocation(it.location);
    if (!map[zone]) map[zone] = { key: zone, items: [], maxAisle: 1, maxLevel: 1, categories: {} };
    map[zone].items.push({ ...it, _aisle: aisle, _level: level });
    map[zone].maxAisle = Math.max(map[zone].maxAisle, aisle);
    map[zone].maxLevel = Math.max(map[zone].maxLevel, level);
    map[zone].categories[it.category] = (map[zone].categories[it.category] || 0) + 1;
  });
  return Object.values(map)
    .sort((a, b) => a.key.localeCompare(b.key))
    .map((z) => {
      const aisles = Math.max(z.maxAisle, 3);
      const levels = Math.max(z.maxLevel, 3);
      const topCategory = Object.entries(z.categories).sort((a, b) => b[1] - a[1])[0]?.[0] || "기타";
      const bins = [];
      for (let l = 1; l <= levels; l++) {
        for (let a = 1; a <= aisles; a++) {
          const found = z.items.find((it) => it._aisle === a && it._level === l);
          bins.push({
            aisle: a,
            level: l,
            item: found || null,
            code: `${z.key}-${String(a).padStart(2, "0")}-${String(l).padStart(2, "0")}`,
          });
        }
      }
      return { key: z.key, category: topCategory, aisles, levels, bins };
    });
}

function ThreeDView({ items }) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const [selectedCode, setSelectedCode] = useState(null);
  const [query, setQuery] = useState("");

  const zones = useMemo(() => buildZoneLayout(items), [items]);
  const allBins = useMemo(
    () => zones.flatMap((z) => z.bins.map((b) => ({ ...b, zoneKey: z.key, category: z.category }))),
    [zones]
  );
  const searchResults = query
    ? allBins.filter((b) => b.item && (b.item.name.includes(query) || b.item.sku.toLowerCase().includes(query.toLowerCase()))).slice(0, 6)
    : [];
  const selectedBin = allBins.find((b) => b.code === selectedCode) || null;

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    const width = mount.clientWidth || 400;
    const height = mount.clientHeight || 440;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(width, height);
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 0.6);
    dl.position.set(140, 240, 180);
    scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0xffffff, 0.25);
    dl2.position.set(-160, 120, -140);
    scene.add(dl2);

    const XSTEP = 42, YSTEP = 34, ZSTEP = 130, BIN = 30, BINH = 24;
    const maxAisles = Math.max(...zones.map((z) => z.aisles), 1);
    const maxLevels = Math.max(...zones.map((z) => z.levels), 1);
    const totalWidth = (maxAisles - 1) * XSTEP;
    const totalDepth = Math.max(zones.length - 1, 0) * ZSTEP;
    const totalHeight = (maxLevels - 1) * YSTEP;

    const floorGeo = new THREE.PlaneGeometry(totalWidth + 260, totalDepth + 260);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xedeae0, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(totalWidth / 2, -6, totalDepth / 2);
    scene.add(floor);

    const grid = new THREE.GridHelper(Math.max(totalWidth, totalDepth, 200) + 320, 24, 0xd3cfc2, 0xe4e1d6);
    grid.position.set(totalWidth / 2, -5.5, totalDepth / 2);
    scene.add(grid);

    function makeTextSprite(text, opts = {}) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 512;
      canvas.height = 128;
      ctx.font = `700 ${opts.fontSize || 40}px 'IBM Plex Sans KR', sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = opts.color || "#1B1D1A";
      ctx.fillText(text, 8, 64);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set((opts.scale && opts.scale[0]) || 100, (opts.scale && opts.scale[1]) || 25, 1);
      return sprite;
    }

    const binMeshes = new Map();

    zones.forEach((zone, zi) => {
      const zBase = zi * ZSTEP;
      const color = CAT_COLOR[zone.category] != null ? CAT_COLOR[zone.category] : FALLBACK_COLORS[zi % FALLBACK_COLORS.length];

      for (let l = 1; l <= zone.levels; l++) {
        const plankW = (zone.aisles - 1) * XSTEP + BIN + 20;
        const plankGeo = new THREE.BoxGeometry(plankW, 3, BIN + 26);
        const plankMat = new THREE.MeshLambertMaterial({ color: 0xd9d5c8 });
        const plank = new THREE.Mesh(plankGeo, plankMat);
        plank.position.set(((zone.aisles - 1) * XSTEP) / 2, (l - 1) * YSTEP - BINH / 2 - 4, zBase);
        scene.add(plank);
      }

      const label = makeTextSprite(`${zone.key}구역 · ${zone.category}`, { fontSize: 42, scale: [110, 27] });
      label.position.set(-78, (zone.levels - 1) * YSTEP + 34, zBase);
      scene.add(label);

      zone.bins.forEach((bin) => {
        const x = (bin.aisle - 1) * XSTEP;
        const y = (bin.level - 1) * YSTEP;
        const z = zBase;
        let mesh;
        if (bin.item) {
          const geo = new THREE.BoxGeometry(BIN, BINH, BIN);
          const mat = new THREE.MeshLambertMaterial({ color });
          mesh = new THREE.Mesh(geo, mat);
          mesh.userData.baseColor = color;
          mesh.userData.clickable = true;
        } else {
          const geo = new THREE.BoxGeometry(BIN * 0.86, BINH * 0.86, BIN * 0.86);
          const edges = new THREE.EdgesGeometry(geo);
          const mat = new THREE.LineBasicMaterial({ color: 0xc7c2b4, transparent: true, opacity: 0.55 });
          mesh = new THREE.LineSegments(edges, mat);
          mesh.userData.clickable = false;
        }
        mesh.position.set(x, y, z);
        mesh.userData.code = bin.code;
        scene.add(mesh);
        binMeshes.set(bin.code, mesh);

        if (bin.item && bin.item.qty < bin.item.safety) {
          const warnGeo = new THREE.SphereGeometry(4, 12, 12);
          const warnMat = new THREE.MeshBasicMaterial({ color: 0xc23b3b });
          const warn = new THREE.Mesh(warnGeo, warnMat);
          warn.position.set(x, y + BINH / 2 + 9, z);
          scene.add(warn);
        }
      });
    });

    const target = new THREE.Vector3(totalWidth / 2, totalHeight / 2 - 6, totalDepth / 2);
    const radius0 = Math.max(totalWidth, totalDepth, 260) * 1.45 + 140;
    const theta0 = Math.PI * 0.32;
    const phi0 = 1.0;
    let radius = radius0, theta = theta0, phi = phi0;

    function updateCamera() {
      const cx = target.x + radius * Math.cos(phi) * Math.sin(theta);
      const cy = target.y + radius * Math.sin(phi);
      const cz = target.z + radius * Math.cos(phi) * Math.cos(theta);
      camera.position.set(cx, cy, cz);
      camera.lookAt(target);
    }
    updateCamera();

    let dragging = false, moved = false, lastX = 0, lastY = 0;
    function onPointerDown(e) {
      dragging = true;
      moved = false;
      lastX = e.clientX;
      lastY = e.clientY;
      try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      theta -= dx * 0.006;
      phi = Math.min(1.45, Math.max(0.18, phi + dy * 0.006));
      lastX = e.clientX;
      lastY = e.clientY;
      updateCamera();
    }
    function onPointerUp(e) {
      dragging = false;
      if (!moved) handlePick(e);
    }
    function onWheel(e) {
      e.preventDefault();
      radius = Math.min(1600, Math.max(180, radius + e.deltaY * 0.4));
      updateCamera();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    function handlePick(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const candidates = Array.from(binMeshes.values()).filter((m) => m.userData.clickable);
      const hits = raycaster.intersectObjects(candidates);
      if (hits.length > 0) {
        const code = hits[0].object.userData.code;
        stateRef.current.onSelect && stateRef.current.onSelect(code);
      }
    }

    renderer.domElement.style.touchAction = "none";
    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointermove", onPointerMove);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

    let rafId;
    function animate() {
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(animate);
    }
    animate();

    function handleResize() {
      const w = mount.clientWidth, h = mount.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    const ro = new ResizeObserver(handleResize);
    ro.observe(mount);

    stateRef.current = {
      binMeshes,
      onSelect: null,
      resetView: () => {
        radius = radius0;
        theta = theta0;
        phi = phi0;
        updateCamera();
      },
    };

    return () => {
      cancelAnimationFrame(rafId);
      ro.disconnect();
      renderer.domElement.removeEventListener("pointerdown", onPointerDown);
      renderer.domElement.removeEventListener("pointermove", onPointerMove);
      renderer.domElement.removeEventListener("pointerup", onPointerUp);
      renderer.domElement.removeEventListener("wheel", onWheel);
      scene.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
          else obj.material.dispose();
        }
      });
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, [zones]);

  useEffect(() => {
    stateRef.current.onSelect = (code) => setSelectedCode((prev) => (prev === code ? null : code));
  });

  useEffect(() => {
    const bm = stateRef.current.binMeshes;

      if (!mesh.userData.clickable) return;
      const isSel = code === selectedCode;
      mesh.material.color.setHex(isSel ? 0xf2a93b : mesh.userData.baseColor);
      const s = isSel ? 1.2 : 1;
      mesh.scale.set(s, s, s);
    });
  }, [selectedCode]);

  const legendCats = Array.from(new Set(zones.map((z) => z.category)));

  return (
    <div>
      <PageHeader title="3D 로케이션 뷰" sub="드래그로 회전 · 스크롤로 확대 · 박스 클릭으로 상세 정보 확인" />

          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexWrap: "wrap" }}>

              className="ghost-btn"
              style={{ display: "flex", alignItems: "center", gap: 6, border: `1px solid ${T.border}`, background: "#fff", borderRadius: 6, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: T.ink, fontFamily: "inherit" }}
            >
              <RotateCcw size={13} /> 시점 초기화

            <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              {legendCats.map((c) => (
                <div key={c} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.inkSoft }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: `#${(CAT_COLOR[c] != null ? CAT_COLOR[c] : FALLBACK_COLORS[0]).toString(16).padStart(6, "0")}` }} />

              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.inkSoft }}>

        <div style={{ flex: "1 1 260px", minWidth: 250, display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ position: "relative" }}>
            <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
            <input

          {query && (

          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 16, minHeight: 160 }}>

    </div>
  );
}

function OrderInfo({ items, orders, onAdd, onAddBulk, onRegisterItemsBulk, onRekeyItems, onUpdateChangedQty, onConvert, onRegisterItem, onReset, onDeleteDate }) {
  const [showForm, setShowForm] = useState(false);
  const [customer, setCustomer] = useState(STORE_NAMES[0]);
  const [orderType, setOrderType] = useState(ORDER_TYPES[0]);
  const [draftLines, setDraftLines] = useState([{ sku: items[0]?.sku || "", qty: "" }]);
  const [formErr, setFormErr] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [statusFilter, setStatusFilter] = useState("전체");
  const [uploadMsg, setUploadMsg] = useState("");
  const [uploadErr, setUploadErr] = useState("");
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  const selected = orders.find((o) => o.id === selectedId) || null;
  const [storeFilter, setStoreFilter] = useState("전체");
  const [downloading, setDownloading] = useState(false);
  const [deletingDate, setDeletingDate] = useState(null); // 삭제 진행 중인 날짜 (버튼 중복 클릭 방지용)
  const storeOptions = useMemo(() => {
    const map = new Map();
    orders.forEach((o) => {
      const key = o.storeCode || o.customer;
      if (!map.has(key)) map.set(key, { key, label: o.storeCode ? `${o.storeCode} ${o.customer}` : o.customer });
    });
    return Array.from(map.values());
  }, [orders]);
  const filtered = orders.filter(
    (o) => (statusFilter === "전체" || o.status === statusFilter) && (storeFilter === "전체" || (o.storeCode || o.customer) === storeFilter)
  );
  const dateGroups = useMemo(() => {
    const map = new Map();
    orders.forEach((o) => {
      if (!map.has(o.createdAt)) map.set(o.createdAt, { date: o.createdAt, orders: [], orderCount: 0, lineCount: 0, totalQty: 0 });
      const g = map.get(o.createdAt);
      g.orders.push(o);
      g.orderCount += 1;
      g.lineCount += o.lines.length;
      g.totalQty += o.lines.reduce((a, l) => a + l.qty, 0);
    });
    return Array.from(map.values()).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [orders]);

  const supplierGroups = useMemo(() => {
    const map = {};
    orders
      .filter((o) => o.status === "NEW")
      .forEach((o) => {
        const key = o.supplierCode || o.supplier || "기타";
        if (!map[key]) map[key] = { key, name: o.supplier || "기타 화주사", orderCount: 0, skuSet: new Set(), totalQty: 0 };
        map[key].orderCount += 1;
        o.lines.forEach((l) => {
          map[key].skuSet.add(l.sku);
          map[key].totalQty += l.qty;
        });
      });
    return Object.values(map).map((g) => ({ ...g, skuCount: g.skuSet.size }));
  }, [orders]);

  async function parseOneFile(file) {
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let rows = [];

    const isZip = bytes[0] === 0x50 && bytes[1] === 0x4b; // 진짜 xlsx/xls 바이너리(ZIP)
    if (isZip && typeof XLSX !== "undefined") {
      const wb = XLSX.read(bytes, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
    } else {
      // 국내 물류/발주 시스템에서 흔한 "HTML 표를 .xls로 저장" 방식 (대개 EUC-KR 인코딩)
      let text;
      try {
        text = new TextDecoder("euc-kr").decode(bytes);
      } catch (e) {
        text = new TextDecoder("utf-8").decode(bytes);
      }
      if (!/<table/i.test(text)) text = new TextDecoder("utf-8").decode(bytes);
      const doc = new DOMParser().parseFromString(text, "text/html");
      const tables = Array.from(doc.querySelectorAll("table"));
      let best = null,
        bestRows = 0;
      tables.forEach((t) => {
        const n = t.querySelectorAll("tr").length;
        if (n > bestRows) {
          bestRows = n;
          best = t;
        }
      });
      if (best) {
        rows = Array.from(best.querySelectorAll("tr")).map((tr) =>
          Array.from(tr.querySelectorAll("td,th")).map((td) => td.textContent.replace(/\u00a0/g, " ").trim())
        );
      }
    }

    if (rows.length < 2) throw new Error(`${file.name}: 표 형식의 데이터를 찾지 못했습니다.`);
    const header = rows[0].map((h) => (h == null ? "" : String(h)));
    const dataRows = rows.slice(1).filter((r) => r.some((c) => c !== "" && c != null));

    const findCol = (candidates) => {
      for (const cand of candidates) {
        const idx = header.findIndex((h) => h && h.includes(cand));
        if (idx !== -1) return idx;
      }
      return -1;
    };
    const col = {
      orderNo: findCol(["발주번호", "주문번호"]),
      store: findCol(["납품처", "배송처", "발주처"]),
      supplier: findCol(["공급자", "화주사"]),
      sku: findCol(["상품코드", "품목코드", "SKU"]),
      name: findCol(["상품명", "품목명"]),
      qty: findCol(["낱개수량", "발주량", "수량"]),
      packQty: findCol(["입수"]),
      unit: findCol(["단위"]),
      date: findCol(["발주일자", "발주일"]),
      delivDate: findCol(["납품일자", "입고일"]),
      type: findCol(["발주타입", "발주유형"]),
    };
    if (col.sku === -1 || col.qty === -1) {
      throw new Error(`${file.name}: '상품코드/품목코드'와 '수량' 컬럼을 찾지 못했습니다. 헤더명을 확인해주세요.`);
    }

    // "VV99 (주)지에스리테일고촌2저온" 처럼 코드+명칭이 붙어있는 셀을 정확히 분리
    // (예: "고촌"과 "고촌2"처럼 이름이 비슷해도 코드로 구분해 절대 섞이지 않도록 함)
    const splitCodeName = (raw) => {
      const s = String(raw || "").trim();
      const m = s.match(/^([A-Za-z0-9]+)\s+(.+)$/);
      if (m) return { code: m[1], name: m[2].trim() };
      return { code: "", name: s };
    };

    // 작업일(피킹 날짜) 보정: 신제주(VV92) 1편처럼 GS가 하루 일찍 발주하는 줄은 발주일자가 하루 빠르지만(예: 발주 10/04)
    // 납품일자는 다른 지역과 같다(10/06). 발주일자 그대로 쓰면 그 줄만 전날 날짜로 들어가 그날 피킹지·명세서에서 빠지므로,
    // 같은 납품일자를 가진 줄들 중 가장 많은 발주일자를 그 납품일자의 작업일로 보고 모든 줄을 그 날짜로 맞춘다.
    const dayOf = (v) => (v == null || v === "" ? "" : String(v).slice(0, 10));
    const workDateByDeliv = new Map();
    if (col.date !== -1 && col.delivDate !== -1) {
      const counts = new Map(); // 납품일자 -> Map(발주일자 -> 줄 수)
      dataRows.forEach((r) => {
        const od = dayOf(r[col.date]);
        const dd = dayOf(r[col.delivDate]);
        if (!od || !dd) return;
        if (!counts.has(dd)) counts.set(dd, new Map());
        const m = counts.get(dd);
        m.set(od, (m.get(od) || 0) + 1);
      });
      counts.forEach((m, dd) => {
        let best = null;
        let bestN = -1;
        m.forEach((n, od) => {
          if (n > bestN || (n === bestN && od > best)) {
            best = od;
            bestN = n;
          }
        });
        workDateByDeliv.set(dd, best);
      });
    }
    const workDateOf = (r) => {
      const od = col.date !== -1 ? dayOf(r[col.date]) : "";
      const dd = col.delivDate !== -1 ? dayOf(r[col.delivDate]) : "";
      return (dd && workDateByDeliv.get(dd)) || od || todayStr();
    };

    const groups = {};
    const unmatchedMap = new Map(); // 상품코드 -> 품목명 (자동 등록용)
    const rekeyMap = new Map(); // 기존 마스터 코드 -> 발주파일 상품코드 (이름으로만 맞은 품목)
    // 파일 안의 상품코드 목록과, 품목명 하나에 상품코드가 딱 하나인지 미리 확인 (모호하면 코드를 바꾸지 않음)
    const fileCodes = new Set();
    const nameToCodes = new Map();
    dataRows.forEach((r) => {
      const c = String(r[col.sku] ?? "").trim();
      if (!c) return;
      fileCodes.add(c);
      const nm = String((col.name !== -1 && r[col.name]) || "").trim();
      if (!nm) return;
      if (!nameToCodes.has(nm)) nameToCodes.set(nm, new Set());
      nameToCodes.get(nm).add(c);
    });
    dataRows.forEach((r) => {
      const orderNoRaw = col.orderNo !== -1 ? r[col.orderNo] : "";
      const storeSplit = splitCodeName(col.store !== -1 ? r[col.store] : "미지정 매장");
      const supplierSplit = splitCodeName(col.supplier !== -1 ? r[col.supplier] : "기타 화주사");
      // 그룹 키는 반드시 코드 기준 (이름이 비슷해도 코드가 다르면 다른 그룹)
      const key = (orderNoRaw || "UPLOAD") + "__" + (storeSplit.code || storeSplit.name);
      if (!groups[key]) {
        groups[key] = {
          id: uid(),
          orderNo: orderNoRaw ? String(orderNoRaw) : genOrderNo(),
          customer: storeSplit.name || "미지정 매장",
          storeCode: storeSplit.code,
          supplier: supplierSplit.name || "기타 화주사",
          supplierCode: supplierSplit.code,
          channel: (col.type !== -1 && r[col.type]) || "화주사발주",
          createdAt: workDateOf(r),
          status: "NEW",
          pickDocNo: null,
          pmsStatus: null,
          invoiceIssued: false,
          lines: [],
        };
      }
      const sku = String(r[col.sku] ?? "").trim();
      if (!sku) return;
      const name = (col.name !== -1 && r[col.name]) || sku;
      const qty = Number(r[col.qty]) || 0;
      if (qty <= 0) return;
      const unit = (col.unit !== -1 && r[col.unit]) || "EA";
      const packQty = col.packQty !== -1 ? Number(r[col.packQty]) || 0 : 0;
      // 상품코드 대신 "품목명"으로 지정하는 입수 강제고정 (카카오톡으로 받은 입수 변경 요청 - 상품코드를 모를 때 사용).
// 발주파일의 상품명과 아래 이름이 정확히 같아야 적용됨. 다르면(띄어쓰기·괄호 등) 조용히 무시되니,
// 적용 후 화면에서 그 상품 입수가 실제로 바뀌었는지 확인 필요.
const PACK_QTY_NAME_OVERRIDES = {
  "혜자)토핑유부(명란&크랩마요)1편": 36,
  "혜자)토핑유부(명란&크랩마요)2편": 36,
  // 채다원/케이제이/엠즈베이커스는 회사명이 상품명 앞에 안 붙는 표기라서 확인 후 회사명 없이 다시 등록함
  "그린박스10": 8, // 채다원
  "밀박스25)그린박스10": 8, // 채다원 - 실제 발주파일 상품명은 "밀박스25)" 접두어가 붙어서 위 이름으로는 매칭이 안 됐음 (10/05 피킹지 확인)
  "예약)쭈꾸미비빔밥(시즌한정)": 12, // 케이제이
  "예약)쭈꾸미덮밥(시즌한정)": 12, // 케이제이 (카톡엔 "볶밥"이었지만 실제 상품명은 "덮밥")
  "예)들기름항정살김치찜(SNS인기)": 20, // 케이제이
  "흔한남매)우유팬케이크": 24, // 엠즈베이커스
  "대광)(네고)미니파베초콜릿(밀크맛)60G": 80,
  "효성)땡초어묵바80G": 100,
  "폭찹스테이크1편": 40, // 카톡엔 "네이처)폭찹스테이크"로 왔지만, 실제 발주파일엔 회사명 없이 이 이름 그대로 찍힘(네이쳐앤휴먼지피 발주 확인)
  "폭찹스테이크2편": 40,
};

// 실제 파일에는 "…1편" 대신 그냥 "…1"로 끝나는 경우도 있어서, 편자 유무 두 표기를 다 시도해본다.
function resolveNamePackOverride(name) {
  const n = String(name || "").trim();
  if (PACK_QTY_NAME_OVERRIDES[n] !== undefined) return PACK_QTY_NAME_OVERRIDES[n];
  const withoutPyeon = n.replace(/(\d)\s*편$/, "$1");
  if (withoutPyeon !== n && PACK_QTY_NAME_OVERRIDES[withoutPyeon] !== undefined) return PACK_QTY_NAME_OVERRIDES[withoutPyeon];
  const withPyeon = n.replace(/(\d)$/, "$1편");
  if (withPyeon !== n && PACK_QTY_NAME_OVERRIDES[withPyeon] !== undefined) return PACK_QTY_NAME_OVERRIDES[withPyeon];
  return undefined;
}

      const packQtyFixed = PACK_QTY_OVERRIDES[sku] ?? resolveNamePackOverride(name); // 이 상품이면 파일 값 무시하고 고정값 사용
      // 상품코드가 기준: 코드로 먼저 찾고, 없으면 품목명으로 찾되 그때는 마스터 코드를 발주파일 상품코드로 바꾼다
      const byCode = items.find((i) => i.sku === sku);
      const byName = byCode ? null : items.find((i) => i.name === name);
      const matched = byCode || byName;
      if (byName && byName.sku !== sku && !fileCodes.has(byName.sku) && (nameToCodes.get(String(name).trim()) || new Set([sku])).size === 1) {
        rekeyMap.set(byName.sku, sku);
      }
      if (!matched && !unmatchedMap.has(sku)) unmatchedMap.set(sku, name);
      groups[key].lines.push({
        sku,
        name,
        qty,
        changedQty: qty,
        allocatedQty: 0,
        allocStatus: "미할당",
        location: matched ? matched.location : "-",
        unit,
        packQty: packQtyFixed ?? (packQty || matched?.boxQty || 0),
        picked: false,
      });
    });

    const newOrders = Object.values(groups).filter((o) => o.lines.length > 0);
    if (newOrders.length === 0) throw new Error(`${file.name}: 유효한 발주 라인을 찾지 못했습니다.`);
    return { newOrders, unmatchedMap, rekeyMap };
  }

  async function handleFiles(fileList) {
    const files = Array.from(fileList);
    setUploadErr("");
    setUploadMsg("");
    setUploading(true);
    const allNewOrders = [];
    const allUnmatched = new Map();
    const allRekey = new Map();
    const rekeyAmbiguous = new Set();
    const fileErrors = [];
    try {
      for (const file of files) {
        try {
          const { newOrders, unmatchedMap, rekeyMap } = await parseOneFile(file);
          allNewOrders.push(...newOrders);
          rekeyMap.forEach((to, from) => {
            if (allRekey.has(from) && allRekey.get(from) !== to) rekeyAmbiguous.add(from); // 파일마다 다른 코드를 말하면 바꾸지 않음
            else allRekey.set(from, to);
          });
          unmatchedMap.forEach((name, sku) => {
            if (!allUnmatched.has(sku)) allUnmatched.set(sku, name);
          });
        } catch (e) {
          fileErrors.push(e.message);
        }
      }

      // 발주파일의 상품코드와 다르게 등록돼 있던 상품마스터 코드부터 발주파일 기준으로 교체
      rekeyAmbiguous.forEach((from) => allRekey.delete(from));
      let rekeyResult = { renamed: 0, conflicts: 0 };
      if (onRekeyItems && allRekey.size > 0) {
        rekeyResult = await onRekeyItems(Array.from(allRekey.entries()));
        // 새 코드로 이미 등록돼 있어서 못 바꾼 품목은 '미등록'으로 다시 등록하지 않게 제외 (중복 방지)
      }
      const unmatchedList = Array.from(allUnmatched.entries());
      if (onRegisterItemsBulk) {
        await onRegisterItemsBulk(unmatchedList);
      } else {
        for (const [sku, name] of unmatchedList) {
          if (onRegisterItem) await onRegisterItem(sku, name);
        }
      }

      let skippedCount = 0;
      if (allNewOrders.length > 0) {
        if (onAddBulk) {
          const res = await onAddBulk(allNewOrders);
          skippedCount = res?.skippedCount || 0;
        } else {
          for (const o of allNewOrders) {
            await onAdd(o);
          }
        }
      }

      const totalLines = allNewOrders.reduce((a, o) => a + o.lines.length, 0);
      const supplierCount = new Set(allNewOrders.map((o) => o.supplierCode || o.supplier)).size;
      if (allNewOrders.length > 0) {
        setUploadMsg(
          `파일 ${files.length}개 중 ${files.length - fileErrors.length}개 처리 완료 · 공급사 ${supplierCount}곳 · 발주 ${allNewOrders.length - skippedCount}건 · 총 ${totalLines}개 라인을 불러왔습니다.` +
            (skippedCount > 0 ? ` (이미 등록된 발주번호 ${skippedCount}건은 건너뛰었습니다.)` : "") +
            (allUnmatched.size > 0 ? ` (상품마스터에 없던 품목 ${allUnmatched.size}건은 '미배정' 위치로 자동 등록되었습니다.)` : "") +
            (rekeyResult.renamed > 0 ? ` (상품마스터의 상품코드 ${rekeyResult.renamed}건을 발주파일의 상품코드로 바꿨습니다.)` : "") +
            (rekeyResult.conflicts > 0 ? ` (상품코드 ${rekeyResult.conflicts}건은 같은 코드의 다른 품목이 이미 있어 바꾸지 못했습니다. 상품마스터에서 확인해주세요.)` : "")
        );
      }
      if (fileErrors.length > 0) {
        setUploadErr(fileErrors.join(" / "));
      }
    } finally {
      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  }

  function randomOrder() {
    const inStock = items.filter((i) => i.qty > 0);
    if (inStock.length === 0) return;
    const lineCount = Math.min(inStock.length, 1 + Math.floor(Math.random() * 3));
    const shuffled = [...inStock].sort(() => Math.random() - 0.5).slice(0, lineCount);
    const lines = shuffled.map((i) => {
      const qty = Math.min(i.qty, 1 + Math.floor(Math.random() * 3));
      return { sku: i.sku, name: i.name, qty, changedQty: qty, allocatedQty: 0, allocStatus: "미할당", location: i.location, unit: i.unit, packQty: i.boxQty || 0, picked: false };
    });
    onAdd({
      id: uid(),
      orderNo: genOrderNo(),
      customer: STORE_NAMES[Math.floor(Math.random() * STORE_NAMES.length)],
      storeCode: "",
      supplier: "샘플 발주",
      supplierCode: "",
      channel: ORDER_TYPES[Math.floor(Math.random() * ORDER_TYPES.length)],
      createdAt: todayStr(),
      status: "NEW",
      pickDocNo: null,
      pmsStatus: null,
      invoiceIssued: false,
      lines,
    });
  }

  function addLine() {
    setDraftLines((prev) => [...prev, { sku: items[0]?.sku || "", qty: "" }]);
  }
  function removeLine(idx) {
    setDraftLines((prev) => prev.filter((_, i) => i !== idx));
  }
  function updateLine(idx, field, val) {
    setDraftLines((prev) => prev.map((l, i) => (i === idx ? { ...l, [field]: val } : l)));
  }
  function submitManual() {
    setFormErr("");
    const lines = draftLines
      .filter((l) => Number(l.qty) > 0)
      .map((l) => {
        const it = items.find((i) => i.sku === l.sku);
        const qty = Number(l.qty);
        return { sku: l.sku, name: it ? it.name : l.sku, qty, changedQty: qty, allocatedQty: 0, allocStatus: "미할당", location: it ? it.location : "-", unit: it ? it.unit : "", packQty: it?.boxQty || 0, picked: false };
      });
    if (lines.length === 0) return setFormErr("수량이 1 이상인 품목을 하나 이상 추가해주세요.");
    onAdd({
      id: uid(),
      orderNo: genOrderNo(),
      customer,
      storeCode: "",
      supplier: "직접입력",
      supplierCode: "",
      channel: orderType,
      createdAt: todayStr(),
      status: "NEW",
      pickDocNo: null,
      pmsStatus: null,
      invoiceIssued: false,
      lines,
    });
    setDraftLines([{ sku: items[0]?.sku || "", qty: "" }]);
    setShowForm(false);
  }

  if (selected) {
    return (
      <div>
        <button onClick={() => setSelectedId(null)} className="ghost-btn" style={{ ...smallBtnStyle, marginBottom: 14 }}>
          <ChevronRight size={14} style={{ transform: "rotate(180deg)" }} /> 목록으로
        </button>
        <div style={cardStyle}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 16 }}>{selected.orderNo}</span>
                <OrderStatusPill status={selected.status} />
              </div>
              <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 4 }}>
                {selected.customer} · {selected.channel} · 발주일 {fmtDate(selected.createdAt)}
              </div>
            </div>
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>상품코드</th>
                  <th>품목명</th>
                  <th>주문수량</th>
                  <th>박스/낱개 환산</th>
                  <th>변경단위수량</th>
                  <th>할당수량</th>
                  <th>할당상태</th>
                  <th>로케이션</th>
                </tr>
              </thead>
              <tbody>
                {selected.lines.map((l) => (
                  <tr key={l.sku}>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{l.sku}</td>
                    <td style={{ fontWeight: 600 }}>{l.name}</td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{l.qty}</td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.tealDeep, fontWeight: 600 }}>{boxBreakdown(l.qty, l.packQty)}</td>
                    <td>
                      <input
                        type="number"
                        value={l.changedQty}
                        onChange={(e) => onUpdateChangedQty(selected.id, l.sku, Number(e.target.value))}
                        disabled={selected.status !== "NEW"}
                        style={{ ...inputStyle, width: 80, padding: "6px 8px" }}
                      />
                    </td>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{l.allocatedQty}</td>
                    <td>{l.allocStatus}</td>
                    <td>
                      <LocationTag loc={l.location} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ fontSize: 11.5, color: T.inkSoft, marginTop: 12 }}>
            * 변경단위수량은 거래명세서 발행 시 명시되는 수량입니다. 신규 상태에서만 수정할 수 있습니다.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <PageHeader title="I. 주문정보" sub="화주사 발주파일을 업로드하거나 관할센터 발주를 직접 접수합니다" />
      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
          <div style={{ fontSize: 13, color: T.inkSoft }}>
            화주사 발주파일(xls/xlsx)을 업로드하면 자동으로 발주 등록과 할당까지 한 번에 완료됩니다. 바로 품목별 검수표에서 확인하세요.
            <br />
            여러 파일을 한 번에 선택해서 업로드할 수 있어요.
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls,.csv"
              multiple
              style={{ display: "none" }}
              onChange={(e) => e.target.files.length > 0 && handleFiles(e.target.files)}
            />
            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={uploading} className="primary-btn" style={primaryBtnStyle}>
              <Upload size={14} /> {uploading ? "읽는 중..." : "발주파일 업로드"}
            </button>
            <button onClick={randomOrder} className="ghost-btn" style={smallBtnStyle}>
              <ClipboardList size={14} /> 샘플 발주 가져오기
            </button>
            <button onClick={() => setShowForm((s) => !s)} className="ghost-btn" style={smallBtnStyle}>
              <Plus size={14} /> 직접 입력
            </button>
            <button
              onClick={() => {
                if (window.confirm("모든 발주 데이터를 삭제합니다. 재고/상품마스터는 그대로 유지됩니다. 계속할까요?")) onReset();
              }}
              className="ghost-btn"
              style={{ ...smallBtnStyle, color: T.danger, borderColor: T.danger + "55" }}
            >
              <Trash2 size={14} /> 테스트 데이터 초기화
            </button>
          </div>
        </div>
        {uploadMsg && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: T.tealDeep, fontWeight: 600, display: "flex", alignItems: "flex-start", gap: 6 }}>
            <Check size={14} style={{ marginTop: 1, flexShrink: 0 }} /> {uploadMsg}
          </div>
        )}
        {uploadErr && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: T.danger, fontWeight: 600, display: "flex", alignItems: "flex-start", gap: 6 }}>
            <AlertTriangle size={14} style={{ marginTop: 1, flexShrink: 0 }} /> {uploadErr}
          </div>
        )}
        {showForm && (
          <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${T.border}`, display: "flex", flexDirection: "column", gap: 12 }}>
            <div className="field-row" style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <Field label="발주처 (관할센터)">
                  <select style={inputStyle} value={customer} onChange={(e) => setCustomer(e.target.value)}>
                    {STORE_NAMES.map((c) => (
                      <option key={c}>{c}</option>
                    ))}
                  </select>
                </Field>
              </div>
              <div style={{ flex: 1 }}>
                <Field label="발주 유형">
                  <select style={inputStyle} value={orderType} onChange={(e) => setOrderType(e.target.value)}>
                    {ORDER_TYPES.map((t) => (
                      <option key={t}>{t}</option>
                    ))}
                  </select>
                </Field>
              </div>
            </div>
            {draftLines.map((l, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
                <div style={{ flex: 1 }}>
                  <Field label="품목">
                    <select style={inputStyle} value={l.sku} onChange={(e) => updateLine(idx, "sku", e.target.value)}>
                      {items.map((i) => (
                        <option key={i.id} value={i.sku}>
                          {i.sku} · {i.name}
                        </option>
                      ))}
                    </select>
                  </Field>
                </div>
                <Field label="수량">
                  <input style={{ ...inputStyle, width: 90 }} type="number" value={l.qty} onChange={(e) => updateLine(idx, "qty", e.target.value)} placeholder="0" />
                </Field>
                {draftLines.length > 1 && (
                  <button onClick={() => removeLine(idx)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.danger, padding: "9px" }}>
                    <Trash2 size={16} />
                  </button>
                )}
              </div>
            ))}
            <button onClick={addLine} style={{ alignSelf: "flex-start", ...smallBtnStyle }}>
              <Plus size={13} /> 품목 줄 추가
            </button>
            {formErr && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{formErr}</div>}
            <button onClick={submitManual} className="primary-btn" style={{ ...primaryBtnStyle, alignSelf: "flex-start" }}>
              발주 등록
            </button>
          </div>
        )}
      </div>

      {supplierGroups.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>공급사별 발주 현황 (신규)</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {supplierGroups.map((g) => (
              <div
                key={g.key}
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  flexWrap: "wrap",
                  gap: 12,
                  background: T.surface,
                  border: `1px solid ${T.border}`,
                  borderRadius: 8,
                  padding: "14px 18px",
                }}
              >
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{g.name}</div>
                  <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 3 }}>
                    발주 {g.orderCount}건 · 품목 {g.skuCount}종 · 총수량 <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{g.totalQty.toLocaleString()}</span>개
                  </div>
                </div>
                <button onClick={() => onConvert(g.key)} className="primary-btn" style={primaryBtnStyle}>
                  <ClipboardList size={15} /> 피킹지시서 변환하기
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="no-print">
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>날짜별 발주 현황</div>
        {dateGroups.length === 0 ? (
          <div style={cardStyle}>
            <EmptyRow text="등록된 발주가 없습니다." />
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {dateGroups.map((g) => (
              <div
                key={g.date}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12,
                  background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: "14px 18px",
                }}
              >
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14.5, fontFamily: "'JetBrains Mono', monospace" }}>{fmtDate(g.date)}</div>
                  <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 3 }}>
                    발주 {g.orderCount}건 · 품목라인 {g.lineCount}개 · 총수량 {g.totalQty.toLocaleString()}개
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={() => downloadOrderInfoExcel(g.orders, g.date, `주문정보_${g.date}.xlsx`, setDownloading)}
                    disabled={downloading}
                    className="primary-btn"
                    style={{ ...primaryBtnStyle, opacity: downloading ? 0.7 : 1 }}
                  >
                    <Download size={15} /> {downloading ? "생성 중..." : "엑셀로 보기"}
                  </button>
                  <button
                    onClick={() => downloadPyeonsuList(g.orders, g.date, setDownloading).catch((e) => window.alert(`편수리스트를 만들지 못했어요: ${e.message}`))}
                    disabled={downloading}
                    className="ghost-btn"
                    style={{ ...smallBtnStyle, opacity: downloading ? 0.7 : 1 }}
                    title="GS 당착·DC 브랜드별 SKU 수를 채운 편수리스트"
                  >
                    <ClipboardList size={14} /> 편수리스트
                  </button>
                  <button
                    onClick={async () => {
                      if (!window.confirm(`${fmtDate(g.date)} 날짜의 발주 ${g.orderCount}건을 삭제합니다. 다른 날짜는 그대로 유지돼요. 계속할까요?`)) return;
                      setDeletingDate(g.date);
                      await onDeleteDate(g.date);
                      setDeletingDate(null);
                    }}
                    disabled={deletingDate === g.date}
                    className="ghost-btn"
                    style={{ ...smallBtnStyle, color: T.danger, borderColor: T.danger + "55", opacity: deletingDate === g.date ? 0.7 : 1 }}
                  >
                    <Trash2 size={14} /> {deletingDate === g.date ? "삭제 중..." : "이 날짜 삭제"}
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= II. 상품할당 ================= */
function Allocation({ items, orders, onAllocate }) {
  const newOrders = orders.filter((o) => o.status === "NEW");
  const stockOf = (sku) => items.find((i) => i.sku === sku)?.qty ?? 0;

  return (
    <div>
      <PageHeader title="II. 상품할당" sub="발주 등록과 동시에 요청수량 그대로 자동 할당됩니다 (별도 버튼 조작 불필요, 크로스도킹 정책)" />
      {newOrders.length > 1 && (
        <div style={{ marginBottom: 14 }}>
          <button onClick={() => newOrders.forEach((o) => onAllocate(o.id))} className="ghost-btn" style={smallBtnStyle}>
            <CheckSquare size={14} /> 신규 발주 전체 일괄할당 ({newOrders.length}건)
          </button>
        </div>
      )}
      {newOrders.length === 0 ? (

function PickingList({ orders, items, onToggle, onConfirm, onCancelConfirm, onReallocate }) {
  const [selectedId, setSelectedId] = useState(null);
  const relevant = orders.filter((o) => o.status === "ALLOCATED" || o.status === "PICK_CONFIRMED");
  const selected = relevant.find((o) => o.id === selectedId) || null;

  if (selected) {
    const sortedLines = [...selected.lines]
      .filter((l) => l.allocatedQty > 0)
      .sort((a, b) => {
        const pa = parseLocation(a.location), pb = parseLocation(b.location);
        if (pa.zone !== pb.zone) return pa.zone.localeCompare(pb.zone);
        if (pa.aisle !== pb.aisle) return pa.aisle - pb.aisle;
        return pa.level - pb.level;
      });
    const allPicked = sortedLines.every((l) => l.picked);
    const canConfirm = selected.status === "ALLOCATED" && allPicked && sortedLines.length > 0;

    return (
      <div>
        <button onClick={() => setSelectedId(null)} className="ghost-btn no-print" style={{ ...smallBtnStyle, marginBottom: 14 }}>
          <ChevronRight size={14} style={{ transform: "rotate(180deg)" }} /> 목록으로
        </button>
        <div style={cardStyle} className="print-area">

              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 16 }}>{selected.orderNo}</span>
                <OrderStatusPill status={selected.status} />
              </div>
              <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 4 }}>
                {selected.customer} {selected.pickDocNo && <> · 지시서 {selected.pickDocNo}</>}

            <div className="no-print" style={{ display: "flex", gap: 8 }}>
              <button onClick={() => window.print()} className="ghost-btn" style={smallBtnStyle}>

          {sortedLines.length === 0 ? (
            <EmptyRow text="할당된 품목이 없습니다. 상품마스터에 품목을 등록한 뒤 다시 할당해주세요." />
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {sortedLines.map((l) => (
                <div key={l.sku} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: T.bg, borderRadius: 6, border: `1px solid ${T.border}` }}>
                  <input
                    type="checkbox"
                    className="no-print"
                    checked={!!l.picked}
                    disabled={selected.status !== "ALLOCATED"}
                    onChange={() => onToggle(selected.id, l.sku)}
                    style={{ width: 18, height: 18, cursor: selected.status === "ALLOCATED" ? "pointer" : "not-allowed" }}

                    <div style={{ fontSize: 11.5, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{l.sku}</div>

  return (
    <div>
      <PageHeader title="V. 피킹 확정" sub="할당 완료된 발주에 대해 지역·위치별로 피킹 체크하고 확정합니다" />

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>재고관리센터 · WMS 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #F3F2ED; }
  #root { max-width: 1180px; margin: 0 auto; padding: 20px; }
  * { box-sizing: border-box; }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

function IconBase(props) {
  const { size = 16, strokeWidth = 2, color, style, className, children } = props;
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke={color || "currentColor"}
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      style={style}
      className={className}
    >
      {children}
    </svg>
  );
}

function LayoutDashboard(props) {
  return (
    <IconBase {...props}>
      <rect x="3" y="3" width="7" height="9" rx="1" />
      <rect x="14" y="3" width="7" height="5" rx="1" />
      <rect x="14" y="10" width="7" height="11" rx="1" />
      <rect x="3" y="14" width="7" height="7" rx="1" />
    </IconBase>
  );
}

function Boxes(props) {
  return (
    <IconBase {...props}>
      <rect x="3" y="3" width="8" height="8" rx="1" />
      <rect x="13" y="3" width="8" height="8" rx="1" />
      <rect x="3" y="13" width="8" height="8" rx="1" />
      <rect x="13" y="13" width="8" height="8" rx="1" />
    </IconBase>
  );
}

function ArrowDownToLine(props) {
  return (
    <IconBase {...props}>
      <line x1="12" y1="3" x2="12" y2="14" />
      <polyline points="7 9 12 14 17 9" />
      <line x1="5" y1="20" x2="19" y2="20" />
    </IconBase>
  );
}

function ArrowUpFromLine(props) {
  return (
    <IconBase {...props}>
      <line x1="12" y1="21" x2="12" y2="10" />
      <polyline points="7 15 12 10 17 15" />
      <line x1="5" y1="4" x2="19" y2="4" />
    </IconBase>
  );
}

function History(props) {
  return (
    <IconBase {...props}>
      <path d="M3 12a9 9 0 1 0 3-6.7" />
      <polyline points="3 3 3 8 8 8" />
      <polyline points="12 7 12 12 15 14" />
    </IconBase>
  );
}

function Search(props) {
  return (
    <IconBase {...props}>
      <circle cx="10" cy="10" r="7" />
      <line x1="21" y1="21" x2="15" y2="15" />
    </IconBase>
  );
}

function AlertTriangle(props) {
  return (
    <IconBase {...props}>
      <path d="M12 3 L22 20 L2 20 Z" />
      <line x1="12" y1="9" x2="12" y2="14" />
      <circle cx="12" cy="17.3" r="0.6" fill="currentColor" stroke="none" />
    </IconBase>
  );
}

function Package(props) {
  return (
    <IconBase {...props}>
      <path d="M3 8 L12 3 L21 8 L12 13 Z" />
      <path d="M3 8 L3 17 L12 21 L21 17 L21 8" />
      <line x1="12" y1="13" x2="12" y2="21" />
    </IconBase>
  );
}

function X(props) {
  return (
    <IconBase {...props}>
      <line x1="5" y1="5" x2="19" y2="19" />
      <line x1="19" y1="5" x2="5" y2="19" />
    </IconBase>
  );
}

function Check(props) {
  return (
    <IconBase {...props}>
      <polyline points="4 12 9 17 20 6" />
    </IconBase>
  );
}

function ChevronRight(props) {
  return (
    <IconBase {...props}>
      <polyline points="9 6 15 12 9 18" />
    </IconBase>
  );
}

function Plus(props) {
  return (
    <IconBase {...props}>
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </IconBase>
  );
}

function MapPin(props) {
  return (
    <IconBase {...props}>
      <path d="M12 2 C7.6 2 4 5.6 4 10 C4 16 12 22 12 22 C12 22 20 16 20 10 C20 5.6 16.4 2 12 2 Z" />
      <circle cx="12" cy="10" r="2.6" />
    </IconBase>
  );
}

function Clock(props) {
  return (
    <IconBase {...props}>
      <circle cx="12" cy="12" r="9" />
      <polyline points="12 7 12 12 15 15" />
    </IconBase>
  );
}

function Loader2(props) {
  return (
    <IconBase {...props}>
      <path d="M21 12a9 9 0 1 1-9-9" />
    </IconBase>
  );
}

function RotateCcw(props) {
  return (
    <IconBase {...props}>
      <path d="M3 12a9 9 0 1 0 3-6.7" />
      <polyline points="3 3 3 8 8 8" />
    </IconBase>
  );
}

const Box3dIcon = Package;


/* ---------- design tokens ---------- */
const T = {
  bg: "#F3F2ED",
  surface: "#FFFFFF",
  ink: "#1B1D1A",
  inkSoft: "#6B6A63",
  steel: "#2B3239",
  steelSoft: "#3E4750",
  amber: "#F2A93B",
  amberDeep: "#8A5A0B",
  teal: "#1E8A6E",
  tealDeep: "#0E4F3F",
  clay: "#C1562F",
  clayDeep: "#7A331A",
  danger: "#C23B3B",
  dangerDeep: "#7A2323",
  border: "#DDD9CE",
  borderStrong: "#C7C2B4",
};

const FONT_IMPORT =
  "@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');";

const CATEGORIES = ["가전", "생활용품", "문구용품", "식품", "포장자재"];

const seedItems = () => [
  { id: "i1", sku: "ELEC-1001", name: "무선 이어폰", category: "가전", location: "A-01-01", unit: "개", qty: 120, safety: 50 },
  { id: "i2", sku: "ELEC-1002", name: "블루투스 스피커", category: "가전", location: "A-01-02", unit: "개", qty: 35, safety: 40 },
  { id: "i3", sku: "HOME-2001", name: "스테인리스 텀블러", category: "생활용품", location: "B-02-01", unit: "개", qty: 200, safety: 80 },
  { id: "i4", sku: "HOME-2002", name: "극세사 수건세트", category: "생활용품", location: "B-02-02", unit: "세트", qty: 15, safety: 30 },
  { id: "i5", sku: "STAT-3001", name: "A4 복사용지", category: "문구용품", location: "C-01-01", unit: "박스", qty: 500, safety: 100 },
  { id: "i6", sku: "STAT-3002", name: "볼펜 12자루세트", category: "문구용품", location: "C-01-02", unit: "세트", qty: 60, safety: 50 },
  { id: "i7", sku: "FOOD-4001", name: "즉석밥 24개입", category: "식품", location: "D-01-01", unit: "박스", qty: 90, safety: 60 },
  { id: "i8", sku: "FOOD-4002", name: "생수 2L 6팩", category: "식품", location: "D-01-02", unit: "팩", qty: 25, safety: 40 },
  { id: "i9", sku: "PACK-5001", name: "골판지 박스(중)", category: "포장자재", location: "E-01-01", unit: "개", qty: 300, safety: 100 },
  { id: "i10", sku: "PACK-5002", name: "에어캡 롤", category: "포장자재", location: "E-01-02", unit: "롤", qty: 45, safety: 30 },
];

const seedTx = (items) => {
  const today = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  const y = new Date(today);
  y.setDate(y.getDate() - 1);
  return [
    { id: "t1", type: "IN", sku: "ELEC-1001", name: "무선 이어폰", qty: 50, location: "A-01-01", date: iso(y), memo: "정기 발주 입고" },
    { id: "t2", type: "OUT", sku: "STAT-3001", name: "A4 복사용지", qty: 30, location: "C-01-01", date: iso(y), memo: "사무팀 출고" },
    { id: "t3", type: "OUT", sku: "FOOD-4002", name: "생수 2L 6팩", qty: 15, location: "D-01-02", date: iso(today), memo: "온라인몰 주문 출고" },
    { id: "t4", type: "IN", sku: "PACK-5001", name: "골판지 박스(중)", qty: 100, location: "E-01-01", date: iso(today), memo: "포장자재 보충" },
  ];
};

function uid() {
  return Math.random().toString(36).slice(2, 10);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function fmtDate(d) {
  const [y, m, day] = d.split("-");
  return `${y}.${m}.${day}`;
}

function stockStatus(item) {
  if (item.qty <= 0) return { label: "재고없음", color: T.danger, bg: "#FBEAEA" };
  if (item.qty < item.safety) return { label: "부족", color: T.danger, bg: "#FBEAEA" };
  if (item.qty < item.safety * 1.3) return { label: "주의", color: T.amberDeep, bg: "#FCF1DD" };
  return { label: "정상", color: T.tealDeep, bg: "#E7F4EF" };
}

/* ---------- shared UI bits ---------- */
function StockGauge({ qty, safety }) {
  const ratio = safety > 0 ? Math.min(qty / (safety * 2), 1) : 1;
  const s = stockStatus({ qty, safety });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 120 }}>
      <div style={{ flex: 1, height: 6, background: "#EAE7DC", borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: `${ratio * 100}%`, height: "100%", background: s.color, borderRadius: 3 }} />
      </div>
      <span style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft, minWidth: 30 }}>
        {Math.round(ratio * 100)}%
      </span>
    </div>
  );
}

function LocationTag({ loc }) {
  return (
    <span
      style={{
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 12,
        fontWeight: 700,
        padding: "3px 8px",
        border: `1px solid ${T.borderStrong}`,
        borderRadius: 3,
        background: "#FBFAF7",
        color: T.steel,
        letterSpacing: 0.5,
        display: "inline-flex",
        alignItems: "center",
        gap: 4,
      }}
    >
      <MapPin size={11} strokeWidth={2.5} />
      {loc}
    </span>
  );
}

function StatusPill({ status }) {
  return (
    <span
      style={{
        fontSize: 12,
        fontWeight: 600,
        padding: "3px 10px",
        borderRadius: 999,
        color: status.color,
        background: status.bg,
      }}
    >
      {status.label}
    </span>
  );
}

function Metric({ label, value, sub, accent }) {
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: "16px 18px", flex: 1, minWidth: 150 }}>
      <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 8, fontWeight: 500 }}>{label}</div>
      <div style={{ fontSize: 26, fontWeight: 700, color: accent || T.ink, fontFamily: "'JetBrains Mono', monospace" }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13, color: T.inkSoft, fontWeight: 500 }}>
      {label}
      {children}
    </label>
  );
}

const inputStyle = {
  padding: "9px 10px",
  border: `1px solid ${T.border}`,
  borderRadius: 6,
  fontSize: 14,
  fontFamily: "'IBM Plex Sans KR', sans-serif",
  color: T.ink,
  background: "#FFFFFF",
  outline: "none",
};

/* ---------- main app ---------- */
function WMSApp() {
  const [tab, setTab] = useState("dashboard");
  const [items, setItems] = useState([]);
  const [tx, setTx] = useState([]);
  const [ready, setReady] = useState(false);
  const [saveErr, setSaveErr] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("wms-data");
      if (raw) {
        const parsed = JSON.parse(raw);
        setItems(parsed.items || seedItems());
        setTx(parsed.transactions || seedTx());
      } else {
        setItems(seedItems());
        setTx(seedTx());
      }
    } catch (e) {
      setItems(seedItems());
      setTx(seedTx());
    }
    setReady(true);
  }, []);

  useEffect(() => {
    if (!ready) return;
    try {
      localStorage.setItem("wms-data", JSON.stringify({ items, transactions: tx }));
      setSaveErr(false);
    } catch (e) {
      setSaveErr(true);
    }
  }, [items, tx, ready]);

  const lowStock = useMemo(() => items.filter((i) => i.qty < i.safety), [items]);
  const totalQty = useMemo(() => items.reduce((a, b) => a + b.qty, 0), [items]);
  const todayTx = useMemo(() => tx.filter((t) => t.date === todayStr()), [tx]);

  const applyInbound = useCallback((payload) => {
    setItems((prev) => {
      const exists = prev.find((i) => i.sku === payload.sku);
      if (exists) {
        return prev.map((i) => (i.sku === payload.sku ? { ...i, qty: i.qty + payload.qty, location: payload.location || i.location } : i));
      }
      return [
        ...prev,
        {
          id: uid(),
          sku: payload.sku,
          name: payload.name,
          category: payload.category,
          location: payload.location,
          unit: payload.unit,
          qty: payload.qty,
          safety: payload.safety || 10,
        },
      ];
    });
    setTx((prev) => [
      { id: uid(), type: "IN", sku: payload.sku, name: payload.name, qty: payload.qty, location: payload.location, date: payload.date, memo: payload.memo },
      ...prev,
    ]);
  }, []);

  const applyOutbound = useCallback((payload) => {
    setItems((prev) => prev.map((i) => (i.sku === payload.sku ? { ...i, qty: i.qty - payload.qty } : i)));
    setTx((prev) => [
      { id: uid(), type: "OUT", sku: payload.sku, name: payload.name, qty: payload.qty, location: payload.location, date: payload.date, memo: payload.memo },
      ...prev,
    ]);
  }, []);

  const navItems = [
    { key: "dashboard", label: "대시보드", icon: LayoutDashboard },
    { key: "inventory", label: "재고현황", icon: Boxes },
    { key: "3d", label: "3D 로케이션", icon: Box3dIcon },
    { key: "inbound", label: "입고등록", icon: ArrowDownToLine },
    { key: "outbound", label: "출고등록", icon: ArrowUpFromLine },
    { key: "history", label: "입출고이력", icon: History },
  ];

  if (!ready) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 400, color: T.inkSoft, gap: 8 }}>
        <Loader2 size={18} className="spin" />
        불러오는 중...
      </div>
    );
  }

  return (
    <div
      style={{
        fontFamily: "'IBM Plex Sans KR', sans-serif",
        background: T.bg,
        color: T.ink,
        borderRadius: 12,
        overflow: "hidden",
        border: `1px solid ${T.border}`,
        display: "flex",
        minHeight: 640,
      }}
    >
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        .navbtn:hover { background: #3A424B !important; }
        .rowhover:hover { background: #FAF9F5; }
        .primary-btn:hover { background: #232830 !important; }
        .ghost-btn:hover { background: #EFEDE4 !important; }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input:focus, select:focus, textarea:focus { border-color: ${T.steel} !important; box-shadow: 0 0 0 2px rgba(43,50,57,0.12); }
        table { border-collapse: collapse; width: 100%; }
        th { text-align: left; font-size: 12px; color: ${T.inkSoft}; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid ${T.border}; }
        td { padding: 12px; font-size: 13.5px; border-bottom: 1px solid #EEECE3; vertical-align: middle; }
      `}</style>

      {/* sidebar */}
      <div style={{ width: 196, background: T.steel, color: "#fff", padding: "20px 12px", display: "flex", flexDirection: "column", gap: 4, flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 10px 20px" }}>
          <div style={{ width: 30, height: 30, borderRadius: 6, background: T.amber, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Package size={17} color={T.steel} strokeWidth={2.5} />
          </div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.2 }}>재고관리센터</div>
            <div style={{ fontSize: 10.5, color: "#A9AFB6" }}>WMS · INVENTORY</div>
          </div>
        </div>
        {navItems.map((n) => {
          const Icon = n.icon;
          const active = tab === n.key;
          return (
            <button
              key={n.key}
              className="navbtn"
              onClick={() => setTab(n.key)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                padding: "10px 12px",
                borderRadius: 6,
                border: "none",
                cursor: "pointer",
                background: active ? T.amber : "transparent",
                color: active ? T.steel : "#D7DBDE",
                fontWeight: active ? 700 : 500,
                fontSize: 13.5,
                textAlign: "left",
                fontFamily: "inherit",
              }}
            >
              <Icon size={16} strokeWidth={2.2} />
              {n.label}
              {n.key === "dashboard" && lowStock.length > 0 && (
                <span style={{ marginLeft: "auto", fontSize: 10.5, background: active ? T.steel : T.danger, color: "#fff", borderRadius: 999, padding: "1px 6px", fontFamily: "'JetBrains Mono', monospace" }}>
                  {lowStock.length}
                </span>
              )}
            </button>
          );
        })}
        <div style={{ marginTop: "auto", padding: "10px", fontSize: 11, color: "#8B9198", borderTop: "1px solid #3E4750" }}>
          {saveErr ? "⚠ 저장 실패 — 재시도 중" : "자동 저장됨"}
        </div>
      </div>

      {/* content */}
      <div style={{ flex: 1, padding: "24px 28px", overflow: "auto" }}>
        {tab === "dashboard" && <Dashboard items={items} tx={tx} lowStock={lowStock} totalQty={totalQty} todayTx={todayTx} goTo={setTab} />}
        {tab === "inventory" && <Inventory items={items} />}
        {tab === "3d" && <ThreeDView items={items} />}
        {tab === "inbound" && <Inbound items={items} onSubmit={applyInbound} />}
        {tab === "outbound" && <Outbound items={items} onSubmit={applyOutbound} />}
        {tab === "history" && <HistoryView tx={tx} />}
      </div>
    </div>
  );
}

/* ---------- dashboard ---------- */
function Dashboard({ items, tx, lowStock, totalQty, todayTx, goTo }) {
  const inCount = todayTx.filter((t) => t.type === "IN").length;
  const outCount = todayTx.filter((t) => t.type === "OUT").length;
  return (
    <div>
      <PageHeader title="대시보드" sub={`오늘, ${fmtDate(todayStr())}`} />
      <div style={{ display: "flex", gap: 14, marginBottom: 22, flexWrap: "wrap" }}>
        <Metric label="총 품목 수" value={items.length} sub="등록된 SKU" />
        <Metric label="총 재고 수량" value={totalQty.toLocaleString()} sub="전체 로케이션 합산" />
        <Metric label="재고 부족 품목" value={lowStock.length} sub="안전재고 미달" accent={lowStock.length ? T.danger : T.ink} />
        <Metric label="오늘 입출고" value={`${inCount + outCount}건`} sub={`입고 ${inCount} · 출고 ${outCount}`} />
      </div>

      <div style={{ display: "flex", gap: 18, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 340px", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
          <SectionHead icon={AlertTriangle} title="재고 부족 알림" color={T.danger} onMore={() => goTo("inventory")} />
          {lowStock.length === 0 ? (
            <EmptyRow text="안전재고 미달 품목이 없습니다." />
          ) : (
            <div>
              {lowStock.slice(0, 6).map((i) => (
                <div key={i.id} className="rowhover" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 16px", borderBottom: `1px solid #EEECE3` }}>
                  <div>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{i.name}</div>
                    <div style={{ fontSize: 11.5, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{i.sku}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 13, fontFamily: "'JetBrains Mono', monospace", color: T.danger, fontWeight: 700 }}>
                      {i.qty} / {i.safety} {i.unit}
                    </div>
                    <LocationTag loc={i.location} />
                  </div>
                </div>

            <div>
              {tx.slice(0, 6).map((t) => (
                <div key={t.id} className="rowhover" style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 16px", borderBottom: `1px solid #EEECE3` }}>

    </div>
  );
}

/* ---------- 3D location view ---------- */
const CAT_COLOR = {
  가전: 0x3e6fa6,
  생활용품: 0x1e8a6e,
  문구용품: 0x8a5a0b,
  식품: 0xc1562f,
  포장자재: 0x6b6a63,
};
const FALLBACK_COLORS = [0x534ab7, 0x2b6cb0, 0x9c4221, 0x2f7a5c, 0x7a4a8a];

function parseLocation(loc) {
  const parts = (loc || "").split("-");
  return {
    zone: parts[0] || "X",
    aisle: parseInt(parts[1], 10) || 1,
    level: parseInt(parts[2], 10) || 1,
  };
}

function buildZoneLayout(items) {
  const map = {};
  items.forEach((it) => {
    const { zone, aisle, level } = parseLocation(it.location);
    if (!map[zone]) map[zone] = { key: zone, items: [], maxAisle: 1, maxLevel: 1, categories: {} };
    map[zone].items.push({ ...it, _aisle: aisle, _level: level });
    map[zone].maxAisle = Math.max(map[zone].maxAisle, aisle);
    map[zone].maxLevel = Math.max(map[zone].maxLevel, level);
    map[zone].categories[it.category] = (map[zone].categories[it.category] || 0) + 1;
  });
  return Object.values(map)
    .sort((a, b) => a.key.localeCompare(b.key))
    .map((z) => {
      const aisles = Math.max(z.maxAisle, 3);
      const levels = Math.max(z.maxLevel, 3);
      const topCategory = Object.entries(z.categories).sort((a, b) => b[1] - a[1])[0]?.[0] || "기타";
      const bins = [];
      for (let l = 1; l <= levels; l++) {
        for (let a = 1; a <= aisles; a++) {
          const found = z.items.find((it) => it._aisle === a && it._level === l);
          bins.push({
            aisle: a,
            level: l,
            item: found || null,
            code: `${z.key}-${String(a).padStart(2, "0")}-${String(l).padStart(2, "0")}`,
          });
        }
      }
      return { key: z.key, category: topCategory, aisles, levels, bins };
    });
}

function ThreeDView({ items }) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const [selectedCode, setSelectedCode] = useState(null);
  const [query, setQuery] = useState("");

  const zones = useMemo(() => buildZoneLayout(items), [items]);
  const allBins = useMemo(
    () => zones.flatMap((z) => z.bins.map((b) => ({ ...b, zoneKey: z.key, category: z.category }))),
    [zones]
  );
  const searchResults = query
    ? allBins.filter((b) => b.item && (b.item.name.includes(query) || b.item.sku.toLowerCase().includes(query.toLowerCase()))).slice(0, 6)
    : [];
  const selectedBin = allBins.find((b) => b.code === selectedCode) || null;

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    const width = mount.clientWidth || 400;
    const height = mount.clientHeight || 440;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(width, height);
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 0.6);
    dl.position.set(140, 240, 180);
    scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0xffffff, 0.25);
    dl2.position.set(-160, 120, -140);
    scene.add(dl2);

    const XSTEP = 42, YSTEP = 34, ZSTEP = 130, BIN = 30, BINH = 24;
    const maxAisles = Math.max(...zones.map((z) => z.aisles), 1);
    const maxLevels = Math.max(...zones.map((z) => z.levels), 1);
    const totalWidth = (maxAisles - 1) * XSTEP;
    const totalDepth = Math.max(zones.length - 1, 0) * ZSTEP;
    const totalHeight = (maxLevels - 1) * YSTEP;

    const floorGeo = new THREE.PlaneGeometry(totalWidth + 260, totalDepth + 260);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xedeae0, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(totalWidth / 2, -6, totalDepth / 2);
    scene.add(floor);

    const grid = new THREE.GridHelper(Math.max(totalWidth, totalDepth, 200) + 320, 24, 0xd3cfc2, 0xe4e1d6);
    grid.position.set(totalWidth / 2, -5.5, totalDepth / 2);
    scene.add(grid);

    function makeTextSprite(text, opts = {}) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 512;
      canvas.height = 128;
      ctx.font = `700 ${opts.fontSize || 40}px 'IBM Plex Sans KR', sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = opts.color || "#1B1D1A";
      ctx.fillText(text, 8, 64);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set((opts.scale && opts.scale[0]) || 100, (opts.scale && opts.scale[1]) || 25, 1);
      return sprite;
    }

    const binMeshes = new Map();

    zones.forEach((zone, zi) => {
      const zBase = zi * ZSTEP;
      const color = CAT_COLOR[zone.category] != null ? CAT_COLOR[zone.category] : FALLBACK_COLORS[zi % FALLBACK_COLORS.length];

      for (let l = 1; l <= zone.levels; l++) {
        const plankW = (zone.aisles - 1) * XSTEP + BIN + 20;
        const plankGeo = new THREE.BoxGeometry(plankW, 3, BIN + 26);
        const plankMat = new THREE.MeshLambertMaterial({ color: 0xd9d5c8 });
        const plank = new THREE.Mesh(plankGeo, plankMat);
        plank.position.set(((zone.aisles - 1) * XSTEP) / 2, (l - 1) * YSTEP - BINH / 2 - 4, zBase);
        scene.add(plank);
      }

      const label = makeTextSprite(`${zone.key}구역 · ${zone.category}`, { fontSize: 42, scale: [110, 27] });
      label.position.set(-78, (zone.levels - 1) * YSTEP + 34, zBase);
      scene.add(label);

      zone.bins.forEach((bin) => {
        const x = (bin.aisle - 1) * XSTEP;
        const y = (bin.level - 1) * YSTEP;
        const z = zBase;
        let mesh;
        if (bin.item) {
          const geo = new THREE.BoxGeometry(BIN, BINH, BIN);
          const mat = new THREE.MeshLambertMaterial({ color });
          mesh = new THREE.Mesh(geo, mat);
          mesh.userData.baseColor = color;
          mesh.userData.clickable = true;
        } else {
          const geo = new THREE.BoxGeometry(BIN * 0.86, BINH * 0.86, BIN * 0.86);
          const edges = new THREE.EdgesGeometry(geo);
          const mat = new THREE.LineBasicMaterial({ color: 0xc7c2b4, transparent: true, opacity: 0.55 });
          mesh = new THREE.LineSegments(edges, mat);
          mesh.userData.clickable = false;
        }
        mesh.position.set(x, y, z);
        mesh.userData.code = bin.code;
        scene.add(mesh);
        binMeshes.set(bin.code, mesh);

        if (bin.item && bin.item.qty < bin.item.safety) {
          const warnGeo = new THREE.SphereGeometry(4, 12, 12);
          const warnMat = new THREE.MeshBasicMaterial({ color: 0xc23b3b });
          const warn = new THREE.Mesh(warnGeo, warnMat);
          warn.position.set(x, y + BINH / 2 + 9, z);
          scene.add(warn);
        }
      });
    });

    const target = new THREE.Vector3(totalWidth / 2, totalHeight / 2 - 6, totalDepth / 2);
    const radius0 = Math.max(totalWidth, totalDepth, 260) * 1.45 + 140;
    const theta0 = Math.PI * 0.32;
    const phi0 = 1.0;
    let radius = radius0, theta = theta0, phi = phi0;

    function updateCamera() {
      const cx = target.x + radius * Math.cos(phi) * Math.sin(theta);
      const cy = target.y + radius * Math.sin(phi);
      const cz = target.z + radius * Math.cos(phi) * Math.cos(theta);
      camera.position.set(cx, cy, cz);
      camera.lookAt(target);
    }
    updateCamera();

    let dragging = false, moved = false, lastX = 0, lastY = 0;
    function onPointerDown(e) {
      dragging = true;
      moved = false;
      lastX = e.clientX;
      lastY = e.clientY;
      try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      theta -= dx * 0.006;
      phi = Math.min(1.45, Math.max(0.18, phi + dy * 0.006));
      lastX = e.clientX;
      lastY = e.clientY;
      updateCamera();
    }
    function onPointerUp(e) {
      dragging = false;
      if (!moved) handlePick(e);
    }
    function onWheel(e) {
      e.preventDefault();
      radius = Math.min(1600, Math.max(180, radius + e.deltaY * 0.4));
      updateCamera();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    function handlePick(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const candidates = Array.from(binMeshes.values()).filter((m) => m.userData.clickable);
      const hits = raycaster.intersectObjects(candidates);
      if (hits.length > 0) {
        const code = hits[0].object.userData.code;
        stateRef.current.onSelect && stateRef.current.onSelect(code);
      }
    }

    renderer.domElement.style.touchAction = "none";
    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointermove", onPointerMove);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

    let rafId;
    function animate() {
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(animate);
    }
    animate();

    function handleResize() {
      const w = mount.clientWidth, h = mount.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    const ro = new ResizeObserver(handleResize);
    ro.observe(mount);

    stateRef.current = {
      binMeshes,
      onSelect: null,
      resetView: () => {
        radius = radius0;
        theta = theta0;
        phi = phi0;
        updateCamera();
      },
    };

    return () => {
      cancelAnimationFrame(rafId);
      ro.disconnect();
      renderer.domElement.removeEventListener("pointerdown", onPointerDown);
      renderer.domElement.removeEventListener("pointermove", onPointerMove);
      renderer.domElement.removeEventListener("pointerup", onPointerUp);
      renderer.domElement.removeEventListener("wheel", onWheel);
      scene.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
          else obj.material.dispose();
        }
      });
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, [zones]);

  useEffect(() => {
    stateRef.current.onSelect = (code) => setSelectedCode((prev) => (prev === code ? null : code));
  });

  useEffect(() => {
    const bm = stateRef.current.binMeshes;
    if (!bm) return;
    bm.forEach((mesh, code) => {
      if (!mesh.userData.clickable) return;
      const isSel = code === selectedCode;
      mesh.material.color.setHex(isSel ? 0xf2a93b : mesh.userData.baseColor);
      const s = isSel ? 1.2 : 1;
      mesh.scale.set(s, s, s);
    });
  }, [selectedCode]);

  const legendCats = Array.from(new Set(zones.map((z) => z.category)));

  return (
    <div>
      <PageHeader title="3D 로케이션 뷰" sub="드래그로 회전 · 스크롤로 확대 · 박스 클릭으로 상세 정보 확인" />
      <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ flex: "2 1 460px", minWidth: 320 }}>
          <div
            ref={mountRef}
            style={{ height: 440, background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, position: "relative", cursor: "grab" }}
          />
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
            <button
              onClick={() => stateRef.current.resetView && stateRef.current.resetView()}
              className="ghost-btn"
              style={{ display: "flex", alignItems: "center", gap: 6, border: `1px solid ${T.border}`, background: "#fff", borderRadius: 6, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: T.ink, fontFamily: "inherit" }}
            >
              <RotateCcw size={13} /> 시점 초기화
            </button>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              {legendCats.map((c) => (
                <div key={c} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.inkSoft }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: `#${(CAT_COLOR[c] != null ? CAT_COLOR[c] : FALLBACK_COLORS[0]).toString(16).padStart(6, "0")}` }} />
                  {c}
                </div>
              ))}
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.inkSoft }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: T.danger }} />
                안전재고 미달
              </div>
            </div>
          </div>
        </div>

        <div style={{ flex: "1 1 260px", minWidth: 250, display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ position: "relative" }}>
            <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
            <input
              style={{ ...inputStyle, width: "100%", paddingLeft: 32 }}
              placeholder="품목명 또는 SKU로 위치 찾기"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
          </div>
          {query && (
            <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
              {searchResults.length === 0 ? (
                <EmptyRow text="검색 결과가 없습니다." />
              ) : (
                searchResults.map((b) => (
                  <button
                    key={b.code}
                    onClick={() => setSelectedCode(b.code)}
                    className="rowhover"
                    style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 12px", border: "none", background: "transparent", borderBottom: `1px solid #EEECE3`, cursor: "pointer", fontFamily: "inherit" }}
                  >
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{b.item.name}</div>
                    <div style={{ fontSize: 11.5, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>
                      {b.zoneKey}구역 · {b.aisle}열 · {b.level}단
                    </div>
                  </button>
                ))
              )}
            </div>
          )}

          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 16, minHeight: 160 }}>
            {!selectedBin ? (
              <div style={{ fontSize: 13, color: T.inkSoft, lineHeight: 1.6 }}>
                박스를 클릭하거나 위 검색으로 품목을 찾으면<br />구역 · 열 · 단 위치가 여기에 표시됩니다.
              </div>
            ) : selectedBin.item ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div
                  style={{
                    fontFamily: "'JetBrains Mono', monospace",
                    fontWeight: 700,
                    fontSize: 15,
                    color: T.steel,
                    background: T.bg,
                    borderRadius: 6,
                    padding: "8px 10px",
                  }}
                >
                  {selectedBin.zoneKey}구역 · {selectedBin.aisle}열 · {selectedBin.level}단
                </div>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 700 }}>{selectedBin.item.name}</div>
                  <div style={{ fontSize: 12, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{selectedBin.item.sku}</div>
                </div>
                <div style={{ fontSize: 13, color: T.inkSoft }}>{selectedBin.category}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 700 }}>
                  {selectedBin.item.qty.toLocaleString()} / {selectedBin.item.safety.toLocaleString()} {selectedBin.item.unit}
                </div>
                <StockGauge qty={selectedBin.item.qty} safety={selectedBin.item.safety} />
                <StatusPill status={stockStatus(selectedBin.item)} />
              </div>
            ) : (
              <div style={{ fontSize: 13, color: T.inkSoft }}>비어있는 공간입니다.</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- inbound ---------- */
function Inbound({ items, onSubmit }) {
  const [mode, setMode] = useState("existing");
  const [sku, setSku] = useState(items[0]?.sku || "");
  const [qty, setQty] = useState("");
  const [location, setLocation] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayStr());
  const [newItem, setNewItem] = useState({ sku: "", name: "", category: CATEGORIES[0], location: "", unit: "개", safety: "" });
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");

  const selected = items.find((i) => i.sku === sku);

  useEffect(() => {
    if (mode === "existing" && selected) setLocation(selected.location);
  }, [sku, mode]); // eslint-disable-line

  function submit() {
    setErr("");
    const q = Number(qty);
    if (!q || q <= 0) return setErr("수량은 1 이상의 숫자여야 합니다.");
    if (mode === "existing") {
      if (!selected) return setErr("품목을 선택해주세요.");
      onSubmit({ sku: selected.sku, name: selected.name, category: selected.category, location: location || selected.location, unit: selected.unit, qty: q, date, memo });
      setToast(`${selected.name} ${q}${selected.unit} 입고 처리되었습니다.`);
    } else {
      if (!newItem.sku || !newItem.name || !newItem.location) return setErr("SKU, 품목명, 로케이션을 모두 입력해주세요.");
      if (items.some((i) => i.sku === newItem.sku)) return setErr("이미 존재하는 SKU입니다.");
      onSubmit({ ...newItem, safety: Number(newItem.safety) || 10, qty: q, date, memo });
      setToast(`${newItem.name} 신규 등록 및 입고 처리되었습니다.`);
      setNewItem({ sku: "", name: "", category: CATEGORIES[0], location: "", unit: "개", safety: "" });
    }
    setQty("");
    setMemo("");
    setTimeout(() => setToast(""), 3500);
  }

  return (
    <div style={{ maxWidth: 560 }}>
      <PageHeader title="입고 등록" sub="기존 품목에 재고를 추가하거나 신규 품목을 등록합니다" />
      <ModeToggle mode={mode} setMode={setMode} labels={["existing", "new"]} display={["기존 품목", "신규 품목"]} accent={T.teal} />

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", gap: 14, marginTop: 14 }}>
        {mode === "existing" ? (
          <Field label="품목 선택">
            <select style={inputStyle} value={sku} onChange={(e) => setSku(e.target.value)}>
              {items.map((i) => (
                <option key={i.id} value={i.sku}>
                  {i.sku} · {i.name} (현재 {i.qty}{i.unit})
                </option>
              ))}
            </select>
          </Field>
        ) : (
          <>
            <div style={{ display: "flex", gap: 12 }}>
              <Field label="SKU">
                <input style={inputStyle} value={newItem.sku} onChange={(e) => setNewItem({ ...newItem, sku: e.target.value })} placeholder="예: ELEC-1003" />
              </Field>
              <Field label="카테고리">
                <select style={inputStyle} value={newItem.category} onChange={(e) => setNewItem({ ...newItem, category: e.target.value })}>
                  {CATEGORIES.map((c) => (
                    <option key={c}>{c}</option>
                  ))}
                </select>
              </Field>
            </div>
            <Field label="품목명">
              <input style={inputStyle} value={newItem.name} onChange={(e) => setNewItem({ ...newItem, name: e.target.value })} placeholder="품목명을 입력하세요" />
            </Field>
            <div style={{ display: "flex", gap: 12 }}>
              <Field label="단위">
                <input style={inputStyle} value={newItem.unit} onChange={(e) => setNewItem({ ...newItem, unit: e.target.value })} placeholder="개 / 박스 / 세트" />
              </Field>
              <Field label="안전재고">
                <input style={inputStyle} type="number" value={newItem.safety} onChange={(e) => setNewItem({ ...newItem, safety: e.target.value })} placeholder="10" />
              </Field>
            </div>
            <Field label="로케이션">
              <input style={inputStyle} value={newItem.location} onChange={(e) => setNewItem({ ...newItem, location: e.target.value })} placeholder="예: A-01-03" />
            </Field>
          </>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="입고 수량">
            <input style={inputStyle} type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="0" />
          </Field>
          <Field label="입고일">
            <input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
        </div>
        {mode === "existing" && (
          <Field label="로케이션 (변경 시에만 수정)">
            <input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} />
          </Field>
        )}
        <Field label="메모 (선택)">
          <input style={inputStyle} value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 정기 발주 입고" />
        </Field>

        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{err}</div>}

        <button
          onClick={submit}
          className="primary-btn"
          style={{ background: T.steel, color: "#fff", border: "none", borderRadius: 6, padding: "11px 16px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <ArrowDownToLine size={15} /> 입고 처리
        </button>
        {toast && <Toast text={toast} color={T.teal} />}
      </div>
    </div>
  );
}

/* ---------- outbound ---------- */
function Outbound({ items, onSubmit }) {
  const [sku, setSku] = useState(items[0]?.sku || "");
  const [qty, setQty] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayStr());
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");
  const selected = items.find((i) => i.sku === sku);

  function submit() {
    setErr("");
    const q = Number(qty);
    if (!selected) return setErr("품목을 선택해주세요.");
    if (!q || q <= 0) return setErr("수량은 1 이상의 숫자여야 합니다.");
    if (q > selected.qty) return setErr(`현재 재고(${selected.qty}${selected.unit})보다 많은 수량은 출고할 수 없습니다.`);
    onSubmit({ sku: selected.sku, name: selected.name, location: selected.location, qty: q, date, memo });
    setToast(`${selected.name} ${q}${selected.unit} 출고 처리되었습니다.`);
    setQty("");
    setMemo("");
    setTimeout(() => setToast(""), 3500);
  }

  return (
    <div style={{ maxWidth: 560 }}>
      <PageHeader title="출고 등록" sub="현재 재고에서 수량을 차감하고 이력을 기록합니다" />
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="품목 선택">
          <select style={inputStyle} value={sku} onChange={(e) => setSku(e.target.value)}>
            {items.map((i) => (
              <option key={i.id} value={i.sku}>
                {i.sku} · {i.name} (현재 {i.qty}{i.unit})
              </option>
            ))}
          </select>
        </Field>

        {selected && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: T.bg, borderRadius: 6, padding: "10px 14px" }}>
            <LocationTag loc={selected.location} />
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 700 }}>
              현재 재고 {selected.qty.toLocaleString()} {selected.unit}
            </span>
          </div>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="출고 수량">
            <input style={inputStyle} type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="0" />
          </Field>
          <Field label="출고일">
            <input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
        </div>
        <Field label="메모 (선택)">
          <input style={inputStyle} value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 온라인몰 주문 출고" />
        </Field>

        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{err}</div>}

        <button
          onClick={submit}
          className="primary-btn"
          style={{ background: T.steel, color: "#fff", border: "none", borderRadius: 6, padding: "11px 16px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <ArrowUpFromLine size={15} /> 출고 처리
        </button>
        {toast && <Toast text={toast} color={T.clay} />}
      </div>
    </div>
  );
}

function Toast({ text, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#F4FBF8", border: `1px solid ${color}33`, color: T.tealDeep, borderRadius: 6, padding: "9px 12px", fontSize: 13, fontWeight: 600 }}>
      <Check size={15} /> {text}
    </div>
  );
}

function ModeToggle({ mode, setMode, labels, display, accent }) {
  return (
    <div style={{ display: "inline-flex", background: "#EAE7DC", borderRadius: 7, padding: 3, gap: 2 }}>
      {labels.map((l, idx) => (
        <button
          key={l}
          onClick={() => setMode(l)}
          style={{
            border: "none",
            borderRadius: 5,
            padding: "7px 16px",
            fontSize: 13,
            fontWeight: 600,
            cursor: "pointer",
            fontFamily: "inherit",
            background: mode === l ? T.surface : "transparent",
            color: mode === l ? T.ink : T.inkSoft,
            boxShadow: mode === l ? "0 1px 2px rgba(0,0,0,0.08)" : "none",
          }}
        >
          {display[idx]}
        </button>
      ))}
    </div>
  );
}

/* ---------- history ---------- */
function HistoryView({ tx }) {
  const [type, setType] = useState("전체");
  const [q, setQ] = useState("");

  const filtered = tx.filter((t) => {
    const matchType = type === "전체" || t.type === type;
    const matchQ = !q || t.name.includes(q) || t.sku.toLowerCase().includes(q.toLowerCase());
    return matchType && matchQ;
  });

  return (
    <div>
      <PageHeader title="입출고 이력" sub={`총 ${tx.length}건 중 ${filtered.length}건 표시`} />
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 260px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
          <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="품목명, SKU 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select style={{ ...inputStyle, width: 130 }} value={type} onChange={(e) => setType(e.target.value)}>
          <option>전체</option>
          <option value="IN">입고</option>
          <option value="OUT">출고</option>
        </select>
      </div>

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>구분</th>
              <th>SKU</th>
              <th>품목명</th>
              <th>수량</th>
              <th>로케이션</th>
              <th>일자</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr>
                <td colSpan={7}>
                  <EmptyRow text="이력이 없습니다." />
                </td>
              </tr>
            ) : (
              filtered.map((t) => (
                <tr key={t.id} className="rowhover">
                  <td>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <TxBadge type={t.type} />
                      <span style={{ fontSize: 12.5, fontWeight: 700, color: t.type === "IN" ? T.tealDeep : T.clayDeep }}>{t.type === "IN" ? "입고" : "출고"}</span>
                    </div>
                  </td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{t.sku}</td>
                  <td style={{ fontWeight: 600 }}>{t.name}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>
                    {t.type === "IN" ? "+" : "−"}{t.qty}
                  </td>
                  <td>
                    <LocationTag loc={t.location} />
                  </td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5 }}>{fmtDate(t.date)}</td>
                  <td style={{ color: T.inkSoft }}>{t.memo || "-"}</td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<WMSApp />);

</script>
</body>
</html>

function ProductInfoModal({ row, authToken, productInfo, onSaved, onClose }) {
  const key = row.name;
  const cur = (productInfo || {})[key] || {};
  const baseDc = dcGroupOfBase(key);
  const baseDk = getDangchakInfoBase(key);
  const baseCat = piCategoryOf(baseDc, baseDk).cat;
  const baseExpiry = baseDc ? null : PRODUCT_EXPIRY_DELTA[key] ?? 3;
  const effDc = dcGroupOf(key);
  const effDk = getDangchakInfo(key);
  const effCat = piCategoryOf(effDc, effDk).cat;
  const defaultGroup = (baseDk && baseDk.group) || (baseDc && baseDc.group.key) || row.supplier || "";

  const [f, setF] = useState(() => ({
    packQty: cur.packQty ?? "",
    expiryDays: cur.expiryDays ?? "",
    displayName: cur.displayName ?? "",
    cat: effCat,
    dcKey: effDc ? effDc.group.key : (baseDc && baseDc.group.key) || DC_VENDOR_GROUPS[0].key,
    dkScope: effDk && effDk.style === "full" ? "full" : "regions",
    dkRegions: effDk && effDk.style === "combined" ? effDk.regions || [effDk.region] : [],
    dkGroup: (effDk && effDk.group) || defaultGroup,
  }));
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));

  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  async function persist(entry) {
    // 다른 직원이 그사이 다른 상품을 저장했을 수 있으니, 저장 직전에 서버 최신 값을 받아 이 상품만 바꿔서 저장한다
    let latest = productInfo || {};
    try {
      const res = await apiFetch("/settings/product_info", authToken);
      if (res && res.value && typeof res.value === "object") latest = res.value;
    } catch (e) {
      /* 서버를 못 읽으면 화면 값 기준 */
    }
    const next = { ...latest };
    if (entry && Object.keys(entry).length) next[key] = entry;
    else delete next[key];
    setBusy(true);
    setMsg("");
    try {
      await apiFetch("/settings/product_info", authToken, { method: "PUT", body: { value: next } });
      onSaved(next);
      onClose();
    } catch (e) {
      try {
        localStorage.setItem("wms-product-info", JSON.stringify(next));
      } catch (e2) {
        /* 무시 */
      }
      onSaved(next);
      setMsg(`서버에 저장하지 못해 이 브라우저에만 임시 저장했어요 (${e.message})`);
    } finally {
      setBusy(false);
    }
  }

  function save() {
    const entry = {};
    const pq = String(f.packQty).trim();
    if (pq !== "") {
      if (!(Number(pq) > 0)) return setMsg("입수는 1 이상의 숫자로 넣어주세요.");
      if (Number(pq) !== row.basePack) entry.packQty = Number(pq);
    }
    const ex = String(f.expiryDays).trim();
    if (ex !== "") {
      if (!Number.isFinite(Number(ex))) return setMsg("소비기한은 숫자(일수)로 넣어주세요.");
      if (Number(ex) !== baseExpiry) entry.expiryDays = Number(ex);
    }
    const dn = String(f.displayName).trim();
    if (dn && dn !== key) entry.displayName = dn;
    // 명세서 구분: 기본과 같으면 저장하지 않음
    if (f.cat === "일반") {
      if (baseDc) entry.dc = "";
      if (baseDk) entry.dangchak = null;
    } else if (f.cat === "DC") {
      if (!baseDc || baseDc.group.key !== f.dcKey) entry.dc = f.dcKey;
      if (baseDk) entry.dangchak = null;
    } else {
      if (f.dkScope !== "full" && f.dkRegions.length === 0) return setMsg("당착으로 뺄 지역을 하나 이상 골라주세요.");
      const regions = REGION_ORDER_TABLE.map((r) => r.code).filter((c) => f.dkRegions.includes(c));
      const want = f.dkScope === "full" ? { style: "full" } : { style: "combined", regions, group: String(f.dkGroup).trim() || defaultGroup };
      const same =
        baseDk &&
        baseDk.style === want.style &&
        (want.style === "full" || (baseDk.group === want.group && [...(baseDk.regions || [])].sort().join() === [...want.regions].sort().join()));
      if (!same) entry.dangchak = want;
    }
    persist(entry);
  }
  function resetAll() {
    if (!window.confirm("이 상품을 바꾸기 전 기본값으로 되돌릴까요?")) return;
    persist(null);
  }

  const label = { fontSize: 13, fontWeight: 700, marginBottom: 6 };
  const baseTxt = { fontSize: 12, color: T.inkSoft, marginTop: 5 };
  const resetLink = (k, v = "") => (
    <button onClick={() => set(k, v)} style={{ border: "none", background: "none", color: T.teal, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0, marginLeft: 8 }}>
      기본값으로
    </button>
  );
  const seg = (active) => ({
    flex: 1,
    padding: "10px 0",
    borderRadius: 8,
    border: `1.5px solid ${active ? T.steel : T.border}`,
    background: active ? T.steel : T.surface,
    color: active ? "#fff" : T.ink,
    fontWeight: 700,
    fontSize: 13.5,
    cursor: "pointer",
    fontFamily: "inherit",
  });
  const chip = (active) => ({
    padding: "6px 12px",
    borderRadius: 999,
    border: `1.5px solid ${active ? T.teal : T.border}`,
    background: active ? "#E4F2EE" : T.surface,
    color: active ? T.tealDeep : T.ink,
    fontWeight: 600,
    fontSize: 12.5,
    cursor: "pointer",
    fontFamily: "inherit",
  });
  const packNow = String(f.packQty).trim() !== "" ? Number(f.packQty) : row.basePack;
  const catHelp = {
    일반: `평소 피킹지시서와 ${row.part}편 거래명세서로 나가요.`,
    DC: "DC 거래명세서 카드에서 선택한 DC 공급사로 나가요.",
    당착: f.dkScope === "full" ? "모든 지역이 당착으로, 당착 피킹 시트와 당착 거래명세서로만 나가요." : "고른 지역 몫만 당착(오전현장)으로 빠지고, 나머지 지역은 평소대로 나가요.",
  }[f.cat];

  return createPortal(
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(27,29,26,0.45)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16, fontFamily: "'IBM Plex Sans KR', sans-serif", color: T.ink }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: T.surface, borderRadius: 14, width: "100%", maxWidth: 560, maxHeight: "92vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 18px 50px rgba(0,0,0,0.18)" }}>
        <div style={{ display: "flex", alignItems: "flex-start", padding: "18px 22px", borderBottom: `1px solid ${T.border}` }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12, color: T.inkSoft, fontWeight: 600 }}>{row.supplier}</div>
            <div style={{ fontSize: 16.5, fontWeight: 700, marginTop: 2, wordBreak: "break-all" }}>{key}</div>
            <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 4 }}>
              {row.sku ? `상품코드 ${row.sku}` : ""}
              {row.lastDate ? ` · 최근 발주 ${fmtDate(row.lastDate)}` : ""}
            </div>
          </div>
          <button onClick={onClose} title="닫기" style={{ marginLeft: "auto", border: "none", background: "transparent", cursor: "pointer", color: T.inkSoft }}>
            <X size={18} />
          </button>
        </div>

        <div style={{ overflowY: "auto", padding: "18px 22px", display: "flex", flexDirection: "column", gap: 20 }}>
          <div style={{ display: "flex", gap: 14 }}>
            <div style={{ flex: 1 }}>
              <div style={label}>
                입수
                {String(f.packQty) !== "" && resetLink("packQty")}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input style={{ ...inputStyle, width: "100%", fontSize: 18, fontWeight: 700, textAlign: "center" }} type="number" min="1" value={f.packQty} placeholder={String(row.basePack || "")} onChange={(e) => set("packQty", e.target.value)} />
                <span style={{ fontSize: 13, color: T.inkSoft }}>개</span>
              </div>
              <div style={baseTxt}>기본 {row.basePack ? `${row.basePack}개` : "없음"} (발주파일)</div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={label}>
                소비기한
                {String(f.expiryDays) !== "" && resetLink("expiryDays")}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 15, fontWeight: 700, color: T.inkSoft }}>+</span>
                <input style={{ ...inputStyle, width: "100%", fontSize: 18, fontWeight: 700, textAlign: "center" }} type="number" value={f.expiryDays} placeholder={baseExpiry == null ? "공란" : String(baseExpiry)} onChange={(e) => set("expiryDays", e.target.value)} />
                <span style={{ fontSize: 13, color: T.inkSoft }}>일</span>
              </div>
              <div style={baseTxt}>기본 {baseExpiry == null ? "공란 (DC)" : `+${baseExpiry}일`} · 명세서 비고 날짜</div>
            </div>
          </div>

          <div>
            <div style={label}>
              피킹지·명세서에 찍히는 상품명
              {String(f.displayName) !== "" && resetLink("displayName")}
            </div>
            <input style={{ ...inputStyle, width: "100%" }} value={f.displayName} placeholder={key} onChange={(e) => set("displayName", e.target.value)} />
            <div style={baseTxt}>비워두면 발주파일 이름 그대로 나가요</div>
          </div>

          <div>
            <div style={label}>
              명세서 구분
              {f.cat !== baseCat && resetLink("cat", baseCat)}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {["일반", "DC", "당착"].map((c) => (
                <button key={c} onClick={() => set("cat", c)} style={seg(f.cat === c)}>
                  {c}
                </button>
              ))}
            </div>
            {f.cat === "DC" && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                {DC_VENDOR_GROUPS.map((g) => (
                  <button key={g.key} onClick={() => set("dcKey", g.key)} style={chip(f.dcKey === g.key)}>
                    {g.label}
                  </button>
                ))}
              </div>
            )}
            {f.cat === "당착" && (
              <div style={{ marginTop: 10 }}>
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => set("dkScope", "regions")} style={chip(f.dkScope === "regions")}>
                    지역 골라서 빼기
                  </button>
                  <button onClick={() => set("dkScope", "full")} style={chip(f.dkScope === "full")}>
                    전 지역 당착
                  </button>
                </div>
                {f.dkScope === "regions" && (
                  <div style={{ marginTop: 10, border: `1px solid ${T.border}`, borderRadius: 10, padding: 12 }}>
                    <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>
                      당착으로 뺄 지역을 누르세요 ({f.dkRegions.length}곳 선택). 고른 지역은 평소 피킹지·명세서에서 빠지고 당착 피킹지·당착 명세서로 나가요.
                    </div>
                    {["A", "B"].map((zone) => (
                      <div key={zone} style={{ marginBottom: zone === "A" ? 10 : 0 }}>
                        <div style={{ fontSize: 11.5, fontWeight: 700, color: T.inkSoft, marginBottom: 5 }}>{zone}구역</div>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                          {REGION_ORDER_TABLE.filter((r) => r.zone === zone).map((r) => {
                            const on = f.dkRegions.includes(r.code);
                            return (
                              <button
                                key={r.code}
                                onClick={() => set("dkRegions", on ? f.dkRegions.filter((c) => c !== r.code) : [...f.dkRegions, r.code])}
                                style={{ ...chip(on), padding: "5px 10px", fontSize: 12, ...(on ? { borderColor: T.clay, background: "#FBE9DF", color: T.clayDeep } : {}) }}
                              >
                                {r.name}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                    {f.dkRegions.length > 0 && (
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12 }}>
                        <span style={{ fontSize: 12.5, color: T.inkSoft, whiteSpace: "nowrap" }}>당착 시트 이름</span>
                        <input style={{ ...inputStyle, flex: 1 }} value={f.dkGroup} onChange={(e) => set("dkGroup", e.target.value)} />
                        <span style={{ fontSize: 12, color: T.inkSoft, whiteSpace: "nowrap" }}>(오전현장{f.dkRegions.length === 1 ? `-${regionNamesOf(f.dkRegions)}` : ""})</span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
            <div style={baseTxt}>
              기본: <b>{baseCat}</b>
              {baseCat === "DC" ? ` · ${baseDc.group.label}` : baseCat === "당착" ? ` · ${piCategoryOf(baseDc, baseDk).detail}` : ""} — {catHelp}
            </div>
          </div>

          <div style={{ background: T.bg, borderRadius: 10, padding: "12px 14px", fontSize: 12.5, color: T.inkSoft, lineHeight: 1.6 }}>
            저장하면 <b style={{ color: T.ink }}>입수 {packNow || "-"}개</b> 기준으로 피킹지 박스/낱개·체크포인트가 다시 계산되고, 거래명세서에도 바로 반영돼요. 이미 올린 날짜도 다시 올릴 필요 없어요.
          </div>
          {msg && <div style={{ fontSize: 12.5, fontWeight: 600, color: T.danger }}>{msg}</div>}
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "14px 22px", borderTop: `1px solid ${T.border}`, background: "#FBFAF7" }}>
          {row.changed && (
            <button onClick={resetAll} disabled={busy} style={{ ...smallBtnStyle, color: T.danger, borderColor: T.danger + "55" }}>
              전부 기본값으로
            </button>
          )}
          <button onClick={onClose} disabled={busy} style={{ ...smallBtnStyle, marginLeft: "auto" }}>
            취소
          </button>
          <button onClick={save} disabled={busy} className="primary-btn" style={{ ...primaryBtnStyle, opacity: busy ? 0.6 : 1 }}>
            <Check size={14} /> {busy ? "저장 중..." : "저장"}
          </button>
        </div>
      </div>
    </div>,
    document.body
  );
}

function ProductMaster({ items, onSave, onCreate, onDelete }) {
  const [selectedSku, setSelectedSku] = useState(items[0]?.sku || null);
  const [query, setQuery] = useState("");
  const [form, setForm] = useState(null);
  const [mode, setMode] = useState("edit"); // "edit" | "create"
  const [createForm, setCreateForm] = useState({ sku: "", name: "", category: "", tempZone: TEMP_ZONES[0], workType: WORK_TYPES[0], location: "", unit: "EA", unitQty: 1, boxQty: 1, cbm: 0, qty: 0, safety: 0 });
  const [createErr, setCreateErr] = useState("");

  const selected = items.find((i) => i.sku === selectedSku) || null;
  const filtered = items.filter((i) => !query || i.name.includes(query) || i.sku.toLowerCase().includes(query.toLowerCase()));

  function openEdit(item) {
    setMode("edit");
    setSelectedSku(item.sku);
    setForm({ newSku: item.sku, tempZone: item.tempZone, workType: item.workType, location: item.location, unitQty: item.unitQty, boxQty: item.boxQty, cbm: item.cbm, qty: item.qty });
  }
  function save() {
    if (!selected || !form) return;
    const code = String(form.newSku ?? selected.sku).trim();
    if (!code) return window.alert("상품코드는 비워둘 수 없어요.");
    if (code !== selected.sku && items.some((i) => i.sku === code)) return window.alert("이미 다른 품목이 사용 중인 상품코드예요.");
    if (code !== selected.sku && !window.confirm(`상품코드를 ${selected.sku} → ${code} 로 바꿀까요?\n(이 코드로 들어온 기존 발주·입출고 이력도 같이 바뀝니다)`)) return;
    onSave(selected.sku, form);
    if (code !== selected.sku) setSelectedSku(code);
  }
  function submitCreate() {
    setCreateErr("");
    if (!createForm.sku.trim() || !createForm.name.trim()) return setCreateErr("상품코드와 품목명은 필수입니다.");
    if (items.some((i) => i.sku === createForm.sku.trim())) return setCreateErr("이미 존재하는 상품코드입니다.");
    onCreate({ ...createForm, sku: createForm.sku.trim(), location: createForm.location.trim() || "미배정" });
    setCreateForm({ sku: "", name: "", category: "", tempZone: TEMP_ZONES[0], workType: WORK_TYPES[0], location: "", unit: "EA", unitQty: 1, boxQty: 1, cbm: 0, qty: 0, safety: 0 });
  }

  return (
    <div>
      <PageHeader title="X. 상품마스터" sub="품목별 온도구역·작업유형·로케이션·단위정보를 관리합니다" />
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ flex: "2 1 420px" }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <div style={{ position: "relative", flex: 1 }}>
              <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
              <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="품목명 또는 상품코드 검색" value={query} onChange={(e) => setQuery(e.target.value)} />
            </div>
            <button onClick={() => setMode("create")} className="primary-btn" style={primaryBtnStyle}>
              <Plus size={14} /> 새 품목 추가
            </button>
          </div>
          <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
            <table>
              <thead>
                <tr>
                  <th>상품코드</th>
                  <th>품목명</th>
                  <th>온도구역</th>
                  <th>작업유형</th>
                  <th>로케이션</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr>
                    <td colSpan={6}>
                      <EmptyRow text="등록된 품목이 없습니다." />
                    </td>
                  </tr>
                ) : (
                  filtered.map((i) => (
                    <tr key={i.id} className="rowhover">
                      <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{i.sku}</td>
                      <td style={{ fontWeight: 600 }}>{i.name}</td>
                      <td>{i.tempZone}</td>
                      <td>{i.workType}</td>
                      <td>
                        <LocationTag loc={i.location} />
                      </td>
                      <td>
                        <div style={{ display: "flex", gap: 6 }}>
                          <button onClick={() => openEdit(i)} className="ghost-btn" style={{ ...smallBtnStyle, padding: "6px 10px" }}>
                            <Pencil size={13} /> 수정
                          </button>
                          <button
                            onClick={() => {
                              if (window.confirm(`"${i.name}" 품목을 삭제할까요? 되돌릴 수 없습니다.`)) onDelete(i.sku);
                            }}
                            className="ghost-btn"
                            style={{ ...smallBtnStyle, padding: "6px 10px", color: T.danger, borderColor: T.danger + "55" }}
                          >
                            <Trash2 size={13} /> 삭제
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
        <div style={{ flex: "1 1 280px" }}>
          <div style={cardStyle}>
            {mode === "create" ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>새 품목 추가</div>
                <Field label="상품코드 (발주파일의 상품코드)">
                  <input style={inputStyle} value={createForm.sku} onChange={(e) => setCreateForm({ ...createForm, sku: e.target.value })} placeholder="예: 2700038849500" />
                </Field>
                <Field label="품목명">
                  <input style={inputStyle} value={createForm.name} onChange={(e) => setCreateForm({ ...createForm, name: e.target.value })} placeholder="품목명을 입력하세요" />
                </Field>
                <Field label="카테고리">
                  <input style={inputStyle} value={createForm.category} onChange={(e) => setCreateForm({ ...createForm, category: e.target.value })} placeholder="예: 베이커리" />
                </Field>
                <Field label="온도구역">
                  <select style={inputStyle} value={createForm.tempZone} onChange={(e) => setCreateForm({ ...createForm, tempZone: e.target.value })}>
                    {TEMP_ZONES.map((z) => (
                      <option key={z}>{z}</option>
                    ))}
                  </select>
                </Field>
                <Field label="작업유형">
                  <select style={inputStyle} value={createForm.workType} onChange={(e) => setCreateForm({ ...createForm, workType: e.target.value })}>
                    {WORK_TYPES.map((w) => (
                      <option key={w}>{w}</option>
                    ))}
                  </select>
                </Field>
                <Field label="피킹 로케이션 (모르면 비워두면 '미배정')">
                  <input style={inputStyle} value={createForm.location} onChange={(e) => setCreateForm({ ...createForm, location: e.target.value })} placeholder="예: A-01-03" />
                </Field>
                <div className="field-row" style={{ display: "flex", gap: 10 }}>
                  <Field label="낱개단위">
                    <input style={inputStyle} type="number" value={createForm.unitQty} onChange={(e) => setCreateForm({ ...createForm, unitQty: Number(e.target.value) })} />
                  </Field>
                  <Field label="박스단위(입수)">
                    <input style={inputStyle} type="number" value={createForm.boxQty} onChange={(e) => setCreateForm({ ...createForm, boxQty: Number(e.target.value) })} />
                  </Field>
                </div>
                <div className="field-row" style={{ display: "flex", gap: 10 }}>
                  <Field label="초기 재고">
                    <input style={inputStyle} type="number" value={createForm.qty} onChange={(e) => setCreateForm({ ...createForm, qty: Number(e.target.value) })} />
                  </Field>
                  <Field label="안전재고">
                    <input style={inputStyle} type="number" value={createForm.safety} onChange={(e) => setCreateForm({ ...createForm, safety: Number(e.target.value) })} />
                  </Field>
                </div>
                {createErr && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{createErr}</div>}
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={submitCreate} className="primary-btn" style={primaryBtnStyle}>
                    <Check size={14} /> 등록
                  </button>
                  <button onClick={() => setMode("edit")} className="ghost-btn" style={smallBtnStyle}>
                    취소
                  </button>
                </div>
              </div>
            ) : !selected || !form ? (
              <div style={{ fontSize: 13, color: T.inkSoft }}>목록에서 "수정"을 눌러 품목 정보를 편집하거나, 위 "새 품목 추가" 버튼을 눌러 미리 등록하세요.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{selected.name}</div>
                <Field label="상품코드 (발주파일의 상품코드와 같아야 해요)">
                  <input style={{ ...inputStyle, fontFamily: "'JetBrains Mono', monospace" }} value={form.newSku ?? selected.sku} onChange={(e) => setForm({ ...form, newSku: e.target.value })} />
                </Field>
                <Field label="온도구역">
                  <select style={inputStyle} value={form.tempZone} onChange={(e) => setForm({ ...form, tempZone: e.target.value })}>
                    {TEMP_ZONES.map((z) => (
                      <option key={z}>{z}</option>
                    ))}
                  </select>
                </Field>
                <Field label="작업유형">
                  <select style={inputStyle} value={form.workType} onChange={(e) => setForm({ ...form, workType: e.target.value })}>
                    {WORK_TYPES.map((w) => (
                      <option key={w}>{w}</option>
                    ))}
                  </select>
                </Field>
                <Field label="피킹 로케이션">
                  <input style={inputStyle} value={form.location} onChange={(e) => setForm({ ...form, location: e.target.value })} />
                </Field>
                <Field label="재고수량 (직접 수정 — 보통은 입고등록을 이용하세요)">
                  <input style={inputStyle} type="number" value={form.qty} onChange={(e) => setForm({ ...form, qty: Number(e.target.value) })} />
                </Field>
                <div className="field-row" style={{ display: "flex", gap: 10 }}>
                  <Field label="낱개단위">
                    <input style={inputStyle} type="number" value={form.unitQty} onChange={(e) => setForm({ ...form, unitQty: Number(e.target.value) })} />
                  </Field>
                  <Field label="박스단위">
                    <input style={inputStyle} type="number" value={form.boxQty} onChange={(e) => setForm({ ...form, boxQty: Number(e.target.value) })} />
                  </Field>
                </div>
                <Field label="CBM">
                  <input style={inputStyle} type="number" step="0.001" value={form.cbm} onChange={(e) => setForm({ ...form, cbm: Number(e.target.value) })} />
                </Field>
                <button onClick={save} className="primary-btn" style={{ ...primaryBtnStyle, alignSelf: "flex-start" }}>
                  <Check size={14} /> 저장
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================= XI. 창고CELL ================= */
function WarehouseCell({ cells, onAdd, onDelete }) {
  const [area, setArea] = useState("");
  const [startFloor, setStartFloor] = useState(1);
  const [endFloor, setEndFloor] = useState(4);
  const [cellCount, setCellCount] = useState(10);
  const [pickZoneDefault, setPickZoneDefault] = useState(true);
  const [err, setErr] = useState("");

  function submit() {
    setErr("");
    if (!area.trim()) return setErr("AREA 코드를 입력해주세요.");
    if (endFloor < startFloor) return setErr("끝 계층은 시작 계층보다 크거나 같아야 합니다.");
    onAdd({ area: area.trim().toUpperCase(), startFloor: Number(startFloor), endFloor: Number(endFloor), cellCount: Number(cellCount), pickZoneDefault });
    setArea("");
  }

  return (
    <div>
      <PageHeader title="XI. 창고CELL" sub="AREA·계층·셀 구조로 랙 로케이션 범위를 설정합니다 (예: AA-01-01 ~ AA-10-04)" />
      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div className="field-row" style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <Field label="AREA">
            <input style={{ ...inputStyle, width: 100 }} value={area} onChange={(e) => setArea(e.target.value)} placeholder="AA" />
          </Field>
          <Field label="시작 계층">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={startFloor} onChange={(e) => setStartFloor(e.target.value)} />
          </Field>
          <Field label="끝 계층">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={endFloor} onChange={(e) => setEndFloor(e.target.value)} />
          </Field>
          <Field label="셀 (개수)">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={cellCount} onChange={(e) => setCellCount(e.target.value)} />
          </Field>
          <Field label="피킹존 기본값">
            <label style={{ display: "flex", alignItems: "center", gap: 6, height: 38, fontSize: 13 }}>
              <input type="checkbox" checked={pickZoneDefault} onChange={(e) => setPickZoneDefault(e.target.checked)} /> 01번 셀 피킹존
            </label>
          </Field>
        </div>
        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600, marginTop: 10 }}>{err}</div>}
        <button onClick={submit} className="primary-btn" style={{ ...primaryBtnStyle, marginTop: 12 }}>
          <Plus size={14} /> CELL 생성
        </button>
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>AREA</th>
              <th>계층 범위</th>
              <th>셀 개수</th>
              <th>예상 로케이션 수</th>
              <th>피킹존 기본</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {cells.length === 0 ? (
              <tr>
                <td colSpan={6}>
                  <EmptyRow text="등록된 CELL 구조가 없습니다." />
                </td>
              </tr>
            ) : (
              cells.map((c) => (
                <tr key={c.id}>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{c.area}</td>
                  <td>
                    {c.area}-01-{String(c.startFloor).padStart(2, "0")} ~ {c.area}-{String(c.cellCount).padStart(2, "0")}-{String(c.endFloor).padStart(2, "0")}
                  </td>
                  <td>{c.cellCount}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{(c.endFloor - c.startFloor + 1) * c.cellCount}</td>
                  <td>{c.pickZoneDefault ? "01번 셀" : "-"}</td>
                  <td>
                    <button onClick={() => onDelete(c.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.danger }}>
                      <Trash2 size={15} />
                    </button>
                  </td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= XII. 배송코스차수 ================= */
function DeliveryCourse({ courses, vehicles, onAdd, onDelete }) {
  const [name, setName] = useState(COURSE_NAMES[0]);
  const [vehicleId, setVehicleId] = useState(vehicles[0]?.id || "");
  const [round, setRound] = useState(1);

  function submit() {
    if (!vehicleId) return;
    onAdd({ name, vehicleId, round: Number(round) });
  }
  const vehicleName = (id) => vehicles.find((v) => v.id === id)?.name || "-";

  return (
    <div>
      <PageHeader title="XII. 배송코스차수" sub="배송코스(A/B/S)에 차량과 차수를 매핑합니다" />
      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div className="field-row" style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <Field label="코스">
            <select style={{ ...inputStyle, width: 100 }} value={name} onChange={(e) => setName(e.target.value)}>
              {COURSE_NAMES.map((c) => (
                <option key={c}>{c}</option>
              ))}
            </select>
          </Field>
          <Field label="차량">
            <select style={{ ...inputStyle, width: 220 }} value={vehicleId} onChange={(e) => setVehicleId(e.target.value)}>
              {vehicles.map((v) => (
                <option key={v.id} value={v.id}>
                  {v.name}
                </option>
              ))}
            </select>
          </Field>
          <Field label="차수">
            <input style={{ ...inputStyle, width: 90 }} type="number" value={round} onChange={(e) => setRound(e.target.value)} />
          </Field>
        </div>
        <button onClick={submit} className="primary-btn" style={{ ...primaryBtnStyle, marginTop: 12 }}>
          <Plus size={14} /> 차량차수 맵핑 추가
        </button>
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>코스</th>
              <th>차량</th>
              <th>차수</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {courses.length === 0 ? (
              <tr>
                <td colSpan={4}>
                  <EmptyRow text="등록된 배송코스가 없습니다." />
                </td>
              </tr>
            ) : (
              courses.map((c) => (
                <tr key={c.id}>
                  <td style={{ fontWeight: 700 }}>{c.name}</td>
                  <td>{vehicleName(c.vehicleId)}</td>
                  <td>{c.round}차</td>
                  <td>
                    <button onClick={() => onDelete(c.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.danger }}>
                      <Trash2 size={15} />
                    </button>
                  </td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- inbound ---------- */
function Inbound({ items, onSubmit }) {
  const [mode, setMode] = useState("existing");
  const [sku, setSku] = useState(items[0]?.sku || "");
  const [qty, setQty] = useState("");
  const [location, setLocation] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayStr());
  const [newItem, setNewItem] = useState({ sku: "", name: "", category: CATEGORIES[0], location: "", unit: "개", safety: "" });
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");

  const selected = items.find((i) => i.sku === sku);

  useEffect(() => {
    if (mode === "existing" && selected) setLocation(selected.location);
  }, [sku, mode]); // eslint-disable-line

  function submit() {
    setErr("");
    const q = Number(qty);
    if (!q || q <= 0) return setErr("수량은 1 이상의 숫자여야 합니다.");
    if (mode === "existing") {
      if (!selected) return setErr("품목을 선택해주세요.");
      onSubmit({ sku: selected.sku, name: selected.name, category: selected.category, location: location || selected.location, unit: selected.unit, qty: q, date, memo });
      setToast(`${selected.name} ${q}${selected.unit} 입고 처리되었습니다.`);
    } else {
      if (!newItem.sku || !newItem.name || !newItem.location) return setErr("상품코드, 품목명, 로케이션을 모두 입력해주세요.");
      if (items.some((i) => i.sku === newItem.sku)) return setErr("이미 존재하는 상품코드입니다.");
      onSubmit({ ...newItem, safety: Number(newItem.safety) || 10, qty: q, date, memo });
      setToast(`${newItem.name} 신규 등록 및 입고 처리되었습니다.`);
      setNewItem({ sku: "", name: "", category: CATEGORIES[0], location: "", unit: "개", safety: "" });
    }
    setQty("");
    setMemo("");
    setTimeout(() => setToast(""), 3500);
  }

  return (
    <div style={{ maxWidth: 560 }}>
      <PageHeader title="입고 등록" sub="기존 품목에 재고를 추가하거나 신규 품목을 등록합니다" />
      <ModeToggle mode={mode} setMode={setMode} labels={["existing", "new"]} display={["기존 품목", "신규 품목"]} accent={T.teal} />

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", gap: 14, marginTop: 14 }}>
        {mode === "existing" ? (
          <Field label="품목 선택">
            <select style={inputStyle} value={sku} onChange={(e) => setSku(e.target.value)}>
              {items.map((i) => (
                <option key={i.id} value={i.sku}>
                  {i.sku} · {i.name} (현재 {i.qty}{i.unit})
                </option>
              ))}
            </select>
          </Field>
        ) : (
          <>
            <div style={{ display: "flex", gap: 12 }}>
              <Field label="상품코드">
                <input style={inputStyle} value={newItem.sku} onChange={(e) => setNewItem({ ...newItem, sku: e.target.value })} placeholder="예: 2700038849500" />
              </Field>
              <Field label="카테고리">
                <select style={inputStyle} value={newItem.category} onChange={(e) => setNewItem({ ...newItem, category: e.target.value })}>
                  {CATEGORIES.map((c) => (
                    <option key={c}>{c}</option>
                  ))}
                </select>
              </Field>
            </div>
            <Field label="품목명">
              <input style={inputStyle} value={newItem.name} onChange={(e) => setNewItem({ ...newItem, name: e.target.value })} placeholder="품목명을 입력하세요" />
            </Field>
            <div style={{ display: "flex", gap: 12 }}>
              <Field label="단위">
                <input style={inputStyle} value={newItem.unit} onChange={(e) => setNewItem({ ...newItem, unit: e.target.value })} placeholder="개 / 박스 / 세트" />
              </Field>
              <Field label="안전재고">
                <input style={inputStyle} type="number" value={newItem.safety} onChange={(e) => setNewItem({ ...newItem, safety: e.target.value })} placeholder="10" />
              </Field>
            </div>
            <Field label="로케이션">
              <input style={inputStyle} value={newItem.location} onChange={(e) => setNewItem({ ...newItem, location: e.target.value })} placeholder="예: A-01-03" />
            </Field>
          </>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="입고 수량">
            <input style={inputStyle} type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="0" />
          </Field>
          <Field label="입고일">
            <input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
        </div>
        {mode === "existing" && (
          <Field label="로케이션 (변경 시에만 수정)">
            <input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} />
          </Field>
        )}
        <Field label="메모 (선택)">
          <input style={inputStyle} value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 정기 발주 입고" />
        </Field>

        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{err}</div>}

        <button
          onClick={submit}
          className="primary-btn"
          style={{ background: T.steel, color: "#fff", border: "none", borderRadius: 6, padding: "11px 16px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <ArrowDownToLine size={15} /> 입고 처리
        </button>
        {toast && <Toast text={toast} color={T.teal} />}
      </div>
    </div>
  );
}

/* ---------- outbound ---------- */
function Outbound({ items, onSubmit }) {
  const [sku, setSku] = useState(items[0]?.sku || "");
  const [qty, setQty] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayStr());
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");
  const selected = items.find((i) => i.sku === sku);

  function submit() {
    setErr("");
    const q = Number(qty);
    if (!selected) return setErr("품목을 선택해주세요.");
    if (!q || q <= 0) return setErr("수량은 1 이상의 숫자여야 합니다.");
    if (q > selected.qty) return setErr(`현재 재고(${selected.qty}${selected.unit})보다 많은 수량은 출고할 수 없습니다.`);
    onSubmit({ sku: selected.sku, name: selected.name, location: selected.location, qty: q, date, memo });
    setToast(`${selected.name} ${q}${selected.unit} 출고 처리되었습니다.`);
    setQty("");
    setMemo("");
    setTimeout(() => setToast(""), 3500);
  }

  return (
    <div style={{ maxWidth: 560 }}>
      <PageHeader title="출고 등록" sub="현재 재고에서 수량을 차감하고 이력을 기록합니다" />
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="품목 선택">
          <select style={inputStyle} value={sku} onChange={(e) => setSku(e.target.value)}>
            {items.map((i) => (
              <option key={i.id} value={i.sku}>
                {i.sku} · {i.name} (현재 {i.qty}{i.unit})
              </option>
            ))}
          </select>
        </Field>

        {selected && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: T.bg, borderRadius: 6, padding: "10px 14px" }}>
            <LocationTag loc={selected.location} />
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 700 }}>
              현재 재고 {selected.qty.toLocaleString()} {selected.unit}
            </span>
          </div>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Field label="출고 수량">
            <input style={inputStyle} type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="0" />
          </Field>
          <Field label="출고일">
            <input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
        </div>
        <Field label="메모 (선택)">
          <input style={inputStyle} value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 온라인몰 주문 출고" />
        </Field>

        {err && <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{err}</div>}

        <button
          onClick={submit}
          className="primary-btn"
          style={{ background: T.steel, color: "#fff", border: "none", borderRadius: 6, padding: "11px 16px", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <ArrowUpFromLine size={15} /> 출고 처리
        </button>
        {toast && <Toast text={toast} color={T.clay} />}
      </div>
    </div>
  );
}

function Toast({ text, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#F4FBF8", border: `1px solid ${color}33`, color: T.tealDeep, borderRadius: 6, padding: "9px 12px", fontSize: 13, fontWeight: 600 }}>
      <Check size={15} /> {text}
    </div>
  );
}

function ModeToggle({ mode, setMode, labels, display, accent }) {
  return (
    <div style={{ display: "inline-flex", background: "#EAE7DC", borderRadius: 7, padding: 3, gap: 2 }}>
      {labels.map((l, idx) => (
        <button
          key={l}
          onClick={() => setMode(l)}
          style={{
            border: "none",
            borderRadius: 5,
            padding: "7px 16px",
            fontSize: 13,
            fontWeight: 600,
            cursor: "pointer",
            fontFamily: "inherit",
            background: mode === l ? T.surface : "transparent",
            color: mode === l ? T.ink : T.inkSoft,
            boxShadow: mode === l ? "0 1px 2px rgba(0,0,0,0.08)" : "none",
          }}
        >
          {display[idx]}
        </button>
      ))}
    </div>
  );
}

/* ---------- history ---------- */
function HistoryView({ tx }) {
  const [type, setType] = useState("전체");
  const [q, setQ] = useState("");

  const filtered = tx.filter((t) => {
    const matchType = type === "전체" || t.type === type;
    const matchQ = !q || t.name.includes(q) || t.sku.toLowerCase().includes(q.toLowerCase());
    return matchType && matchQ;
  });

  return (
    <div>
      <PageHeader title="입출고 이력" sub={`총 ${tx.length}건 중 ${filtered.length}건 표시`} />
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 260px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
          <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="품목명, 상품코드 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select style={{ ...inputStyle, width: 130 }} value={type} onChange={(e) => setType(e.target.value)}>
          <option>전체</option>
          <option value="IN">입고</option>
          <option value="OUT">출고</option>
        </select>
      </div>

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>구분</th>
              <th>상품코드</th>
              <th>품목명</th>
              <th>수량</th>
              <th>로케이션</th>
              <th>일자</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr>
                <td colSpan={7}>
                  <EmptyRow text="이력이 없습니다." />
                </td>
              </tr>
            ) : (
              filtered.map((t) => (
                <tr key={t.id} className="rowhover">
                  <td>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <TxBadge type={t.type} />
                      <span style={{ fontSize: 12.5, fontWeight: 700, color: t.type === "IN" ? T.tealDeep : T.clayDeep }}>{t.type === "IN" ? "입고" : "출고"}</span>
                    </div>
                  </td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{t.sku}</td>
                  <td style={{ fontWeight: 600 }}>{t.name}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>
                    {t.type === "IN" ? "+" : "−"}{t.qty}
                  </td>
                  <td>
                    <LocationTag loc={t.location} />
                  </td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5 }}>{fmtDate(t.date)}</td>
                  <td style={{ color: T.inkSoft }}>{t.memo || "-"}</td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

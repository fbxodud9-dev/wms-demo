// 품목별 검수표 1개 품목을 원본 피킹지시서와 동일한 레이아웃의 시트 데이터(AOA)로 변환
function safeSheetName(name, used) {
  let base = String(name || "품목").replace(/[\\/?*[\]:]/g, "").slice(0, 28) || "품목";
  let candidate = base;
  let i = 2;
  while (used.has(candidate)) {
    candidate = `${base.slice(0, 25)}(${i})`;
    i++;
  }
  used.add(candidate);
  return candidate;
}

const XLFONT = "맑은 고딕";
const XL_THIN = { style: "thin", color: { argb: "FF000000" } };
const XL_MEDIUM = { style: "medium", color: { argb: "FF000000" } };
const XL_GRAY_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFD9D9D9" } };

// 실제 피킹지시서 디자인(테두리·음영·폰트 크기)을 그대로 적용해 1개 품목 시트를 만듦
function addStyledInspectionSheet(workbook, product, usedNames, date, skipZero) {
  const pack = product.packQty || 0;
  const bd = (q) => (pack > 0 ? { box: Math.floor(q / pack), rem: q % pack } : { box: 0, rem: q });
  // skipZero: 당착(현장출고) 상품용 - 37개 지역 전부가 아니라 그날 실제 주문 있는 지역만 보여줌(구역 합계는 유지)
  const regionRowsUsed = skipZero ? product.regionRows.filter((r) => r.qty > 0) : product.regionRows;
  const ws = workbook.addWorksheet(safeSheetName(product.displayName || product.name, usedNames));
  // 열 너비는 실물 피킹지 그대로 (G·H는 "소분박스/소분낱개"가 들어가서 17)
  ws.columns = [{ width: 33.88 }, { width: 7.62 }, { width: 30.62 }, { width: 12 }, { width: 11.38 }, { width: 13 }, { width: 17 }, { width: 17 }];

  // 인쇄 설정(실물 피킹지와 동일): A4 세로, 1페이지에 꽉 차게 맞춤, 여백 최소, 가로·세로 가운데, 1행(빈 줄)은 인쇄 제외
  ws.pageSetup = {
    paperSize: 9,
    orientation: "portrait",
    fitToPage: true,
    fitToWidth: 1,
    fitToHeight: 1,
    horizontalCentered: true,
    verticalCentered: true,
    margins: { left: 0.24, right: 0.197, top: 0.197, bottom: 0.197, header: 0.197, footer: 0.197 },
  };

  // skipZero(당착)일 땐 "영남/호남/수도권" 실제 권역으로, 평소엔 기존 A/B구역으로 묶는다
  const zoneList = skipZero ? ["영남", "호남", "수도권"] : ["A", "B", "미지정"];
  const zoneOf = (r) => (skipZero ? realZoneOf(r.key) : r.zone);
  const zoneLabel = (zone) => (skipZero ? `${zone} 합계` : zone === "미지정" ? "미지정 지역 합계" : `${zone}구역 합계`);
  // 전체 지역을 화주사 고정 순서로 한 줄로 나열 (체크포인트 계산이 구역 경계를 넘어 전체를 봄)
  const flat = [];
  zoneList.forEach((zone) => {
    regionRowsUsed.filter((r) => zoneOf(r) === zone).forEach((r) => flat.push({ ...r, zone }));
  });
  // 체크포인트: 이 지역 "다음"부터 전체 끝까지 남은 낱개(소분) 합계를 박스로 환산 (엑셀 수식의 초기 캐시값 계산용)
  const remAfter = new Array(flat.length + 1).fill(0);
  for (let i = flat.length - 1; i >= 0; i--) remAfter[i] = remAfter[i + 1] + bd(flat[i].qty).rem;

  // 1행: 장식용 빈 줄 (위쪽 굵은 테두리)
  ws.addRow([]);
  ws.getRow(1).height = 25.9;

  // 2행: 날짜 | 공급자명(병합) | 박스 | 낱개
  const r2 = ws.addRow([date || todayStr(), product.supplier || "", "", "", "", "", "박스", "낱개"]);
  r2.height = 25.9;
  ws.mergeCells("B2:F2");
  const a2 = ws.getCell("A2");
  a2.font = { name: XLFONT, size: 14, bold: true };
  a2.alignment = { horizontal: "left", vertical: "middle" };
  a2.numFmt = "yyyy-mm-dd";
  a2.border = { top: XL_MEDIUM, bottom: XL_THIN, left: XL_MEDIUM, right: XL_THIN };
  const b2 = ws.getCell("B2");
  b2.font = { name: XLFONT, size: 14, bold: true };
  b2.alignment = { horizontal: "center", vertical: "middle" };
  b2.border = { top: XL_MEDIUM, bottom: XL_THIN, left: XL_THIN, right: XL_MEDIUM };
  ["C2", "D2", "E2"].forEach((a) => (ws.getCell(a).border = { top: XL_MEDIUM, bottom: XL_THIN }));
  ["G2", "H2"].forEach((a) => {
    const c = ws.getCell(a);
    c.font = { name: XLFONT, size: 15, bold: true };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_MEDIUM, bottom: XL_MEDIUM };
  });

  // 3행: 헤더
  const r3 = ws.addRow(["행 레이블", "입수", product.displayName || product.name, "박스", "센터명", "낱개"]);
  r3.height = 40.5;
  const headerSize = { A: 11, B: 11, C: 13, D: 12, E: 11, F: 12 };
  ["A", "B", "C", "D", "E", "F"].forEach((col) => {
    const c = ws.getCell(`${col}3`);
    c.font = { name: XLFONT, size: headerSize[col], bold: true };
    c.alignment = { horizontal: "center", vertical: "middle", wrapText: col === "C" };
    c.border = { top: XL_THIN, bottom: XL_THIN, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
  });

  // 박스(D)/낱개(F)를 고정값이 아니라 "그 줄의 입수(B)·수량(C)로 계산하는 수식"으로 넣는다.
  // 이렇게 하면 나중에 엑셀에서 입수 칸을 손으로 고쳐도 박스/낱개가 자동으로 다시 계산된다.
  function setBoxRemFormula(row, cQty) {
    const rn = row.number;
    row.getCell("D").value = { formula: `IF(B${rn}=0,0,INT(${cQty}/B${rn}))`, result: pack > 0 ? Math.floor((typeof cQty === "number" ? cQty : 0) / pack) : 0 };
  }

  let bandIndex = 0; // 지역 데이터 행에서만 증가시키는 흰색/회색 교차용 카운터
  const flatRowNum = new Array(flat.length).fill(null); // flat 인덱스 -> 실제 엑셀 행번호
  const checkpointQueue = []; // { rowNumber, flatIdx } - 전체 행번호를 다 알고 난 뒤 2차로 수식을 채워넣음

  function addRegionRow(r, flatIdx) {
    const { box, rem } = bd(r.qty);
    const row = ws.addRow([r.label, pack || "", r.qty, box, r.shortName || "", rem]);
    flatRowNum[flatIdx] = row.number;
    row.height = 25.35;
    const size = { A: 11, B: 11, C: 15, D: 14, E: 16, F: 14 };
    const bold = { A: false, B: false, C: false, D: false, E: true, F: false };
    const alignH = { A: "left", B: "center", C: "right", D: "center", E: "center", F: "center" };
    const isGray = bandIndex % 2 === 0;
    bandIndex++;
    ["A", "B", "C", "D", "E", "F"].forEach((col) => {
      const c = row.getCell(col);
      c.font = { name: XLFONT, size: size[col], bold: bold[col] };
      if (isGray) c.fill = XL_GRAY_FILL;
      if ("CDF".includes(col)) c.numFmt = DANGCHAK_ACCT_FMT;
      c.alignment = { horizontal: alignH[col], vertical: "middle" };
      c.border = { top: XL_THIN, bottom: XL_THIN, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
    });
    const rn = row.number;
    row.getCell("D").value = { formula: `IF(B${rn}=0,0,INT(C${rn}/B${rn}))`, result: box };
    row.getCell("F").value = { formula: `IF(B${rn}=0,C${rn},C${rn}-D${rn}*B${rn})`, result: rem };
    // 체크포인트: 화주사가 지정한 특정 지역에서만 표시 (1편: 강릉·신광주2·아신A·김포3·도화2·신오산3 / 2편: 김해2·신제주·익산·경산3·공주2·아신A·신오산3·포천2)
    if (pack > 0 && r.checkpoint && flatIdx < flat.length - 1) {
      ["G", "H"].forEach((col) => {
        const c = row.getCell(col);
        c.font = { name: XLFONT, size: 15, bold: true };
        c.alignment = { horizontal: "center", vertical: "middle" };
        c.border = { top: XL_THIN, bottom: XL_THIN, left: col === "G" ? XL_THIN : undefined, right: XL_THIN };
      });
      checkpointQueue.push({ rowNumber: rn, flatIdx });
    }
  }

  function addTotalRow(label, qtyFormulaOrValue, cachedQty, opts) {
    const o = opts || {};
    const { box, rem } = bd(cachedQty);
    const row = ws.addRow([label, pack || "", cachedQty, box, "", rem]);
    row.height = o.height || 25.35;
    const alignH = { A: "left", B: "center", C: "right", D: "center", E: "center", F: "center" };
    const sizes = o.sizes || { A: 16, B: 15, C: 15, D: 16, E: 16, F: 16 };
    ["A", "B", "C", "D", "E", "F"].forEach((col) => {
      const c = row.getCell(col);
      c.font = { name: XLFONT, size: sizes[col], bold: col !== "B" };
      if (o.gray) c.fill = XL_GRAY_FILL;
      if ("CDF".includes(col)) c.numFmt = DANGCHAK_ACCT_FMT;
      c.alignment = { horizontal: alignH[col], vertical: "middle" };
      c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
    });
    const rn = row.number;
    if (qtyFormulaOrValue !== null) row.getCell("C").value = { formula: qtyFormulaOrValue, result: cachedQty };
    row.getCell("D").value = { formula: `IF(B${rn}=0,0,INT(C${rn}/B${rn}))`, result: box };
    row.getCell("F").value = { formula: `IF(B${rn}=0,C${rn},C${rn}-D${rn}*B${rn})`, result: rem };
    return row;
  }

  let flatIdx = 0;
  const zoneRanges = []; // { zone, startFlatIdx, endFlatIdx }
  const zoneTotalRowNum = {};
  const activeZones = zoneList.filter((z) => regionRowsUsed.some((r) => zoneOf(r) === z));
  zoneList.forEach((zone) => {
    const rows = regionRowsUsed.filter((r) => zoneOf(r) === zone);
    if (rows.length === 0) return;
    const isLastZone = zone === activeZones[activeZones.length - 1];
    const startFlatIdx = flatIdx;
    rows.forEach((r) => {
      addRegionRow(r, flatIdx);
      flatIdx++;
    });
    const endFlatIdx = flatIdx - 1;
    zoneRanges.push({ zone, startFlatIdx, endFlatIdx });
    ws.addRow([]).height = isLastZone ? 4.5 : 5.45; // 지역 행과 합계 사이 얇은 간격 (실물과 동일)
    const zoneTotalQty = rows.reduce((a, r) => a + r.qty, 0);
    const sumFormula = `SUM(C${flatRowNum[startFlatIdx]}:C${flatRowNum[endFlatIdx]})`;
    const totalRow = addTotalRow(zoneLabel(zone), sumFormula, zoneTotalQty, { height: isLastZone ? 34.15 : 25.35 });
    zoneTotalRowNum[zone] = totalRow.number;
    ws.addRow([]).height = isLastZone ? 5.45 : 8.45;
  });

  // 총합계 (전체를 하나로 합쳐 나눴을 때) + "소분박스/소분낱개" 라벨
  const zoneTotalCells = Object.values(zoneTotalRowNum).map((n) => `C${n}`);
  const grandRow = addTotalRow("총합계", zoneTotalCells.join("+"), product.totalQty, {
    height: 31.5,
    gray: true,
    sizes: { A: 15, B: 15, C: 16, D: 16, E: 16, F: 16 },
  });
  ["G", "H"].forEach((col) => {
    const c = grandRow.getCell(col);
    c.value = col === "G" ? "소분박스" : "소분낱개";
    c.font = { name: XLFONT, size: 20, bold: true };
    c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFF00" } };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: XL_THIN, right: XL_THIN };
  });

  // 대분(총 박스 수량, 지역별 박스 합) / 소분(총 낱개 수량, 지역별 낱개 합 → 다시 박스로 재환산)
  // 구역합계·총합계 행은 빼고, 실제 지역 행(D·F열)만 구역별 연속 구간으로 더한다.
  const boxRangeStr = zoneRanges.map((z) => `D${flatRowNum[z.startFlatIdx]}:D${flatRowNum[z.endFlatIdx]}`).join(",");
  const remRangeStr = zoneRanges.map((z) => `F${flatRowNum[z.startFlatIdx]}:F${flatRowNum[z.endFlatIdx]}`).join(",");
  const totalBoxSum = flat.reduce((a, r) => a + bd(r.qty).box, 0);
  const totalRemSum = flat.reduce((a, r) => a + bd(r.qty).rem, 0);
  const subBox = pack > 0 ? Math.floor(totalRemSum / pack) : 0;
  const subRem = totalRemSum - subBox * pack;
  // B열은 실물처럼 체크박스("완료" 표시용) - 소분박스/낱개 수식은 첫 지역행의 입수(B)를 그대로 참조해서 계산한다.
  const finalRow = ws.addRow(["총 박스 수량 / 총 낱개 수량", "□", "", totalBoxSum, "", totalRemSum, subBox, subRem]);
  finalRow.height = 32.25;
  const finalAlign = { A: "left", B: "center", C: "right", D: "center", E: "center", F: "center" };
  ["A", "B", "C", "D", "E", "F"].forEach((col) => {
    const c = finalRow.getCell(col);
    c.font = { name: XLFONT, size: col === "A" || col === "B" ? 15 : 16, bold: col !== "B" };
    if ("CDF".includes(col)) c.numFmt = DANGCHAK_ACCT_FMT;
    c.alignment = { horizontal: finalAlign[col], vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: col === "A" ? XL_MEDIUM : XL_THIN, right: col === "F" ? XL_MEDIUM : XL_THIN };
  });
  const frn = finalRow.number;
  const packRef = `B${flatRowNum[0]}`;
  finalRow.getCell("D").value = { formula: `SUM(${boxRangeStr})`, result: totalBoxSum };
  finalRow.getCell("F").value = { formula: `SUM(${remRangeStr})`, result: totalRemSum };
  finalRow.getCell("G").value = { formula: `IF(${packRef}=0,0,INT(F${frn}/${packRef}))`, result: subBox };
  finalRow.getCell("H").value = { formula: `IF(${packRef}=0,F${frn},F${frn}-G${frn}*${packRef})`, result: subRem };
  ["G", "H"].forEach((col) => {
    const c = finalRow.getCell(col);
    c.font = { name: XLFONT, size: 20, bold: true };
    c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFF00" } };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.border = { top: XL_THIN, bottom: XL_MEDIUM, left: XL_THIN, right: XL_THIN };
  });

  // 담당자 서명란(이름은 피킹하는 사람이 손으로 적도록 비워둠) + 완료 체크박스 - 실물 피킹지와 동일하게 맨 아래에
  const signRow = ws.addRow([]);
  signRow.height = 27.75;
  ws.getCell(`G${signRow.number}`).border = { top: XL_THIN };
  ws.getCell(`H${signRow.number}`).value = "□";
  ws.getCell(`H${signRow.number}`).font = { name: XLFONT, size: 26 };
  ws.getCell(`H${signRow.number}`).alignment = { horizontal: "center", vertical: "middle" };
  ws.getCell(`H${signRow.number}`).border = { top: XL_THIN };
  ws.pageSetup.printArea = `A2:H${signRow.number}`; // 1행(빈 줄)을 뺀 나머지만 인쇄 - 실물 피킹지와 동일

  // 체크포인트 G/H: 이 지점 "다음"부터 (같은 구역의 남은 지역행) + (그 뒤 구역들의 지역행 전체) 낱개 합계를 박스로 환산
  checkpointQueue.forEach(({ rowNumber, flatIdx: fi }) => {
    const zr = zoneRanges.find((z) => fi >= z.startFlatIdx && fi <= z.endFlatIdx);
    const ranges = [];
    if (fi < zr.endFlatIdx) ranges.push(`F${flatRowNum[fi + 1]}:F${flatRowNum[zr.endFlatIdx]}`);
    zoneRanges
      .filter((z) => z.startFlatIdx > zr.endFlatIdx)
      .forEach((z) => ranges.push(`F${flatRowNum[z.startFlatIdx]}:F${flatRowNum[z.endFlatIdx]}`));
    const sumExpr = `SUM(${ranges.join(",")})`;
    const remainingRem = remAfter[fi + 1];
    const cpBox = pack > 0 ? Math.floor(remainingRem / pack) : 0;
    const cpRem = remainingRem - cpBox * pack;
    ws.getCell(`G${rowNumber}`).value = { formula: `IF(B${rowNumber}=0,0,INT(${sumExpr}/B${rowNumber}))`, result: cpBox };
    ws.getCell(`H${rowNumber}`).value = { formula: `IF(B${rowNumber}=0,${sumExpr},${sumExpr}-G${rowNumber}*B${rowNumber})`, result: cpRem };
  });
}

// "combined" 당착 상품들을 공급사 하나당 시트 하나로 몰아서 넣는다 (실물 "{공급사}(오전현장-지역)" 시트 그대로).
// 상품마다: 날짜+공급사 줄 -> 헤더줄 -> 주문 있는 지역행(들) -> 총합계 -> 총박스/낱개(체크박스) -> 담당자 서명란, 빈 줄 하나 두고 다음 상품.
// 실물로 직접 만들어주신 "당착.xlsx" 견본과 셀 단위로 맞춘 서식 (글꼴 크기·색상·테두리·행높이·병합 전부 동일)
const DANGCHAK_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFBE3D6" } }; // 견본의 옅은 주황(테마색+틴트 80%) 그대로 계산한 값
const DANGCHAK_ACCT_FMT = '_-* #,##0_-;\\-* #,##0_-;_-* "-"_-;_-@_-'; // 0은 "-"로 보이는 회계 서식 (견본과 동일)
function addDangchakCombinedSheet(workbook, supplierLabel, products, usedNames, date) {
  const regionNames = new Set();
  products.forEach((p) => {
    const dk = getDangchakInfo(p.name);
    p.regionRows.forEach((r) => dangchakHasRegion(dk, r.key) && (r.rawQty ?? r.qty) > 0 && regionNames.add(r.shortName));
  });
  const regionSuffix = regionNames.size === 1 ? `-${[...regionNames][0]}` : "";
  const ws = workbook.addWorksheet(safeSheetName(`${supplierLabel}(오전현장${regionSuffix})`, usedNames));
  ws.columns = [{ width: 36.625 }, { width: 7.625 }, { width: 30.625 }, { width: 12.375 }, { width: 11.375 }, { width: 11.125 }];
  ws.pageSetup = { orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 1, margins: { left: 0.25, right: 0.25, top: 0.35, bottom: 0.35, header: 0.2, footer: 0.2 } };

  function styleRow(row, { font, align, border, fill, numFmt } = {}) {
    ["A", "B", "C", "D", "E", "F"].forEach((col) => {
      const c = row.getCell(col);
      if (font) c.font = typeof font === "function" ? font(col) : font;
      if (align) c.alignment = typeof align === "function" ? align(col) : align;
      if (fill) c.fill = fill;
      if (numFmt && "CDF".includes(col)) c.numFmt = numFmt;
      const left = col === "A" ? XL_MEDIUM : XL_THIN;
      const right = col === "F" ? XL_MEDIUM : XL_THIN;
      const vert = typeof border === "function" ? border(col) : border || { top: XL_THIN, bottom: XL_THIN };
      c.border = { left, right, ...vert };
    });
  }

  products.forEach((product, idx) => {
    const pack = product.packQty || 0;
    const bd = (q) => (pack > 0 ? { box: Math.floor(q / pack), rem: q % pack } : { box: 0, rem: q });
    // 당착 몫은 그 상품에 지정된 지역 하나만 (나머지 지역 주문은 평소 피킹지시서로 정상적으로 나감)
    const dk = getDangchakInfo(product.name);
    const rows = product.regionRows
      .filter((r) => dangchakHasRegion(dk, r.key) && (r.rawQty ?? r.qty) > 0)
      .map((r) => ({ ...r, qty: r.rawQty ?? r.qty }));
    if (rows.length === 0) return;
    const totalQty = rows.reduce((a, r) => a + r.qty, 0);

    if (idx > 0) {
      // 블록 사이 여백 2줄 (견본과 동일하게 작은 줄 하나 + 병합된 구분줄 하나)
      ws.addRow([]).height = 17.25;
      const gapRow = ws.addRow([]);
      gapRow.height = 25.9;
      ws.mergeCells(`A${gapRow.number}:F${gapRow.number}`);
    }

    const r1 = ws.addRow([date || todayStr(), `${supplierLabel}□`, "", "", "", ""]);
    r1.height = 42;
    ws.mergeCells(`B${r1.number}:F${r1.number}`);
    const a1 = ws.getCell(`A${r1.number}`);
    a1.font = { name: XLFONT, size: 14, bold: true };
    a1.alignment = { horizontal: "center", vertical: "middle" };
    a1.numFmt = "mm-dd-yy";
    a1.border = { top: XL_MEDIUM, bottom: XL_THIN, left: XL_MEDIUM, right: XL_THIN };
    const b1 = ws.getCell(`B${r1.number}`);
    b1.font = { name: XLFONT, size: 14, bold: true };
    b1.alignment = { horizontal: "center", vertical: "middle" };
    b1.border = { top: XL_MEDIUM, bottom: XL_THIN, left: XL_THIN };
    ["C", "D", "E"].forEach((col) => (ws.getCell(`${col}${r1.number}`).border = { top: XL_MEDIUM, bottom: XL_THIN }));
    ws.getCell(`F${r1.number}`).border = { top: XL_MEDIUM, bottom: XL_THIN, right: XL_MEDIUM };

    const r2 = ws.addRow(["행 레이블", "입수", product.displayName || product.name, "박스", "센터명", "낱개"]);
    r2.height = 42;
    styleRow(r2, {
      font: (col) => ({ name: XLFONT, size: { A: 11, B: 11, C: 13, D: 12, E: 11, F: 12 }[col], bold: true }),
      align: (col) => ({ horizontal: "center", vertical: "middle", wrapText: col === "C" }),
      fill: DANGCHAK_FILL,
      numFmt: DANGCHAK_ACCT_FMT,
    });

    const rowNums = [];
    rows.forEach((r) => {
      const { box, rem } = bd(r.qty);
      const row = ws.addRow([r.label, pack || "", r.qty, box, r.shortName || "", rem]);
      rowNums.push(row.number);
      row.height = 42;
      styleRow(row, {
        font: (col) => ({ name: XLFONT, size: { A: 11, B: 11, C: 15, D: 14, E: 16, F: 14 }[col], bold: col === "E" }),
        align: (col) => ({ horizontal: { A: "left", B: "center", C: "right", D: "center", E: "center", F: "center" }[col], vertical: "middle" }),
        numFmt: DANGCHAK_ACCT_FMT,
      });
      const rn = row.number;
      row.getCell("D").value = { formula: `IF(B${rn}=0,0,INT(C${rn}/B${rn}))`, result: box };
      row.getCell("F").value = { formula: `IF(B${rn}=0,C${rn},C${rn}-D${rn}*B${rn})`, result: rem };
    });

    // 데이터 행과 총합계 사이 얇은 구분줄 (견본의 A5:F5 병합 줄과 동일)
    const divRow = ws.addRow([]);
    divRow.height = 4.5;
    ws.mergeCells(`A${divRow.number}:F${divRow.number}`);
    divRow.getCell("A").border = { top: XL_THIN, bottom: XL_THIN, left: XL_MEDIUM, right: XL_MEDIUM };

    const { box: tBox, rem: tRem } = bd(totalQty);
    const totalRow = ws.addRow(["총합계", pack || "", totalQty, tBox, "", tRem]);
    totalRow.height = 42;
    styleRow(totalRow, {
      font: (col) => ({ name: XLFONT, size: col === "C" || col === "D" || col === "F" ? 16 : 15, bold: col !== "B" }),
      align: (col) => ({ horizontal: col === "A" ? "left" : col === "B" ? "center" : undefined, vertical: "middle" }),
      fill: DANGCHAK_FILL,
      numFmt: DANGCHAK_ACCT_FMT,
    });
    const trn = totalRow.number;
    totalRow.getCell("C").value = { formula: `SUM(C${rowNums[0]}:C${rowNums[rowNums.length - 1]})`, result: totalQty };
    totalRow.getCell("D").value = { formula: `IF(B${trn}=0,0,INT(C${trn}/B${trn}))`, result: tBox };
    totalRow.getCell("F").value = { formula: `IF(B${trn}=0,C${trn},C${trn}-D${trn}*B${trn})`, result: tRem };

    const finalRow = ws.addRow(["총 박스 수량 / 총 낱개 수량", "□", "", tBox, "", tRem]);
    finalRow.height = 42;
    styleRow(finalRow, {
      font: (col) => ({ name: XLFONT, size: col === "A" || col === "B" ? 15 : 16, bold: col !== "B" && col !== "C" }),
      align: (col) => ({ horizontal: col === "A" ? "left" : "center", vertical: "middle" }),
      border: () => ({ top: XL_THIN, bottom: XL_MEDIUM }),
      numFmt: DANGCHAK_ACCT_FMT,
    });
    finalRow.getCell("D").value = { formula: `SUM(D${rowNums[0]}:D${rowNums[rowNums.length - 1]})`, result: tBox };
    finalRow.getCell("F").value = { formula: `SUM(F${rowNums[0]}:F${rowNums[rowNums.length - 1]})`, result: tRem };

    // 담당자(이름은 비워둠, 손으로 적도록) + 완료 체크박스 - 견본과 같은 위치(E/F), 테두리 없음
    const signRow = ws.addRow([]);
    signRow.height = 24;
    ws.getCell(`F${signRow.number}`).value = "□";
    ws.getCell(`F${signRow.number}`).font = { name: XLFONT, size: 15 };
    ws.getCell(`F${signRow.number}`).alignment = { horizontal: "center", vertical: "middle" };
  });
}

async function downloadStyledInspectionExcel(products, filename, setBusy, date, activeSku) {
  if (setBusy) setBusy(true);
  try {
    const workbook = new ExcelJS.Workbook();
    const usedNames = new Set();
    // 당착 상품(GS_당착리스트)은 같은 파일에 섞여 들어가되 37개 지역 전부가 아니라 실제 주문 있는 지역만 보여준다.
    // - style "full"(조인앤조인): 구역 합계는 유지한 채 자기 시트에서 0인 지역만 건너뜀
    // - style "combined"(참맛나라·맛요일·H2글로벌·데어리젠): 같은 공급사 것끼리 한 시트에 몰아서 "{공급사}(오전현장-지역)"로 나감
    const combinedDone = new Set();
    products.forEach((p) => {
      const style = getDangchakStyle(p.name);
      if (style === "full") {
        addStyledInspectionSheet(workbook, p, usedNames, date, true);
      } else {
        // combined 당착이든 아니든 평소 피킹지시서는 그대로 만든다 - 당착으로 빠지는 지역 하나만
        // 위의 PICKING_QTY_ZERO_BY_NAME으로 이미 0 처리돼서, 나머지 지역 주문은 평소처럼 다 보인다.
        addStyledInspectionSheet(workbook, p, usedNames, date);
        if (style === "combined") {
          const groupKey = getDangchakInfo(p.name).group;
          if (!combinedDone.has(groupKey)) {
            combinedDone.add(groupKey);
            const group = products.filter((q) => (getDangchakInfo(q.name) || {}).group === groupKey);
            addDangchakCombinedSheet(workbook, groupKey, group, usedNames, date);
          }
        }
      }
    });
    // 여러 상품을 한 파일에 시트로 묶을 때, 화면에서 고르고 있던 상품의 시트가 열자마자 보이도록 활성 탭을 맞춘다.
    // (지정 안 하면 항상 첫 번째 시트가 열려서, "분명 다른 상품을 골랐는데 엉뚱한 상품이 열린다"는 착각이 생김)
    if (activeSku) {
      const idx = products.findIndex((p) => p.sku === activeSku);
      if (idx > 0) workbook.views = [{ activeTab: idx, firstSheet: idx }];
    }
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } finally {
    if (setBusy) setBusy(false);
  }
}

// ================= GS 편수리스트 (당착·DC 브랜드별 SKU 수) =================
// 실물 "GS_편수리스트" 엑셀을 그대로 템플릿으로 넣어두고, 그날 발주파일 기준으로 브랜드별 SKU(상품 종류) 수만 E열에 채운다.

  { row: 5, key: "참맛나라" },
  { row: 6, key: "맛요일" },
  { row: 7, key: "H2글로벌" },
  { row: 8, key: "데어리젠" },
];
const PYEONSU_DC_ROWS = [
  { row: 10, key: "대광푸드" },
  { row: 11, key: "삼경MNS", bySupplier: true }, // DC 공급사 목록에 아직 없어 발주파일 공급사명으로 센다
  { row: 12, key: "골든" },
  { row: 13, key: "흥선" },
  { row: 14, key: "뚠뚠" },
  { row: 15, key: "아워홈" },
  { row: 16, key: "삼진어묵" },
  { row: 17, key: "싱싱한" },
  { row: 18, key: "효성" },
  { row: 19, key: "참맛나라" },
  { row: 20, key: "맛요일" },
  { row: 21, key: "h2 글로벌" },
  { row: 22, key: "데어리젠" },
];
const pyeonsuNorm = (v) => String(v || "").toLowerCase().replace(/\(네고\)|\s/g, "");

// 그날 상품 목록(buildProductsForDate 결과) -> { 행번호: SKU 수 }
function computePyeonsuCounts(products) {
  const counts = {};
  PYEONSU_DANGCHAK_ROWS.forEach(({ row, key }) => {
    counts[row] = products.filter((p) => {
      const dk = getDangchakInfo(p.name);
      if (!dk) return false;
      const groupKey = dk.style === "combined" ? dk.group : dangchakVendorKey(p);
      if (pyeonsuNorm(groupKey) !== pyeonsuNorm(key)) return false;
      return p.regionRows.some((r) => dangchakHasRegion(dk, r.key) && (r.rawQty ?? r.qty) > 0);
    }).length;
  });
  PYEONSU_DC_ROWS.forEach(({ row, key, bySupplier }) => {
    counts[row] = products.filter((p) => {
      const dk = getDangchakInfo(p.name);
      if (dk && dk.style === "full") return false;
      const match = bySupplier ? pyeonsuNorm(pickingSupplierKey(p.supplier || "")) === pyeonsuNorm(key) : dcVendorKey(p.name) === key;
      if (!match) return false;
      return p.regionRows.some((r) => !(dk && dangchakHasRegion(dk, r.key)) && r.qty > 0);
    }).length;
  });
  return counts;
}

async function downloadPyeonsuList(ordersForDate, date, setBusy) {
  if (setBusy) setBusy(true);
  try {
    const products = buildProductsForDate(ordersForDate, date);
    const counts = computePyeonsuCounts(products);
    const bin = atob(PYEONSU_TEMPLATE_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const workbook = new ExcelJS.Workbook();
    await workbook.xlsx.load(bytes.buffer);
    const ws = workbook.worksheets[0];
    // 날짜: 원본은 =TODAY()라 다시 열면 날짜가 바뀌므로 발주일을 값으로 고정 (표시 서식은 원본과 같은 "📌2026년 10월 6일 화요일📌")
    const [y, m, d] = date.split("-").map(Number);
    const a1 = ws.getCell("A1");
    a1.value = new Date(Date.UTC(y, m - 1, d));
    // 병합된 A1:B2 전체에 같은 서식 (원본 서식코드의 이모지 표기가 ExcelJS에서 깨져 엑셀이 "복구" 경고를 띄우지 않도록 교체)
    ["A1", "B1", "A2", "B2"].forEach((addr) => (ws.getCell(addr).numFmt = '"📌"[$-412]yyyy"년" m"월" d"일" dddd"📌"'));
    ws.getCell("E2").value = null; // 서명칸(사무실)은 손으로 쓰도록 비움
    const center = { ...(ws.getCell("E13").alignment || {}), horizontal: "center" };
    Object.entries(counts).forEach(([row, n]) => {
      const c = ws.getCell(`E${row}`);
      c.value = n;
      c.alignment = center;
      c.numFmt = "0"; // 발주 없는 공급사도 "-"가 아니라 0으로 보이게
      ws.getCell(`F${row}`).value = null; // 비고는 비움
    });
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `GS_편수리스트_${date}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return counts;
  } finally {
    if (setBusy) setBusy(false);
  }
}

function addDaysStr(dateStr, days) {
  // 로컬시간으로 Date를 만들고 toISOString()(UTC)으로 뽑으면, 한국(UTC+9)처럼 UTC보다 앞선 시간대에서
  // 자정 근처 계산 시 하루가 밀리는 버그가 있었음 (서버가 UTC라 테스트 때는 안 보였음).
  // Date.UTC로 순수 UTC 값만 다뤄서 브라우저의 시간대와 무관하게 항상 같은 결과가 나오도록 수정.
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}

const DC_PRODUCT_PREFIXES = DC_VENDOR_GROUPS.flatMap((g) => g.prefixes);
function isDcProduct(name) {
  return !!dcGroupOf(name);
}

// DC 상품이 속한 DC 공급사(거래명세서 공급사 키)와, 파일 안에서의 순서(정렬용). DC가 아니면 null / -1
// 코드에 있는 기본 DC 분류 (상품마스터에서 바꾼 값 무시)
function dcGroupOfBase(name) {
  const n = String(name || "").replace(/\n/g, "").trim();
  for (const g of DC_VENDOR_GROUPS) {
    const idx = g.prefixes.findIndex((p) => n.startsWith(p));
    if (idx !== -1) return { group: g, idx };
  }
  return null;
}
// 상품마스터에서 바꾼 DC 분류가 있으면 그것("" = DC 아님), 없으면 기본 분류. 직원이 넣은 상품은 그 DC 공급사 목록 맨 뒤로.
function dcGroupOf(name) {
  const ov = productInfoOf(name);
  if (ov && ov.dc !== undefined && ov.dc !== null) {
    if (ov.dc === "") return null;
    const g = DC_VENDOR_GROUPS.find((x) => x.key === ov.dc);
    if (g) {
      const base = dcGroupOfBase(name);
      return { group: g, idx: base && base.group.key === g.key ? base.idx : 999 };
    }
  }
  return dcGroupOfBase(name);
}
function dcVendorKey(name) {
  const r = dcGroupOf(name);
  return r ? r.group.key : null;
}

// "당착" 상품 목록 (GS_당착리스트 + 실물 피킹검수 파일 기준). 평소 피킹지시서와 같은 파일에 섞여 들어가되,
// 37개 지역을 전부 보여주는 평소 방식이 아니라 "그날 실제로 주문 있는 지역만" 보여주는 모양으로 나간다.
// style "full": 여러 지역에 걸쳐 나갈 수 있는 상품 - 구역 합계는 유지한 채 0인 지역만 건너뛰고 자기 시트로 나감 (조인앤조인).
// style "combined": 보통 한두 지역(주로 청주·제주)에만 나가는 상품 - 같은 공급사 것끼리 한 시트에 몰아서, "{공급사}(오전현장-지역)"로 나감.
const DANGCHAK_PRODUCTS = {
  "고단백저당)도넛케이크(다크초코": { style: "full" },
  "고단백저당)도넛케이크(헤이즐넛": { style: "full" },
  "고단백저당)카스테라(초코": { style: "full" },
  "고단백저당)카스테라(플레인": { style: "full" },
  "고단백저당)쿠키(다크초코아몬드": { style: "full" },
  "고단백저당)쿠키(말차마카다미아": { style: "full" },
  // 참맛나라와 맛요일은 각자 따로 시트로 나간다 ("참맛나라(오전현장-청주)", "맛요일(오전현장-청주)")
  // region: 당착 몫으로 빠지는 지역 하나 - 이 상품이 실제로는 다른 지역에도 정상적으로 나갈 수 있어서,
  // 평소 피킹지시서는 그대로 만들고(이 지역만 기존 0고정 규칙으로 빠짐), 이 지역 몫만 따로 당착 시트로 나간다.
  "두끼)치즈즉석라볶이633G": { style: "combined", group: "참맛나라", region: "VV34" },
  "맛요일)스팸치즈부대찌개298G": { style: "combined", group: "참맛나라", region: "VV34" }, // 상품명은 맛요일이지만 당착리스트상 참맛나라 소속
  "맛요일)3900소고기미역국밥480G": { style: "combined", group: "맛요일", region: "VV34" },
  "맛요일)3900치즈미역국468G": { style: "combined", group: "맛요일", region: "VV34" },
  "맛요일)간장불고기덮밥366G": { style: "combined", group: "맛요일", region: "VV34" },
  "맛요일)대파육개장480G": { style: "combined", group: "맛요일", region: "VV34" },
  "맛요일)떠먹는얼큰국물파스타": { style: "combined", group: "맛요일", region: "VV34" },
  "맛요일)스팸참기름김치덮밥345G": { style: "combined", group: "맛요일", region: "VV34" },
  "오뚜기마요)참치마요간장계란밥": { style: "combined", group: "맛요일", region: "VV34" },
  "노포식당)김치찌개406G": { style: "combined", group: "H2글로벌", region: "VV34" },
  "노포식당)된장찌개420G": { style: "combined", group: "H2글로벌", region: "VV34" },
  "서청미역)소고기미역국480G": { style: "combined", group: "H2글로벌", region: "VV34" },
  "리얼)쫄깃한모짜렐라치즈35G": { style: "combined", group: "데어리젠", region: "VV92" },
  "리얼)쫄깃한스트링치즈4입": { style: "combined", group: "데어리젠", region: "VV92" },
};
// 상품마스터에서 바꾼 당착 분류가 있으면 그것(null = 당착 아님), 없으면 기본 당착 목록
function getDangchakInfo(name) {
  const ov = productInfoOf(name);
  if (ov && ov.dangchak !== undefined) {
    const d = ov.dangchak;
    if (!d || !d.style) return null;
    if (d.style === "combined") {
      const regions = (Array.isArray(d.regions) && d.regions.length ? d.regions : [d.region || "VV34"]).filter(Boolean);
      return { style: "combined", regions, region: regions[0], group: String(d.group || "").trim() || dcVendorKey(name) || "당착" };
    }
    return { style: "full" };
  }
  return getDangchakInfoBase(name);
}
function getDangchakInfoBase(name) {
  const n = String(name || "").trim();
  const key = Object.keys(DANGCHAK_PRODUCTS).find((d) => n.startsWith(d));
  if (!key) return null;
  const info = DANGCHAK_PRODUCTS[key];
  return info.style === "combined" ? { ...info, regions: [info.region] } : info;
}
// 이 지역이 당착(오전현장)으로 빠지는 지역인가. 전 지역 당착이면 항상 true.
function dangchakHasRegion(dk, code) {
  if (!dk) return false;
  if (dk.style === "full") return true;
  return (dk.regions || [dk.region]).includes(code);
}
function getDangchakStyle(name) {
  const info = getDangchakInfo(name);
  return info ? info.style : null;
}
function isDangchakProduct(name) {
  return !!getDangchakInfo(name);
}

// 조인앤조인처럼 여러 지역에 나가는 당착 상품은 화주사 기준 "영남/호남/수도권" 세 권역으로 묶는다
// (저희 시스템 내부의 A/B구역과는 다른, 실제 지리적 구분 - 체크포인트 등 다른 기능에는 영향 없음)
const REGION_REAL_ZONE = {
  VV57: "영남", VV58: "영남", VV92: "영남", VV25: "영남", VV20: "영남", VV83: "영남", VV84: "영남", VV97: "영남",
  VV95: "호남", VV96: "호남", VV65: "호남",
};
function realZoneOf(code) {
  return REGION_REAL_ZONE[code] || "수도권";
}

// 사업자 정보가 아직 없는 공급사(대부분의 DC 공급사)는 상호에 이름만 넣고 나머지는 공란으로 발행
function getInvoiceInfo(key) {
  if (SUPPLIER_INVOICE_INFO[key]) return SUPPLIER_INVOICE_INFO[key];
  const g = DC_VENDOR_GROUPS.find((x) => x.key === key);
  return { regNo: "", name: g ? g.label : key, ceo: "", address: "", bizType: "", bizItem: "", agent: "" };
}

// ===== 거래명세서 데이터: 공급사 + 편(1/2/DC) 기준으로 "지역별 명세서"에 들어갈 내용 만들기 =====
// 1편/2편 명세서에 실리는 상품은 "소비기한 자료"(SUPPLIER_INVOICE_CATALOG)에 있는 상품만, 그 자료의 순서대로.
// (예: 영진베이커리는 PB 상품(서울우유 등)이 같이 주문돼도 명세서에는 오든든 10종만 나감)
// DC는 DC_PRODUCT_PREFIXES에 걸리는 상품만, 업로드 순서대로.
// 실제로는 그 공급사가 납품하지 않는 상품이라, 카탈로그에 없어도 명세서에 자동으로 끼워넣으면 안 되는 것들 (건별 요청)
const INVOICE_EXCLUDED_PRODUCTS = [{ supplierKey: "대광푸드", name: "SET)오븐에구운도너츠버터맛10입" }];
function isInvoiceExcludedProduct(supplierKey, name) {
  return INVOICE_EXCLUDED_PRODUCTS.some((o) => o.supplierKey === supplierKey && o.name === name);
}

// 카탈로그(소비기한 자료)에 없는 상품을 두 종류로 나눈다: 명세서에 자동 추가되는 "신제품"과, PB/TC(또는 건별 제외 요청)라서 아예 안 나가는 "제외 상품"
function getInvoiceSkippedProducts(products, supplierKey) {
  const cat = SUPPLIER_INVOICE_CATALOG[supplierKey] || {};
  const known = new Set([...(cat["1"] || []), ...(cat["2"] || [])]);
  const notInCatalog = products.filter((p) => supplierGroupKey(p.supplier) === supplierKey && !isDcProduct(p.name) && !known.has(p.name));
  const isExcluded = (p) => /PB/i.test(String(p.supplier || "")) || isInvoiceExcludedProduct(supplierKey, p.name);
  return {
    added: notInCatalog.filter((p) => !isExcluded(p)).map((p) => p.name),
    excluded: notInCatalog.filter(isExcluded).map((p) => p.name),
  };
}

// 그날 발주가 한 건도 없어서 주문 데이터에서 입수를 못 읽는 상품용 (실물 명세서에 적혀있던 입수)
const INVOICE_KNOWN_PACK = {
  "오든든)대만식햄치즈샌드1편": 60, "오든든)더블햄샌드1편": 60, "오든든)치즈포테이토피타브레드1": 36, "오든든)페퍼로니피자피타브레드1": 36, "오든든)햄치즈에그피타브레드1편": 36,
  "오든든)대만식햄치즈샌드2편": 60, "오든든)더블햄샌드2편": 60, "오든든)치즈포테이토피타브레드2": 36, "오든든)페퍼로니피자피타브레드2": 36, "오든든)햄치즈에그피타브레드2편": 36,
  "든든두부샐러드2편": 25, "듬뿍)스모크치킨샐러드2편": 30, "듬뿍)케이준치킨샐러드2편": 30, "에너지샐러드2편": 25, "리치샐러드2편": 25,
  "케이준에그샐러드2편": 25, "트리플무스샐러드2편": 25, "한컵)불고기도토리면샐러드2편": 24, "한컵)치킨카펠리니샐러드2편": 24, "한컵)치폴레불고기샐러드2편": 24,
};

// 당착 명세서의 공급사 묶음: DC 상품이면 그 DC 공급사, 아니면 발주파일의 공급사
function dangchakVendorKey(p) {
  return dcVendorKey(p.name) || supplierGroupKey(p.supplier);
}
// 그날 당착 명세서를 만들 수 있는 공급사 목록 (DC 공급사 순서 먼저, 그 외 공급사는 뒤에)
function dangchakVendorOptions(products) {
  const keys = [];
  products.forEach((p) => {
    if (!isDangchakProduct(p.name)) return;
    const k = dangchakVendorKey(p);
    if (!keys.includes(k)) keys.push(k);
  });
  const dcOrder = DC_VENDOR_GROUPS.map((g) => g.key);
  keys.sort((a, b) => (dcOrder.includes(a) ? dcOrder.indexOf(a) : 999) - (dcOrder.includes(b) ? dcOrder.indexOf(b) : 999));
  return keys
    .map((k) => {
      const g = DC_VENDOR_GROUPS.find((x) => x.key === k);
      return { key: k, label: g ? g.label : k, regions: buildInvoiceRegionsForSupplier(products, k, "당착") };
    })
    .filter((v) => v.regions.length > 0);
}

// 명세서 구분 이름: 1편 / 2편 / DC / 당착
function invPartLabel(part) {
  return part === "DC" || part === "당착" ? part : `${part}편`;
}

// part: 1 | 2 | "DC" | "당착"
// 당착 상품은 모두 DC 공급사 목록에도 들어 있어서, DC와 똑같은 양식으로 "당착 몫"만 따로 분류해 "당착" 명세서로 낸다.
//  - 조인앤조인처럼 style "full"인 당착 상품: 모든 지역이 당착 → 당착 명세서에만 나가고 DC에서는 빠진다.
//  - 참맛나라·맛요일·H2글로벌(청주), 데어리젠(신제주)처럼 style "combined"인 상품: 그 당착 지역 한 곳만 당착 명세서에 나가고
//    (0고정과 무관하게 원래 발주 수량), 나머지 지역은 평소처럼 DC 명세서로 나간다. 당착 지역 몫은 DC에 절대 안 나간다.
function buildInvoiceDataForSupplier(products, supplierKey, part) {
  const supplierProducts = products.filter((p) => supplierGroupKey(p.supplier) === supplierKey);
  const byName = new Map();
  let names;
  if (part === "DC" || part === "당착") {
    // DC는 주문 파일의 공급사가 아니라 "GS편의점DC" 목록의 DC 공급사 기준. 그날 주문된 상품만, 목록 순서대로(같은 목록 안에선 업로드 순서)
    const dcProducts = products
      .map((p, i) => ({ p, i, r: dcGroupOf(p.name) }))
      .filter((x) => {
        const dk = getDangchakInfo(x.p.name);
        if (part === "당착") return !!dk && dangchakVendorKey(x.p) === supplierKey;
        if (!x.r || x.r.group.key !== supplierKey) return false;
        return !dk || dk.style === "combined"; // DC: 일반 DC 상품 + 지역 한 곳만 당착인 상품의 나머지 지역
      })
      .sort((a, b) => (a.r ? a.r.idx : 9999) - (b.r ? b.r.idx : 9999) || a.i - b.i)
      .map((x) => x.p);
    dcProducts.forEach((p) => {
      if (!byName.has(p.name)) byName.set(p.name, p);
    });
    names = Array.from(byName.keys());
  } else {
    supplierProducts.forEach((p) => {
      if (!byName.has(p.name)) byName.set(p.name, p);
    });
    const cat = SUPPLIER_INVOICE_CATALOG[supplierKey];
    // DC 상품과 당착 상품은 1편/2편 명세서에 절대 들어가지 않는다 (각각 DC·당착 카드에서만 나감)
    const catalogNames = ((cat && cat[String(part)]) || []).filter((n) => !isDcProduct(n) && getDangchakStyle(n) !== "full");
    // 소비기한 자료(카탈로그)에 아직 없는 신제품도 빠지지 않도록, 그 편에 실제로 나간 상품을 뒤에 자동으로 덧붙인다.
    // (카탈로그 순서 먼저 -> 신제품은 업로드 순서로 맨 뒤에)
    const catalogSet = new Set(catalogNames);
    const extraNames = [];
    supplierProducts.forEach((p) => {
      // PB/TC 상품이나, 건별로 "이 상품은 명세서에서 빼달라"고 요청받은 상품은 거래명세서 대상이 아니므로
      // 카탈로그에 없어도 자동으로 끼워넣지 않는다(신제품 자동추가는 정상 상품에만 적용).
      const isPb = /PB/i.test(String(p.supplier || ""));
      const isExcluded = isPb || isInvoiceExcludedProduct(supplierKey, p.name);
      if (p.part === part && !isDcProduct(p.name) && getDangchakStyle(p.name) !== "full" && !catalogSet.has(p.name) && !isExcluded && !extraNames.includes(p.name)) extraNames.push(p.name);
    });
    names = [...catalogNames, ...extraNames];
  }
  const items = names.map((name) => {
    const p = byName.get(name) || null;
    return { name, packQty: (p && p.packQty) || INVOICE_KNOWN_PACK[name] || "", product: p };
  });
  const qtyOf = (it, code) => {
    const rr = it.product ? it.product.regionRows.find((r) => r.key === code) : null;
    if (!rr) return 0;
    const dk = getDangchakInfo(it.name);
    if (part === "당착") {
      if (!dk) return 0;
      if (!dangchakHasRegion(dk, code)) return 0; // 당착으로 지정된 지역만
      return rr.rawQty ?? rr.qty; // 당착 시트처럼 0고정 무시하고 원래 발주 수량
    }
    if (dk && dk.style === "full") return 0; // 전 지역 당착 상품은 당착 명세서에서만
    if (dk && dk.style === "combined" && dangchakHasRegion(dk, code)) return 0; // 당착 지역 몫은 1편·2편·DC에서 제외
    return rr.qty;
  };
  const regions = [];
  const sheetOrder = part === 1 ? INVOICE_SHEET_ORDER_1 : INVOICE_SHEET_ORDER_2;
  sheetOrder.forEach((code) => {
    if (!REGION_ORDER_MAP[code]) return;
    const rowItems = items.map((it) => ({ name: it.name, packQty: it.packQty, qty: qtyOf(it, code) }));
    const totalQty = rowItems.reduce((a, r) => a + r.qty, 0);
    // 실제로 뭐라도 나간(총수량 > 0) 지역만 명세서 발행
    if (totalQty > 0) regions.push({ code, shortName: REGION_ORDER_MAP[code].shortName, items: rowItems, totalQty });
  });
  return { items, regions, qtyOf };
}

// partFilter: 1 | 2 | "DC" | "당착"
function buildInvoiceRegionsForSupplier(products, supplierKey, partFilter) {
  return buildInvoiceDataForSupplier(products, supplierKey, partFilter).regions;
}

// ===== 거래명세서 엑셀 (영진베이커리 실물 명세서 0928 파일 기준: 병합·칸 너비·행 높이·글꼴·테두리 그대로) =====
const INV_FONT = "굴림체";
const INV_COLOR = { blue: { argb: "FF0000FF" }, red: { argb: "FFFF0000" }, black: { argb: "FF000000" } };
const INV_WHITE_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFFFF" } };
const INV_NF_ACCT = '_-* #,##0_-;\\-* #,##0_-;_-* "-"_-;_-@_-';
const INV_NF_AMOUNT = "#,##0_ ;[Red]\\-#,##0\\ ";
// 실물 파일의 열 너비를 픽셀로 환산한 값 (A~AJ, 그 뒤 열은 21px).
// 실물은 기본 글꼴이 돋움 11pt(숫자 1칸 = 9px)라 '2.33' 같은 숫자가 21px인데, 이 파일은 Calibri 11pt(숫자 1칸 = 7px) 기준으로 저장되므로
// 그냥 숫자를 옮기면 칸이 22%쯤 좁아져 글자가 잘린다 → 픽셀을 7로 나눈 값으로 넣어야 화면에서 똑같은 크기가 된다.
const INV_COL_PX = [21, 27, 27, 27, 21, 21, 21, 21, 21, 21, 21, 52, 13, 13, 13, 13, 21, 21, 21, 21, 15, 15, 15, 15, 15, 21, 21, 21, 21, 21, 21, 21, 21, 28, 21, 48];
const INV_COL_WIDTHS = INV_COL_PX.map((px) => px / 7);
const INV_DEFAULT_COL_WIDTH = 21 / 7;

function invDate(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)); // UTC 자정 = 엑셀 날짜 정수 (브라우저 시간대와 무관)
}

// 눈에 보이는 선 규격(INVOICE_EDGE_SPEC)을 상품 개수 n에 맞게 펼친다. H: 행 사이 가로선(n+16개), V: 행별 세로선(n+15개)
function invoiceEdgeChars(variant, n) {
  const S = INVOICE_EDGE_SPEC[variant];
  const H = [S.H.top, S.H.titleMid, S.H.titleInfo];
  for (let i = 0; i < 7; i++) H.push(S.H.info[i]);
  H.push(S.H.infoHeader);
  for (let j = 11; j <= 12 + n; j++) H.push(S.H.thin);
  H.push(S.H.totalFoot, S.H.footMid, S.H.bottom);
  const V = [S.V.title[0], S.V.title[1]];
  for (let i = 0; i < 8; i++) V.push(S.V.info[i]);
  V.push(S.V.header);
  for (let k = 0; k < n; k++) V.push(k === 0 ? S.V.itemFirst : S.V.item);
  V.push(S.V.item); // 상품 아래 빈 줄
  V.push(S.V.total, S.V.foot[0], S.V.foot[1]);
  return { H, V };
}

function invoiceRowHeights(n, variant) {
  const info = variant === "blue" ? [12, 12, 12, 12, 12, 12, 11.25, 11.25] : Array(8).fill(13.5);
  return [20.1, 20.1, ...info, 20.1, ...Array(n).fill(13.5), 13.5, 20.1, 17.25, 18.75];
}

function addStyledInvoiceSheet(workbook, region, supplierInfo, date, usedNames, part) {
  const info = REGION_ADDRESS_MAP[region.code] || {
    vvLabel: region.code, centerName: region.code, address: "(주소 미등록 - REGION_ADDRESS_MAP에 추가 필요)", sheetName: region.shortName || region.code,
  };
  const invoiceDate = part === 2 ? addDaysStr(date, 1) : date; // 1편=발주 당일, 2편=익일. DC·당착은 당일.
  const partLabel = invPartLabel(part);
  const ws = workbook.addWorksheet(safeSheetName(`${info.sheetName}(${partLabel})`, usedNames));
  ws.properties.defaultRowHeight = 13.5;
  ws.properties.defaultColWidth = INV_DEFAULT_COL_WIDTH;
  ws.columns = INV_COL_WIDTHS.map((w) => ({ width: w }));
  ws.pageSetup = {
    paperSize: 9,
    orientation: "portrait",
    fitToPage: true,
    fitToWidth: 1,
    fitToHeight: 1,
    horizontalCentered: true,
    margins: { left: 0.236, right: 0.236, top: 0.748, bottom: 0.748, header: 0.315, footer: 0.315 },
  };

  const n = region.items.length;
  const R = n + 15; // 한 부(공급받는자용 또는 공급자용)의 행 수

  function put(r, c, value, font, opts) {
    const o = opts || {};
    const cell = ws.getCell(r, c);
    if (value !== undefined && value !== null) cell.value = value;
    cell.font = font;
    cell.alignment = { horizontal: o.h, vertical: "middle", wrapText: !!o.wrap };
    if (o.nf) cell.numFmt = o.nf;
    return cell;
  }
  // 병합 칸마다 가장자리 테두리를 따로 줘야 하는데, 기본 mergeCells는 병합된 칸들이 스타일 객체를 하나로 공유해서
  // 가장자리별 테두리가 뭉개짐 → 스타일을 복사하지 않는 병합(mergeCellsWithoutStyle)을 쓴다.
  const mc = (r1, c1, r2, c2) => ws.mergeCellsWithoutStyle(r1, c1, r2, c2);

  function addCopy(T, variant, label) {
    const theme = INV_COLOR[variant];
    const black = INV_COLOR.black;
    const LBL = { name: INV_FONT, size: 9, color: theme };
    const BLK9 = { name: INV_FONT, size: 9, color: black };
    const BLK10 = { name: INV_FONT, size: 10, color: black };
    const BLK12B = { name: INV_FONT, size: 12, bold: true, color: black };

    invoiceRowHeights(n, variant).forEach((h, k) => {
      ws.getRow(T + k).height = h;
    });

    // 제목
    // 제목은 실물과 똑같이 글자마다 크기가 다른 서식 섞인 글: 큰 글자 사이 공백은 9pt라서 간격이 좁게 붙어 보이고, "(...보관용)"만 10pt
    const titleFont = (size, bold) => ({ name: INV_FONT, size, bold, color: theme, family: 3, charset: 129 });
    const titleRuns = [];
    "거래명세표".split("").forEach((ch) => {
      titleRuns.push({ text: ch, font: titleFont(20, true) }, { text: " ", font: titleFont(9, true) });
    });
    titleRuns.push({ text: `(${label})`, font: titleFont(10, false) });
    put(T, 2, { richText: titleRuns }, titleFont(20, true), { h: "center" });
    mc(T, 2, T + 1, 34);

    // 공급받는자 / 공급자 세로 라벨 (줄바꿈 문자로 한 글자씩 쌓음 - 실물과 동일)
    put(T + 2, 2, "공\n급\n받\n는\n자", LBL, { h: "center", wrap: true });
    mc(T + 2, 2, T + 9, 2);
    put(T + 2, 17, "공\n\n급\n\n자", LBL, { h: "center", wrap: true });
    mc(T + 2, 17, T + 9, 17);

    // 정보블록 4줄 (각 줄 = 2행 병합)
    let r = T + 2;
    put(r, 3, "등록번호", LBL, { h: "center", wrap: true }); mc(r, 3, r + 1, 6);
    put(r, 7, info.vvLabel, BLK9, { h: "center" }); mc(r, 7, r + 1, 16);
    put(r, 18, "등록번호", LBL, { h: "center" }); mc(r, 18, r + 1, 21);
    put(r, 22, supplierInfo.regNo, BLK12B, { h: "center" }); mc(r, 22, r + 1, 34);

    r = T + 4;
    put(r, 3, "상 호\n(법인명)", LBL, { h: "center", wrap: true }); mc(r, 3, r + 1, 6);
    put(r, 7, info.centerName, BLK10, { h: "center", wrap: true }); mc(r, 7, r + 1, 16);
    put(r, 18, "상  호\n(법인명)", LBL, { h: "center", wrap: true }); mc(r, 18, r + 1, 21);
    put(r, 22, supplierInfo.name, BLK9, { h: "center", wrap: true }); mc(r, 22, r + 1, 27);
    put(r, 28, "성 명", LBL, { h: "center" }); mc(r, 28, r + 1, 29);
    put(r, 30, supplierInfo.ceo, BLK10, { h: "center" }); mc(r, 30, r + 1, 34);

    r = T + 6;
    put(r, 3, "사업장\n주  소", LBL, { h: "center", wrap: true }); mc(r, 3, r + 1, 6);
    put(r, 7, info.address, BLK9, { h: "center", wrap: true }); mc(r, 7, r + 1, 16);
    put(r, 18, "사업장\n주  소", LBL, { h: "center", wrap: true }); mc(r, 18, r + 1, 21);
    put(r, 22, supplierInfo.address, BLK9, { h: "left", wrap: true }); mc(r, 22, r + 1, 34);

    r = T + 8;
    put(r, 3, "합계금액\n(VAT포함)", LBL, { h: "center", wrap: true }); mc(r, 3, r + 1, 6);
    put(r, 7, null, BLK12B, { h: "right", nf: INV_NF_AMOUNT }); mc(r, 7, r + 1, 16); // 단가 연동 전이라 공란
    put(r, 18, "업 태", LBL, { h: "center" }); mc(r, 18, r + 1, 21);
    put(r, 22, supplierInfo.bizType, BLK9, { h: "center", wrap: true }); mc(r, 22, r + 1, 27);
    put(r, 28, "종 목", LBL, { h: "center" }); mc(r, 28, r + 1, 29);
    put(r, 30, supplierInfo.bizItem, BLK10, { h: "center" }); mc(r, 30, r + 1, 34);

    // 품목 표 머리글
    const hr = T + 10;
    put(hr, 2, "년", LBL, { h: "center" });
    put(hr, 3, "월", LBL, { h: "center" });
    put(hr, 4, "일", LBL, { h: "center" });
    put(hr, 5, "품               목", LBL, { h: "center" }); mc(hr, 5, hr, 12);
    put(hr, 13, "입수", LBL, { h: "center" }); mc(hr, 13, hr, 17);
    put(hr, 18, "수량", LBL, { h: "center" }); mc(hr, 18, hr, 21);
    put(hr, 22, "비고", LBL, { h: "center" }); mc(hr, 22, hr, 34);

    // 품목 행 (+ 아래 빈 줄 1개)
    for (let k = 0; k <= n; k++) {
      const ir = T + 11 + k;
      const it = k < n ? region.items[k] : null;
      const hasQty = !!it && it.qty > 0;
      if (k === 0) {
        put(ir, 2, invDate(invoiceDate), BLK9, { h: "center", nf: "mm-dd-yy" });
        mc(ir, 2, ir, 4);
      }
      put(ir, 5, it ? displayNameOf(it.name) : null, BLK9, { h: "left", nf: INV_NF_ACCT }); mc(ir, 5, ir, 12);
      put(ir, 13, it ? it.packQty : null, BLK9, { h: "center" }); mc(ir, 13, ir, 17);
      put(ir, 18, it ? it.qty : null, BLK9, { nf: INV_NF_ACCT }); mc(ir, 18, ir, 21);
      // 비고(소비기한) = 이 편의 년월일 + 상품별 오프셋(PRODUCT_EXPIRY_DELTA). DC는 상품마다 달라서 아직 공란.
      const remark = hasQty && (part === 1 || part === 2 || expiryOverrideOf(it.name) != null) ? invDate(addDaysStr(invoiceDate, expiryDaysOf(it.name))) : null;
      put(ir, 22, remark, BLK9, { h: "center", nf: "mm-dd-yy" }); mc(ir, 22, ir, 34);
    }

    // 총수량
    const tr = T + 12 + n;
    put(tr, 2, "총수량", { name: INV_FONT, size: 9, bold: true, color: black }, { h: "center" }); mc(tr, 2, tr, 4);
    mc(tr, 5, tr, 12);
    mc(tr, 13, tr, 17);
    put(tr, 18, region.totalQty, { name: INV_FONT, size: 9, bold: true, color: black }, { nf: INV_NF_ACCT }); mc(tr, 18, tr, 21);
    mc(tr, 22, tr, 34);

    // 하단: 3자물류 담당자 / 받는 센터 주소
    const fr = T + 13 + n;
    put(fr, 2, THREE_PL_AGENT, LBL, { h: "center", wrap: true }); mc(fr, 2, fr + 1, 22);
    put(fr, 23, info.address, { name: INV_FONT, size: 8.5, color: theme }, { h: "center", wrap: true }); mc(fr, 23, fr + 1, 34);

    // 테두리: 실물에서 뽑은 "눈에 보이는 선" 규격 그대로 (색은 1부 파랑 / 2부 빨강)
    const { H, V } = invoiceEdgeChars(variant, n);
    const sty = (ch) => (ch === "M" ? { style: "medium", color: theme } : ch === "t" ? { style: "thin", color: theme } : undefined);
    const NC = 33;
    const b = Array.from({ length: R }, () => Array.from({ length: NC }, () => ({})));
    for (let j = 0; j <= R; j++) {
      for (let i = 0; i < NC; i++) {
        const s = sty(H[j][i]);
        if (!s) continue;
        if (j < R) b[j][i].top = s;
        if (j > 0) b[j - 1][i].bottom = s;
      }
    }
    for (let k = 0; k < R; k++) {
      for (let i = 0; i <= NC; i++) {
        const s = sty(V[k][i]);
        if (!s) continue;
        if (i < NC) b[k][i].left = s;
        if (i > 0) b[k][i - 1].right = s;
      }
    }
    for (let k = 0; k < R; k++) {
      for (let i = 0; i < NC; i++) {
        const cell = ws.getCell(T + k, 2 + i);
        cell.border = b[k][i];
        cell.fill = INV_WHITE_FILL;
      }
    }
  }

  ws.getRow(1).height = 14.25;
  addCopy(2, "blue", "공급받는자 보관용");
  // 두 부 사이 여백 2줄 (실물: 기본 높이 줄 + 14.25 줄, 둘 다 흰색)
  const gap1 = 2 + R;
  const gap2 = gap1 + 1;
  ws.getRow(gap2).height = 14.25;
  [gap1, gap2].forEach((gr) => {
    for (let c = 2; c <= 34; c++) ws.getCell(gr, c).fill = INV_WHITE_FILL;
  });
  addCopy(gap2 + 1, "red", "공급자 보관용");
}

// 맨 앞에 붙는 "N편발주량" 요약표 (실물 파일의 1편발주량/2편발주량 시트와 같은 모양: 지역 × 상품 수량)
function addInvoiceSummarySheet(workbook, data, date, part, usedNames) {
  const label = invPartLabel(part);
  const ws = workbook.addWorksheet(safeSheetName(`${label}발주량`, usedNames));
  const [, m, d] = date.split("-").map(Number);
  const hdrFont = { name: "맑은 고딕", size: 10, bold: true };
  const bodyFont = { name: "맑은 고딕", size: 10 };
  const thin = { style: "thin", color: { argb: "FFBFBFBF" } };
  const box = { top: thin, bottom: thin, left: thin, right: thin };

  ws.getCell(1, 1).value = `${m}/${d}`;
  ws.getCell(1, 1).font = hdrFont;
  ws.getCell(2, 1).value = "행 레이블";
  data.items.forEach((it, i) => {
    ws.getCell(2, 2 + i).value = displayNameOf(it.name);
  });
  const totalCol = 2 + data.items.length;
  for (let c = 1; c <= totalCol; c++) {
    const cell = ws.getCell(2, c);
    cell.font = hdrFont;
    cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
    cell.border = box;
  }
  ws.getRow(2).height = 42;

  const colTotals = data.items.map(() => 0);
  let r = 3;
  INVOICE_PIVOT_ORDER.forEach((code) => {
    const info = REGION_ADDRESS_MAP[code];
    if (!info) return;
    ws.getCell(r, 1).value = info.vvLabel;
    let rowTotal = 0;
    data.items.forEach((it, i) => {
      const q = data.qtyOf(it, code);
      rowTotal += q;
      colTotals[i] += q;
      if (q > 0) ws.getCell(r, 2 + i).value = q;
    });
    if (rowTotal > 0) ws.getCell(r, totalCol).value = rowTotal;
    for (let c = 1; c <= totalCol; c++) {
      const cell = ws.getCell(r, c);
      cell.font = bodyFont;
      cell.border = box;
      if (c > 1) cell.alignment = { horizontal: "center", vertical: "middle" };
    }
    r++;
  });
  ws.getCell(r, 1).value = "총합계";
  data.items.forEach((it, i) => {
    ws.getCell(r, 2 + i).value = colTotals[i];
  });
  ws.getCell(r, totalCol).value = colTotals.reduce((a, b) => a + b, 0);
  for (let c = 1; c <= totalCol; c++) {
    const cell = ws.getCell(r, c);
    cell.font = hdrFont;
    cell.border = box;
    if (c > 1) cell.alignment = { horizontal: "center", vertical: "middle" };
  }
  ws.getColumn(1).width = 34;
  for (let c = 2; c <= totalCol; c++) ws.getColumn(c).width = 16;
}

// 1편 또는 2편 또는 DC 하나만 골라서 거래명세서 파일 하나를 내려받는다. 그 편에 발주가 없으면 false를 반환(조용히 스킵용).
async function downloadSupplierInvoicePart(products, supplierKey, date, part, setBusy) {
  if (setBusy) setBusy(true);
  try {
    const info = getInvoiceInfo(supplierKey); // 사업자 정보가 없으면 상호만 넣고 나머지는 공란
    const data = buildInvoiceDataForSupplier(products, supplierKey, part);
    if (data.regions.length === 0) return false;
    const workbook = new ExcelJS.Workbook();
    const usedNames = new Set();
    addInvoiceSummarySheet(workbook, data, date, part, usedNames);
    data.regions.forEach((r) => addStyledInvoiceSheet(workbook, r, info, date, usedNames, part));
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const partLabel = invPartLabel(part);
    a.download = `${partLabel}_${supplierKey}_거래명세서_${date}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  } finally {
    if (setBusy) setBusy(false);
  }
}

/* ================= 품목별 검수표 (상품 → 지역별 수량 breakdown, 고정 순서/구역 기준) ================= */
// 화주사 기준표의 A/B 구역 그대로 사용 (임의 반분 없음). 기준표에 없는 지역은 "미지정"으로 맨 뒤에 붙음
function buildTableRowsForProduct(product) {
  if (!product) return [];
  const bd = (q) => (product.packQty > 0 ? { box: Math.floor(q / product.packQty), rem: q % product.packQty } : { box: 0, rem: q });
  const zoneOrder = ["A", "B", "미지정"];
  const out = [];
  zoneOrder.forEach((zone) => {
    const rows = product.regionRows.filter((r) => r.zone === zone);
    if (rows.length === 0) return;
    rows.forEach((r) => out.push({ type: "region", ...r, ...bd(r.qty) }));
    const zoneTotalQty = rows.reduce((a, r) => a + r.qty, 0);
    out.push({ type: "zoneTotal", label: zone === "미지정" ? "미지정 지역 합계" : `${zone}구역 합계`, qty: zoneTotalQty, ...bd(zoneTotalQty) });
  });
  return out;
}

// 품목별 검수표 1개 상품의 표 (단일 출력 / 전체 출력 모두에서 재사용)
function InspectionTable({ product, pageBreak }) {
  const rows = useMemo(() => buildTableRowsForProduct(product), [product]);
  return (
    <div style={pageBreak ? { pageBreakAfter: "always" } : undefined}>
      <div style={{ fontWeight: 700, fontSize: 15.5 }}>{product.displayName || product.name}</div>
      <div style={{ fontSize: 11.5, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace", marginBottom: 10 }}>
        {product.sku} · 입수 {product.packQty || "-"}
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>행 레이블 (납품처)</th>
              <th>센터명</th>
              <th>총수량</th>
              <th>박스</th>
              <th>낱개</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, idx) =>
              r.type === "zoneTotal" ? (
                <tr key={`zt-${idx}`} style={{ background: T.bg }}>
                  <td style={{ fontWeight: 700 }}>{r.label}</td>
                  <td></td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{r.qty}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{r.box}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{r.rem}</td>
                </tr>
              ) : (
                <tr key={r.key}>
                  <td style={{ fontWeight: 600 }}>{r.label}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkSoft }}>{r.shortName || "-"}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700 }}>{r.qty}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{r.box}</td>
                  <td style={{ fontFamily: "'JetBrains Mono', monospace" }}>{r.rem}</td>
                </tr>
              )
            )}
            <tr style={{ background: T.steel }}>
              <td style={{ fontWeight: 700, color: "#fff" }}>총합계</td>
              <td></td>
              <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: "#fff" }}>{product.totalQty}</td>
              <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: "#fff" }}>
                {product.packQty > 0 ? Math.floor(product.totalQty / product.packQty) : 0}
              </td>
              <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: "#fff" }}>
                {product.packQty > 0 ? product.totalQty % product.packQty : product.totalQty}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div style={{ fontSize: 11, color: T.inkSoft, marginTop: 10 }}>
        * 지역 순서와 A/B 구역은 화주사가 제공한 고정 기준표를 그대로 사용합니다 (임의로 나누지 않음). 기준표에 없는 신규 지역은 "미지정"으로 맨 뒤에 표시됩니다.
      </div>
    </div>
  );
}

// 엑셀 다운로드와 완전히 동일한 계산(체크포인트, 대분/소분)을 그대로 반영한 데이터 빌더
function buildFullInspectionData(product) {
  const pack = product.packQty || 0;
  const bd = (q) => (pack > 0 ? { box: Math.floor(q / pack), rem: q % pack } : { box: 0, rem: q });
  const flat = [];
  ["A", "B", "미지정"].forEach((zone) => {
    product.regionRows.filter((r) => r.zone === zone).forEach((r) => flat.push({ ...r, zone }));
  });
  const remAfter = new Array(flat.length + 1).fill(0);
  for (let i = flat.length - 1; i >= 0; i--) remAfter[i] = remAfter[i + 1] + bd(flat[i].qty).rem;

  let bandIndex = 0;
  const zones = [];
  ["A", "B", "미지정"].forEach((zone) => {
    const rows = product.regionRows.filter((r) => r.zone === zone);
    if (rows.length === 0) return;
    const zoneRows = rows.map((r) => {
      const flatIdx = flat.findIndex((f) => f.key === r.key && f.zone === zone);
      const { box, rem } = bd(r.qty);
      const isGray = bandIndex % 2 === 0;
      bandIndex++;
      let checkpoint = null;
      if (pack > 0 && r.checkpoint && flatIdx < flat.length - 1) {
        const remainingRem = remAfter[flatIdx + 1];
        const cpBox = Math.floor(remainingRem / pack);
        checkpoint = { box: cpBox, rem: remainingRem - cpBox * pack };
      }
      return { ...r, box, rem, isGray, checkpoint };
    });
    const zoneTotalQty = rows.reduce((a, r) => a + r.qty, 0);
    zones.push({ zone, rows: zoneRows, total: { qty: zoneTotalQty, ...bd(zoneTotalQty) } });
  });

  const grand = bd(product.totalQty);
  const totalBoxSum = flat.reduce((a, r) => a + bd(r.qty).box, 0);
  const totalRemSum = flat.reduce((a, r) => a + bd(r.qty).rem, 0);
  const subBox = pack > 0 ? Math.floor(totalRemSum / pack) : 0;
  const subRem = totalRemSum - subBox * pack;

  return { zones, grand, totalBoxSum, totalRemSum, sub: { box: subBox, rem: subRem } };
}

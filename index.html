// 발주번호는 무시하고, 상품(SKU) 기준으로 지역(납품처)별 수량을 집계 (특정 날짜 하나만).
// 피킹지시서 출력과 거래명세서 생성이 공통으로 쓰는 핵심 집계 함수.
// 특정 공급사의 특정 지역은 피킹지시서/명세서 수량을 항상 0으로 고정 (오배송·과잉피킹 방지용 화주사 요청).
// 예: 탭스푸드는 신제주(VV92)로 실제 출고하지 않으니, 발주파일에 수량이 찍혀와도 0으로 덮어씀.
const PICKING_QTY_ZERO_OVERRIDES = [
  { supplierKey: "탭스", regionCode: "VV92" }, // 탭스 - 신제주
  // 네고(참맛나라/맛요일/효성/h2 글로벌) - 김해/김해2/진주/CVS/경산/경산2/경산3
  // 김해/김해2/진주/CVS/경산/경산2/경산3/청주 (청주는 당착 오전현장으로 빠지는 참맛나라·맛요일·h2 글로벌만)
  ...["참맛나라", "맛요일", "h2 글로벌"].flatMap((s) => ["VV57", "VV58", "VV25", "VV20", "VV83", "VV84", "VV97", "VV34"].map((r) => ({ supplierKey: s, regionCode: r }))),
  // 효성앤에프(네고)는 당착이 아니라 청주를 평소대로 내보낸다 (2026-10-06 현장 요청: 피킹지에서 청주가 계속 빠져 있었음)
  ...["VV57", "VV58", "VV25", "VV20", "VV83", "VV84", "VV97"].map((r) => ({ supplierKey: "효성", regionCode: r })),
];
function isQtyZeroOverride(supplierKey, regionCode) {
  return PICKING_QTY_ZERO_OVERRIDES.some((o) => o.supplierKey === supplierKey && o.regionCode === regionCode);
}

// 공급사 전체가 아니라 "이 상품들만" 특정 지역 수량을 0으로 고정 (예: 대광 DC 상품 중 일부만 제외 요청).
const PICKING_QTY_ZERO_BY_NAME = [
  ...["대광)미니파베초콜릿(밀크맛)60G", "대광)옛날맛순대500G", "대광)파베초콜릿100G", "즉석피자)파마산치즈(증정용)", "즉석피자)핫소스4G(증정용)"].flatMap((name) =>
    ["VV57", "VV58", "VV25", "VV20", "VV83", "VV84", "VV97"].map((r) => ({ name, regionCode: r }))
  ),
];
function isQtyZeroByName(name, regionCode) {
  // 당착(오전현장)으로 따로 빠지는 지역은 평소 피킹지시서에서도 0으로 고정 (중복 집계 방지) - 상품마스터에서 바꾼 당착 분류도 그대로 따름
  const dk = getDangchakInfo(name);
  if (dk && dk.style === "combined" && dangchakHasRegion(dk, regionCode)) return true;
  return PICKING_QTY_ZERO_BY_NAME.some((o) => o.name === name && o.regionCode === regionCode);
}

function buildProductsForDate(orders, activeDate) {
  const bySku = {};
  // 발주파일에 업로드된 순서(seq) 그대로 처리 - 화면에 뜨는 상품 순서가 파일 순서와 같아지도록 함
  const ordered = [...orders].sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));

  // 지역코드 -> 정식 매장명(발주파일에 실제로 찍혀온 이름). 이 상품엔 발주가 0건이라도
  // 다른 상품이 같은 지역으로 나갔다면 그 이름을 그대로 재사용한다.
  const regionLabelMap = {};
  orders.forEach((o) => {
    const regionKey = o.storeCode || o.customer;
    if (!regionKey || regionLabelMap[regionKey]) return;
    regionLabelMap[regionKey] = o.storeCode ? `${o.storeCode} ${o.customer}` : o.customer;
  });

  ordered.forEach((o) => {
    if (activeDate && o.createdAt !== activeDate) return; // 다른 날짜 발주는 제외
    const regionKey = o.storeCode || o.customer;
    const ref = REGION_ORDER_MAP[regionKey];
    const regionLabel = o.storeCode ? `${o.storeCode} ${o.customer}` : o.customer;
    const supplierKey = supplierGroupKey(o.supplier);
    o.lines.forEach((l) => {
      // 할당(할당완료/미할당) 시스템은 화면에서 뺐으니, 피킹지시서·거래명세서도 할당수량이 아니라
      // 발주 수량(수정된 값이 있으면 그 값)을 그대로 쓴다 - 할당 상태 때문에 수량이 안 보이는 일이 없도록.
      const qty = Number(l.changedQty ?? l.qty) || 0;
      if (qty <= 0) return;
      // 이 상품이 DC 상품이면 DC 공급사 기준으로, 아니면 발주서 공급사 기준으로 0고정 여부를 판단 (상품마다 다를 수 있음)
      const zeroKey = dcVendorKey(l.name) || supplierKey;
      const zeroed = regionKey && (isQtyZeroOverride(zeroKey, regionKey) || isQtyZeroByName(l.name, regionKey));
      if (!bySku[l.sku]) bySku[l.sku] = { sku: l.sku, name: l.name, packQty: l.packQty, supplier: o.supplier || "", regions: {} };
      if (!bySku[l.sku].regions[regionKey]) {
        bySku[l.sku].regions[regionKey] = {
          key: regionKey,
          label: regionLabel,
          shortName: ref ? ref.shortName : null,
          zone: ref ? ref.zone : "미지정",
          order: ref ? ref.order : 9999,
          checkpoint: ref ? ref.checkpoint : false,
          qty: 0,
          rawQty: 0, // 0고정 규칙 적용 전의 실제 발주 수량 (당착 피킹지처럼 그 규칙과 무관하게 원본 수량이 필요한 곳에서 사용)
        };
      }
      bySku[l.sku].regions[regionKey].rawQty += qty;
      if (!zeroed) bySku[l.sku].regions[regionKey].qty += qty;
    });
  });
  // 상품 순서: 공급사별로 묶고, 그 안에서는 "같은 상품의 1편 바로 옆에 2편"이 오도록 묶는다.
  // (예전엔 1편 전체 -> 2편 전체로 나뉘어 있어서 "1편끼리, 2편끼리 뭉쳐 나온다"는 요청이 있었음)
  // 묶는 기준은 상품명 끝의 편 표시를 뗀 "기본 이름"이고, 그 기본 이름이 처음 등장한 순서(=업로드 순서)를 그대로 쓴다.
  const baseNameOf = (name) => String(name || "").replace(/(\d)\s*편?\s*$/, "").trim();
  const groupOrder = new Map();
  return Object.values(bySku)
    .map((p) => {
      // 1편(편 표시 없는 상품 포함)과 2편은 지역 순서·A/B구역·체크포인트가 다르다 (실물 1편/2편 피킹지 기준)
      const isPart2 = detectPart(p.name) === 2;
      const table = isPart2 ? REGION_ORDER_TABLE_2 : REGION_ORDER_TABLE;
      const orderMap = isPart2 ? REGION_ORDER_MAP_2 : REGION_ORDER_MAP;
      Object.values(p.regions).forEach((reg) => {
        const ref2 = orderMap[reg.key];
        if (!ref2) return;
        reg.zone = ref2.zone;
        reg.order = ref2.order;
        reg.checkpoint = ref2.checkpoint;
      });
      // 오피킹 방지 고정 지역표(A/B구역 37곳)는 이 상품에 발주가 없어도 항상 0으로 표시
      table.forEach((r) => {
        if (p.regions[r.code]) return;
        p.regions[r.code] = {
          key: r.code,
          label: regionLabelMap[r.code] || `${r.code} ${r.name}`,
          shortName: r.name,
          zone: r.zone,
          order: orderMap[r.code].order,
          checkpoint: !!r.checkpoint,
          qty: 0,
        };
      });
      const regionRows = Object.values(p.regions).sort((a, b) => a.order - b.order || a.label.localeCompare(b.label));
      const totalQty = regionRows.reduce((a, r) => a + r.qty, 0);
      const packOv = packQtyOverrideOf(p.name); // 상품마스터에서 바꾼 입수가 있으면 그 값 (박스/낱개/체크포인트 전부 이 값으로 계산)
      return { ...p, packQty: packOv ?? p.packQty, displayName: displayNameOf(p.name), regionRows, totalQty, part: detectPart(p.name), baseName: baseNameOf(p.name) };
    })
    .map((p) => {
      const key = supplierGroupKey(p.supplier) + "||" + p.baseName;
      if (!groupOrder.has(key)) groupOrder.set(key, groupOrder.size);
      return { ...p, groupSeq: groupOrder.get(key) };
    })
    // 공급사(고객사) 순서: 화주사가 지정한 고정 순서 - 그 안에서는 평소 상품(영문 먼저+가나다순)이 먼저 나오고
    // 당착(현장출고) 상품은 그 공급사 맨 끝으로 몰아서 나온다. 당착끼리는 상품명 가나다순.
    .sort(
      (a, b) =>
        pickingSupplierPriority(pickingSupplierKey(a.supplier)) - pickingSupplierPriority(pickingSupplierKey(b.supplier)) ||
        pickingSupplierKey(a.supplier).localeCompare(pickingSupplierKey(b.supplier), "ko") ||
        isDangchakProduct(a.name) - isDangchakProduct(b.name) ||
        pickingProductCompare(pickingSupplierKey(a.supplier), a.baseName, b.baseName) ||
        a.part - b.part
    );
}

/* ================= 피킹지 순서 설정 (전산팀용, 피킹지시서 출력 화면의 설정 버튼으로 열림) ================= */
// 공급사(시트) 순서와, 공급사 안에서의 상품 순서를 화면에서 직접 바꿔 저장한다. 저장하면 피킹지시서 화면·엑셀에 바로 반영된다.
function PickingOrderSettings({ orders, authToken, config, onSaved, embedded, initialDate, onDirtyChange }) {
  const [draft, setDraft] = useState(() => ({ suppliers: config.suppliers, products: { ...config.products } }));
  const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [selDate, setSelDate] = useState(initialDate || null);
  useEffect(() => {
    if (onDirtyChange) onDirtyChange(dirty);
  }, [dirty]);
  const [selSupplier, setSelSupplier] = useState(null);

  // 서버에서 저장값을 새로 불러오거나 저장이 끝나면 초안도 그 값으로 맞춘다
  useEffect(() => {
    setDraft({ suppliers: config.suppliers, products: { ...config.products } });
    setDirty(false);
  }, [config]);

  const dates = useMemo(() => Array.from(new Set(orders.map((o) => o.createdAt))).sort().reverse(), [orders]);
  const activeDate = selDate && dates.includes(selDate) ? selDate : dates[0] || null;
  const dayProducts = useMemo(() => buildProductsForDate(orders, activeDate), [orders, activeDate, config]);

  const baseList = draft.suppliers || SUPPLIER_PICKING_ORDER;
  const detectedSuppliers = useMemo(() => Array.from(new Set(dayProducts.map((p) => pickingSupplierKey(p.supplier)))), [dayProducts]);
  const extra = detectedSuppliers.filter((k) => !baseList.includes(k)); // 순서표에 없던 공급사는 맨 뒤에 붙여서 보여줌
  const supplierList = [...baseList, ...extra];

  function updateSuppliers(list) {
    setDraft((d) => ({ ...d, suppliers: list }));
    setDirty(true);
  }
  function moveSupplier(from, to) {
    if (to < 0 || to >= supplierList.length || from === to) return;
    const list = [...supplierList];
    const [item] = list.splice(from, 1);
    list.splice(to, 0, item);
    updateSuppliers(list);
  }

  // 상품 순서 편집 대상 공급사 (기본: 이 날짜에 발주가 있는 첫 공급사)
  const productSupplier = selSupplier && supplierList.includes(selSupplier) ? selSupplier : supplierList.find((k) => detectedSuppliers.includes(k)) || supplierList[0];
  const detectedNames = useMemo(() => {
    const out = [];
    dayProducts.filter((p) => pickingSupplierKey(p.supplier) === productSupplier).forEach((p) => {
      if (!out.includes(p.baseName)) out.push(p.baseName);
    });
    return out;
  }, [dayProducts, productSupplier]);
  const savedNames = draft.products[productSupplier];
  const productNames = savedNames && savedNames.length ? [...savedNames, ...detectedNames.filter((n) => !savedNames.includes(n))] : detectedNames;

  function updateProducts(list) {
    setDraft((d) => ({ ...d, products: { ...d.products, [productSupplier]: list } }));
    setDirty(true);
  }
  function moveProduct(from, to) {
    if (to < 0 || to >= productNames.length || from === to) return;
    const list = [...productNames];
    const [item] = list.splice(from, 1);
    list.splice(to, 0, item);
    updateProducts(list);
  }

  async function save() {
    const value = { suppliers: draft.suppliers, products: draft.products };
    setBusy(true);
    setMsg("");
    try {
      await apiFetch("/settings/picking_order", authToken, { method: "PUT", body: { value } });
      onSaved(value);
      setMsg("저장했어요. 피킹지시서 화면과 엑셀에 바로 반영돼요.");
    } catch (e) {
      try {
        localStorage.setItem("wms-picking-order", JSON.stringify(value));
      } catch (e2) {
        /* 무시 */
      }
      onSaved(value);
      setMsg(`서버에 저장하지 못해 이 브라우저에만 임시 저장했어요 (${e.message})`);
    } finally {
      setBusy(false);
    }
  }

  const rowBtn = { ...smallBtnStyle, padding: "3px 9px", minWidth: 30, justifyContent: "center" };
  return (
    <div>
      {!embedded && <PageHeader title="피킹지 순서 설정" sub="피킹지시서(시트)에 나오는 공급사 순서와, 공급사 안의 상품 순서를 직접 정해요. 저장하면 바로 반영돼요." />}

      <div style={{ ...cardStyle, marginBottom: 14, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <button onClick={save} disabled={busy || !dirty} className="primary-btn" style={{ ...primaryBtnStyle, opacity: busy || !dirty ? 0.55 : 1 }}>
          {busy ? "저장 중..." : dirty ? "변경 내용 저장" : "저장할 변경 없음"}
        </button>
        <button
          onClick={() => {
            setDraft({ suppliers: null, products: {} });
            setDirty(true);
          }}
          style={smallBtnStyle}
        >
          전부 기본 순서로 되돌리기
        </button>
        <span style={{ fontSize: 12.5, color: T.inkSoft }}>
          {dirty ? "저장 전 변경이 있어요." : ""} 아래 목록은 {activeDate ? fmtDate(activeDate) : "-"} 발주 기준으로 발주가 있는 공급사·상품을 표시해요.
        </span>
        <select style={{ ...inputStyle, marginLeft: "auto" }} value={activeDate || ""} onChange={(e) => setSelDate(e.target.value)}>
          {dates.length === 0 && <option value="">발주 없음</option>}
          {dates.map((d) => (
            <option key={d} value={d}>
              {fmtDate(d)}
            </option>
          ))}
        </select>
      </div>
      {msg && <div style={{ marginBottom: 12, fontSize: 12.5, fontWeight: 600, color: msg.startsWith("저장했어요") ? T.teal : T.danger }}>{msg}</div>}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(380px, 1fr))", gap: 16, alignItems: "start" }}>
        <div style={cardStyle}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>1. 공급사(시트) 순서</div>
          <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 10 }}>위에 있을수록 먼저 나와요. ▲▼로 한 칸씩, 번호 칸으로 원하는 자리로 옮겨요.</div>
          {supplierList.map((k, i) => {
            const has = detectedSuppliers.includes(k);
            const isExtra = extra.includes(k);
            return (
              <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: `1px solid ${T.border}` }}>
                <select style={{ ...inputStyle, padding: "3px 4px", width: 62, fontSize: 12.5 }} value={i + 1} onChange={(e) => moveSupplier(i, Number(e.target.value) - 1)}>
                  {supplierList.map((_, n) => (
                    <option key={n} value={n + 1}>
                      {n + 1}
                    </option>
                  ))}
                </select>
                <span style={{ flex: 1, fontSize: 13.5, fontWeight: has ? 700 : 500, color: has ? T.ink : T.inkSoft }}>
                  {k}
                  {isExtra && <span style={{ marginLeft: 6, fontSize: 11, color: T.clay, fontWeight: 600 }}>순서표에 없던 공급사</span>}
                  {has && !isExtra && <span style={{ marginLeft: 6, fontSize: 11, color: T.teal, fontWeight: 600 }}>발주 있음</span>}
                </span>
                <button style={rowBtn} onClick={() => moveSupplier(i, i - 1)} disabled={i === 0} title="위로">
                  ▲
                </button>
                <button style={rowBtn} onClick={() => moveSupplier(i, i + 1)} disabled={i === supplierList.length - 1} title="아래로">
                  ▼
                </button>
              </div>
            );
          })}
        </div>

        <div style={cardStyle}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>2. 공급사 안의 상품 순서</div>
          <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 10 }}>
            따로 정하지 않은 공급사는 영문→가나다순이에요. 당착 상품은 항상 그 공급사 맨 끝에 나와요. 1편·2편은 같은 상품끼리 붙어서 나가요.
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
            <select style={{ ...inputStyle, flex: 1, minWidth: 180 }} value={productSupplier || ""} onChange={(e) => setSelSupplier(e.target.value)}>
              {supplierList.map((k) => (
                <option key={k} value={k}>
                  {k}
                  {detectedSuppliers.includes(k) ? "" : " (이 날짜 발주 없음)"}
                </option>
              ))}
            </select>
            <button
              style={smallBtnStyle}
              onClick={() => {
                setDraft((d) => {
                  const next = { ...d.products };
                  delete next[productSupplier];
                  return { ...d, products: next };
                });
                setDirty(true);
              }}
            >
              이 공급사 가나다순으로
            </button>
          </div>
          {productNames.length === 0 && <div style={{ fontSize: 12.5, color: T.inkSoft, padding: "14px 0" }}>이 날짜엔 이 공급사의 상품 발주가 없어요. 다른 날짜를 고르거나 다른 공급사를 선택해 주세요.</div>}
          {productNames.map((n, i) => {
            const today = detectedNames.includes(n);
            return (
              <div key={n} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: `1px solid ${T.border}` }}>
                <span style={{ width: 28, fontSize: 12, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{i + 1}</span>
                <span style={{ flex: 1, fontSize: 13.5, fontWeight: today ? 600 : 500, color: today ? T.ink : T.inkSoft }}>
                  {n}
                  {!today && <span style={{ marginLeft: 6, fontSize: 11 }}>(이 날짜 발주 없음)</span>}
                </span>
                <button style={rowBtn} onClick={() => moveProduct(i, 0)} disabled={i === 0} title="맨 위로">
                  ⤒
                </button>
                <button style={rowBtn} onClick={() => moveProduct(i, i - 1)} disabled={i === 0} title="위로">
                  ▲
                </button>
                <button style={rowBtn} onClick={() => moveProduct(i, i + 1)} disabled={i === productNames.length - 1} title="아래로">
                  ▼
                </button>
                <button style={rowBtn} onClick={() => moveProduct(i, productNames.length - 1)} disabled={i === productNames.length - 1} title="맨 아래로">
                  ⤓
                </button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// 피킹지시서 출력 화면 오른쪽 위 "순서 설정" 버튼으로 여는 창. 저장하지 않은 변경이 있으면 닫기 전에 확인한다.
function PickingOrderSettingsModal({ onClose, ...rest }) {
  const dirtyRef = useRef(false);
  function tryClose() {
    if (dirtyRef.current && !window.confirm("저장하지 않은 변경이 있어요. 저장하지 않고 닫을까요?")) return;
    onClose();
  }
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") tryClose();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return createPortal(
    <div onClick={tryClose} style={{ position: "fixed", inset: 0, background: "rgba(27,29,26,0.45)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16, fontFamily: "'IBM Plex Sans KR', sans-serif", color: T.ink }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: T.bg || T.surface, borderRadius: 12, width: "100%", maxWidth: 1180, maxHeight: "92vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ display: "flex", alignItems: "center", padding: "16px 20px", borderBottom: `1px solid ${T.border}`, background: T.surface }}>
          <div>
            <div style={{ fontSize: 15, fontWeight: 700 }}>피킹지 순서 설정</div>
            <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 2 }}>피킹지시서(시트)에 나오는 공급사 순서와, 공급사 안의 상품 순서를 정해요. 저장하면 바로 반영돼요.</div>
          </div>
          <button onClick={tryClose} title="닫기" style={{ marginLeft: "auto", border: "none", background: "transparent", cursor: "pointer", color: T.inkSoft }}>
            <X size={18} />
          </button>
        </div>
        <div style={{ overflowY: "auto", padding: "16px 20px 20px" }}>
          <PickingOrderSettings {...rest} embedded onDirtyChange={(d) => (dirtyRef.current = d)} />
        </div>
      </div>
    </div>,
    document.body
  );
}

function PickingInspection({ orders, orderCfg, productInfo, authToken, onOrderCfgSaved }) {
  const [selectedSku, setSelectedSku] = useState(null);
  const [showOrderSet, setShowOrderSet] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [printMode, setPrintMode] = useState(null); // null | "single" | "all"
  const [supplierFilter, setSupplierFilter] = useState("all");
  const [searchQuery, setSearchQuery] = useState("");

  useEffect(() => {
    if (!printMode) return;
    document.body.classList.add("portal-printing");
    const timer = setTimeout(() => window.print(), 150);
    const onAfterPrint = () => {
      document.body.classList.remove("portal-printing");
      setPrintMode(null);
    };
    window.addEventListener("afterprint", onAfterPrint);
    return () => {
      clearTimeout(timer);
      window.removeEventListener("afterprint", onAfterPrint);
      document.body.classList.remove("portal-printing");
    };
  }, [printMode]);

  // 피킹은 날짜 단위 작업이므로, 날짜를 하나 선택해서 그 날짜의 발주만 집계
  const dateOptions = useMemo(() => {
    const set = new Set(orders.map((o) => o.createdAt));
    return Array.from(set).sort((a, b) => (a < b ? 1 : -1));
  }, [orders]);
  const [selectedDate, setSelectedDate] = useState(null);
  const activeDate = selectedDate && dateOptions.includes(selectedDate) ? selectedDate : dateOptions[0] || null;

  const products = useMemo(() => buildProductsForDate(orders, activeDate), [orders, activeDate, orderCfg, productInfo]);


  // 필터 드롭다운에 뿌릴 공급사 목록 (이 날짜에 실제로 존재하는 공급사만, 같은 회사는 하나로 묶어서, 고정 순서표 순으로)
  const supplierOptions = useMemo(() => {
    const set = new Set(products.map((p) => supplierGroupKey(p.supplier)));
    return Array.from(set).sort((a, b) => supplierPriority(a) - supplierPriority(b) || a.localeCompare(b));
  }, [products]);

  // 공급사 선택 + 상품명/코드 검색어로 좌측 목록을 좁힘. 이 결과가 그대로 엑셀 일괄 다운로드 대상이 됨.
  const filteredProducts = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return products.filter((p) => {
      if (supplierFilter !== "all" && supplierGroupKey(p.supplier) !== supplierFilter) return false;
      if (q && !p.name.toLowerCase().includes(q) && !String(p.sku).toLowerCase().includes(q)) return false;
      return true;
    });
  }, [products, supplierFilter, searchQuery]);

  const selected = products.find((p) => p.sku === selectedSku) || filteredProducts[0] || products[0] || null;

  return (
    <div>
      <PageHeader
        title="피킹지시서 출력"
        sub="발주번호와 상관없이, 상품 하나를 기준으로 화주사 지정 순서·A/B구역대로 지역별 수량을 정리합니다"
        action={
          <button className="no-print" onClick={() => setShowOrderSet(true)} style={{ ...smallBtnStyle, display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 13px", fontSize: 13 }} title="공급사·상품 순서 설정">
            <SettingsGear size={15} />
            순서 설정
          </button>
        }
      />
      {showOrderSet && (
        <PickingOrderSettingsModal orders={orders} authToken={authToken} config={orderCfg} onSaved={onOrderCfgSaved} initialDate={activeDate} onClose={() => setShowOrderSet(false)} />
      )}
      {dateOptions.length === 0 ? (
        <div style={cardStyle}>
          <EmptyRow text="할당된 품목이 없습니다. 먼저 발주파일을 업로드해주세요." />
        </div>
      ) : (
        <>
          <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: T.inkSoft }}>피킹 날짜</span>
            <select style={{ ...inputStyle, width: 200 }} value={activeDate || ""} onChange={(e) => { setSelectedDate(e.target.value); setSelectedSku(null); }}>
              {dateOptions.map((d) => (
                <option key={d} value={d}>
                  {fmtDate(d)}
                </option>
              ))}
            </select>
            <span style={{ fontSize: 12, color: T.inkSoft }}>※ 선택한 날짜의 발주만 집계합니다 (다른 날짜와 섞이지 않음)</span>
          </div>
          {products.length === 0 ? (
            <div style={cardStyle}>
              <EmptyRow text="이 날짜에 할당된 품목이 없습니다." />
            </div>
          ) : (
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-start" }}>
              <div className="no-print" style={{ flex: "1 1 260px" }}>
                <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                  <button
                    onClick={() =>
                      downloadStyledInspectionExcel(
                        filteredProducts,
                        `피킹지시서_${activeDate}${supplierFilter !== "all" ? `_${supplierFilter.replace(/[\\/:*?"<>|]/g, "")}` : ""}.xlsx`,
                        setExporting,
                        activeDate,
                        selected?.sku
                      )
                    }
                    disabled={exporting || filteredProducts.length === 0}
                    className="primary-btn"
                    style={{ ...primaryBtnStyle, flex: 1, justifyContent: "center", opacity: exporting || filteredProducts.length === 0 ? 0.7 : 1 }}
                  >
                    <Download size={15} />{" "}
                    {exporting
                      ? "생성 중..."
                      : supplierFilter !== "all" || searchQuery
                      ? `필터 결과만 엑셀 (${filteredProducts.length}개 시트)`
                      : `엑셀 (${products.length}개 시트)`}
                  </button>
                  <button
                    disabled
                    title="인쇄/PDF 디자인을 다듬는 중이에요. 지금은 엑셀 다운로드를 이용해주세요."
                    className="ghost-btn"
                    style={{ ...smallBtnStyle, flex: 1, justifyContent: "center", opacity: 0.5, cursor: "not-allowed" }}
                  >
                    🚧 전체 출력 (공사중)
                  </button>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                  <select
                    style={{ ...inputStyle, width: "100%" }}
                    value={supplierFilter}
                    onChange={(e) => setSupplierFilter(e.target.value)}
                  >
                    <option value="all">전체 공급사 ({products.length})</option>
                    {supplierOptions.map((s) => (
                      <option key={s} value={s}>
                        {s} ({products.filter((p) => supplierGroupKey(p.supplier) === s).length})
                      </option>
                    ))}
                  </select>
                  <div style={{ position: "relative" }}>
                    <Search size={14} style={{ position: "absolute", left: 9, top: 10, color: T.inkSoft }} />
                    <input
                      style={{ ...inputStyle, width: "100%", paddingLeft: 28 }}
                      placeholder="상품명 또는 상품코드 검색"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                  {(supplierFilter !== "all" || searchQuery) && (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, color: T.inkSoft }}>
                      <span>{filteredProducts.length}개 표시 중</span>
                      <button
                        onClick={() => { setSupplierFilter("all"); setSearchQuery(""); }}
                        className="ghost-btn"
                        style={{ border: "none", background: "none", padding: "2px 4px", fontSize: 12, color: T.inkSoft, cursor: "pointer", textDecoration: "underline" }}
                      >
                        필터 초기화
                      </button>
                    </div>
                  )}
                </div>
                <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden", maxHeight: 480, overflowY: "auto" }}>
                  {filteredProducts.length === 0 ? (
                    <EmptyRow text="조건에 맞는 상품이 없습니다." />
                  ) : (
                  filteredProducts.map((p) => (
                    <button
                      key={p.sku}
                      onClick={() => setSelectedSku(p.sku)}
                      className="rowhover"
                      style={{
                        display: "block", width: "100%", textAlign: "left", padding: "11px 14px", border: "none",
                        background: selected && selected.sku === p.sku ? T.bg : "transparent", borderBottom: `1px solid #EEECE3`, cursor: "pointer", fontFamily: "inherit",
                      }}
                    >
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span
                          style={{
                            fontSize: 10, fontWeight: 700, padding: "1px 6px", borderRadius: 4,
                            background: p.part === 2 ? "#FCF1DD" : "#E7F4EF", color: p.part === 2 ? T.amberDeep : T.tealDeep,
                          }}
                        >
                          {p.part}편
                        </span>
                        <div style={{ fontSize: 13, fontWeight: 600 }}>{p.displayName || p.name}</div>
                      </div>
                      <div style={{ fontSize: 11, color: T.inkSoft, fontFamily: "'JetBrains Mono', monospace", marginTop: 2 }}>
                        {p.supplier ? `${p.supplier} · ` : ""}{p.sku} · {p.regionRows.length}개 지역 · 총 {p.totalQty}개
                      </div>
                    </button>
                  ))
                  )}
                </div>
              </div>

              <div style={{ flex: "2 1 460px" }}>
                {selected && (
                  <div style={cardStyle}>
                    <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 6 }}>
                      <button
                        disabled
                        title="인쇄/PDF 디자인을 다듬는 중이에요. 지금은 엑셀 다운로드를 이용해주세요."
                        className="ghost-btn"
                        style={{ ...smallBtnStyle, opacity: 0.5, cursor: "not-allowed" }}
                      >
                        🚧 출력 (공사중)
                      </button>
                      <button
                        onClick={() => downloadStyledInspectionExcel([selected], `${selected.name}_${activeDate}.xlsx`, setExporting, activeDate)}
                        disabled={exporting}
                        className="ghost-btn"
                        style={{ ...smallBtnStyle, opacity: exporting ? 0.7 : 1 }}
                      >
                        <Download size={14} /> {exporting ? "생성 중..." : "엑셀 다운로드"}
                      </button>
                    </div>
                    <InspectionTable product={selected} />
                  </div>
                )}
              </div>
            </div>
          )}
          {printMode &&
            createPortal(
              <div className="print-portal">
                {printMode === "all"
                  ? products.map((p, idx) => <InspectionPrintSheet key={p.sku} product={p} pageBreak={idx < products.length - 1} date={activeDate} />)
                  : selected && <InspectionPrintSheet product={selected} date={activeDate} />}
              </div>,
              document.body
            )}
        </>
      )}
    </div>
  );
}

/* ================= 거래명세서 ================= */
function InvoiceView({ orders, productInfo }) {
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const invoiced = orders.filter((o) => o.invoiceIssued);
  const filtered = invoiced.filter((o) => !query || o.orderNo.toLowerCase().includes(query.toLowerCase()) || o.customer.includes(query));
  const selected = invoiced.find((o) => o.id === selectedId) || null;

  // 공급사별 거래명세서 일괄 생성 (사업자 정보가 SUPPLIER_INVOICE_INFO에 등록된 공급사만 가능 - 현재는 저스트그린)
  const dateOptions = useMemo(() => {
    const set = new Set(orders.map((o) => o.createdAt));
    return Array.from(set).sort((a, b) => (a < b ? 1 : -1));
  }, [orders]);
  const [invoiceDate, setInvoiceDate] = useState(null);
  const activeInvoiceDate = invoiceDate && dateOptions.includes(invoiceDate) ? invoiceDate : dateOptions[0] || null;
  const invoiceProducts = useMemo(() => buildProductsForDate(orders, activeInvoiceDate), [orders, activeInvoiceDate, productInfo]);
  const invoiceSupplierOptions = useMemo(() => {
    // 사업자 정보가 등록된 공급사만 (DC 공급사는 아래 "DC 거래명세서" 카드에서 따로)
    const set = new Set(invoiceProducts.map((p) => supplierGroupKey(p.supplier)));
    return Array.from(set)
      .filter((s) => SUPPLIER_INVOICE_INFO[s])
      .sort((a, b) => supplierPriority(a) - supplierPriority(b));
  }, [invoiceProducts]);
  const [invoiceSupplier, setInvoiceSupplier] = useState(null);
  const activeInvoiceSupplier = invoiceSupplierOptions.includes(invoiceSupplier) ? invoiceSupplier : invoiceSupplierOptions[0] || null;
  const [invoiceBusy, setInvoiceBusy] = useState(false);
  const [invoiceErr, setInvoiceErr] = useState("");
  const invoiceRegionsPart1 = useMemo(
    () => (activeInvoiceSupplier ? buildInvoiceRegionsForSupplier(invoiceProducts, activeInvoiceSupplier, 1) : []),
    [invoiceProducts, activeInvoiceSupplier]
  );
  const invoiceRegionsPart2 = useMemo(
    () => (activeInvoiceSupplier ? buildInvoiceRegionsForSupplier(invoiceProducts, activeInvoiceSupplier, 2) : []),
    [invoiceProducts, activeInvoiceSupplier]
  );
  const invoiceRegionsTotal = invoiceRegionsPart1.length + invoiceRegionsPart2.length;

  // ===== DC 거래명세서 (일반 1편/2편과 완전히 분리된 카드) =====
  const [dcDate, setDcDate] = useState(null);
  const activeDcDate = dcDate && dateOptions.includes(dcDate) ? dcDate : dateOptions[0] || null;
  const dcProducts = useMemo(() => buildProductsForDate(orders, activeDcDate), [orders, activeDcDate, productInfo]);
  const dcVendorOptions = useMemo(
    () =>
      DC_VENDOR_GROUPS.map((g) => ({ key: g.key, label: g.label, regions: buildInvoiceRegionsForSupplier(dcProducts, g.key, "DC") })).filter(
        (v) => v.regions.length > 0
      ),
    [dcProducts]
  );
  const [dcVendor, setDcVendor] = useState(null);
  const activeDcVendor = dcVendorOptions.some((v) => v.key === dcVendor) ? dcVendor : dcVendorOptions[0]?.key || null;
  const activeDcRegions = (dcVendorOptions.find((v) => v.key === activeDcVendor) || { regions: [] }).regions;
  const [dcBusy, setDcBusy] = useState(false);
  const [dcErr, setDcErr] = useState("");
  async function handleGenerateDc() {
    if (!activeDcDate || !activeDcVendor) return;
    setDcErr("");
    try {
      await downloadSupplierInvoicePart(dcProducts, activeDcVendor, activeDcDate, "DC", setDcBusy);
    } catch (e) {
      setDcErr(e.message);
    }
  }
  // ===== 당착 거래명세서 (DC와 같은 방식, 당착 상품만 따로 분류) =====
  const [dkDate, setDkDate] = useState(null);
  const activeDkDate = dkDate && dateOptions.includes(dkDate) ? dkDate : dateOptions[0] || null;
  const dkProducts = useMemo(() => buildProductsForDate(orders, activeDkDate), [orders, activeDkDate, productInfo]);
  const dkVendorOptions = useMemo(() => dangchakVendorOptions(dkProducts), [dkProducts]);
  const [dkVendor, setDkVendor] = useState(null);
  const activeDkVendor = dkVendorOptions.some((v) => v.key === dkVendor) ? dkVendor : dkVendorOptions[0]?.key || null;
  const activeDkRegions = (dkVendorOptions.find((v) => v.key === activeDkVendor) || { regions: [] }).regions;
  const [dkBusy, setDkBusy] = useState(false);
  const [dkErr, setDkErr] = useState("");
  async function handleGenerateDk() {
    if (!activeDkDate || !activeDkVendor) return;
    setDkErr("");
    try {
      await downloadSupplierInvoicePart(dkProducts, activeDkVendor, activeDkDate, "당착", setDkBusy);
    } catch (e) {
      setDkErr(e.message);
    }
  }
  // 소비기한 자료(카탈로그)에 없는 이 공급사 상품: 신제품은 명세서에 자동 추가되고, PB/TC 상품은 아예 제외됨
  const invoiceSkipped = useMemo(
    () => (activeInvoiceSupplier ? getInvoiceSkippedProducts(invoiceProducts, activeInvoiceSupplier) : { added: [], excluded: [] }),
    [invoiceProducts, activeInvoiceSupplier]
  );

  async function handleGenerateInvoicePart(part) {
    if (!activeInvoiceDate || !activeInvoiceSupplier) return;
    setInvoiceErr("");
    try {
      await downloadSupplierInvoicePart(invoiceProducts, activeInvoiceSupplier, activeInvoiceDate, part, setInvoiceBusy);
    } catch (e) {
      setInvoiceErr(e.message);
    }

  return (
    <div>
      <PageHeader title="거래명세서" sub="출고 완료된 발주의 거래명세서를 조회·출력합니다 (추후 자동 발행으로 고도화 예정)" />

      <div style={{ ...cardStyle, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>공급사별 거래명세서 일괄 생성</div>
        <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 14 }}>
          선택한 날짜에 그 공급사 상품을 받은 지역마다 거래명세서(공급받는자/공급자 보관용 2부)를 만들어요. 1편은 발주 당일, 2편은 익일 날짜로 나갑니다. 유통기한이 상품마다 다른 DC 취급 상품은 1편/2편에서 빠지고 아래 “DC 거래명세서” 카드에서 따로 받아요. 총수량은 피킹지시서와 항상 일치합니다.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <Field label="날짜">
            <select style={inputStyle} value={activeInvoiceDate || ""} onChange={(e) => setInvoiceDate(e.target.value)}>
              {dateOptions.length === 0 && <option value="">발주 없음</option>}
              {dateOptions.map((d) => (
                <option key={d} value={d}>
                  {fmtDate(d)}
                </option>
              ))}
            </select>
          </Field>
          <Field label="공급사">
            <select style={inputStyle} value={activeInvoiceSupplier || ""} onChange={(e) => setInvoiceSupplier(e.target.value)}>
              {invoiceSupplierOptions.length === 0 && <option value="">해당 없음</option>}
              {invoiceSupplierOptions.map((s) => (
                <option key={s} value={s}>
                  {s}
                </option>
              ))}
            </select>
          </Field>
          <button
            onClick={() => handleGenerateInvoicePart(1)}
            disabled={invoiceBusy || !activeInvoiceSupplier || invoiceRegionsPart1.length === 0}
            className="primary-btn"
            style={{ ...primaryBtnStyle, opacity: invoiceBusy || !activeInvoiceSupplier || invoiceRegionsPart1.length === 0 ? 0.6 : 1 }}
          >
            <Download size={15} /> {invoiceBusy ? "생성 중..." : `1편 거래명세서 (${invoiceRegionsPart1.length}곳)`}
          </button>
          <button
            onClick={() => handleGenerateInvoicePart(2)}
            disabled={invoiceBusy || !activeInvoiceSupplier || invoiceRegionsPart2.length === 0}
            className="primary-btn"
            style={{ ...primaryBtnStyle, opacity: invoiceBusy || !activeInvoiceSupplier || invoiceRegionsPart2.length === 0 ? 0.6 : 1 }}
          >
            <Download size={15} /> {invoiceBusy ? "생성 중..." : `2편 거래명세서 (${invoiceRegionsPart2.length}곳)`}
          </button>
        </div>
        {invoiceErr && <div style={{ marginTop: 10, fontSize: 12.5, color: T.danger, fontWeight: 600 }}>{invoiceErr}</div>}
        {invoiceSkipped.added.length > 0 && (
          <div style={{ marginTop: 10, fontSize: 12, color: T.inkSoft }}>
            소비기한 자료에 없는 신제품 {invoiceSkipped.added.length}개는 명세서 맨 아래에 자동으로 추가됐어요(소비기한 비고는 임시로 +3일):{" "}
            {invoiceSkipped.added.slice(0, 6).join(", ")}

          </div>
        )}
        {invoiceSkipped.excluded.length > 0 && (
          <div style={{ marginTop: 10, fontSize: 12, color: T.inkSoft }}>
            PB/TC 상품 {invoiceSkipped.excluded.length}개는 명세서 대상이 아니라 뺐어요:{" "}
            {invoiceSkipped.excluded.slice(0, 6).join(", ")}
            {invoiceSkipped.excluded.length > 6 ? ` 외 ${invoiceSkipped.excluded.length - 6}개` : ""}
          </div>

        {!invoiceErr && activeInvoiceSupplier && invoiceRegionsTotal === 0 && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: T.inkSoft }}>이 날짜엔 {activeInvoiceSupplier} 발주가 없어요.</div>

        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <Field label="날짜">
            <select style={inputStyle} value={activeDcDate || ""} onChange={(e) => setDcDate(e.target.value)}>
              {dateOptions.length === 0 && <option value="">발주 없음</option>}
              {dateOptions.map((d) => (
                <option key={d} value={d}>

          >
            <Download size={15} /> {dcBusy ? "생성 중..." : `DC 거래명세서 (${activeDcRegions.length}곳)`}

        <div style={{ flex: "1 1 380px" }}>

              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>

                  <div style={{ fontWeight: 700, fontSize: 16 }}>거래명세서</div>

              <div style={{ fontSize: 13, color: T.inkSoft, marginBottom: 4 }}>발주처: <b style={{ color: T.ink }}>{selected.customer}</b></div>

              <div className="table-wrap">
                <table>

                      <th>품목명</th>

                      .filter((l) => l.allocatedQty > 0)

                          </td>

                      ))}

                * 현재는 수량 기준 명세서입니다. 단가·금액 자동 반영은 추후 화주사 단가 정보 연동 후 지원됩니다.

            </div>

      </div>

}

/* ================= VII. 출고처리 ================= */
function Shipping({ orders, stores, onShip, onCancelShip, onConfirmPms }) {
  const [storeFilter, setStoreFilter] = useState("전체");
  const [checked, setChecked] = useState({});
  const [expanded, setExpanded] = useState(null);
  const relevant = orders.filter((o) => ["PICK_CONFIRMED", "SHIPPED", "DONE"].includes(o.status) && (storeFilter === "전체" || o.customer === storeFilter));
  const anyChecked = Object.values(checked).some(Boolean);

  function shipSelected() {
    orders.forEach((o) => {
      if (checked[o.id] && o.status === "PICK_CONFIRMED") onShip(o.id);
    });
    setChecked({});
  }

  return (
    <div>
      <PageHeader title="VII. 출고처리" sub="피킹 확정된 발주를 매장(관할센터)별로 출고 처리합니다" />
      <div style={{ display: "flex", gap: 10, marginBottom: 12, alignItems: "center", flexWrap: "wrap" }}>
        <select style={{ ...inputStyle, width: 200 }} value={storeFilter} onChange={(e) => setStoreFilter(e.target.value)}>
          <option>전체</option>
          {stores.map((s) => (
            <option key={s.id}>{s.name}</option>
          ))}
        </select>
        {anyChecked && (
          <button onClick={shipSelected} className="primary-btn" style={primaryBtnStyle}>
            <Truck size={15} /> 선택 항목 출고처리
          </button>
        )}
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th></th>
              <th>발주번호</th>
              <th>발주처</th>
              <th>상태</th>
              <th>PMS 전송</th>

/* ================= XIII. 상품 정보 관리 ================= */
// 발주파일로 들어온 상품들의 입수·소비기한·표시 상품명·명세서 구분(일반/DC/당착)을 직원이 직접 바꾸는 화면.
// 저장값은 서버 /settings/product_info 에 상품명 기준으로 저장되고, 피킹지시서·거래명세서를 만들 때마다 먼저 적용된다.
// 지역코드 목록 -> "청주·신제주" 같은 짧은 이름 (피킹지 1편 지역 순서대로)
function regionNamesOf(codes) {
  const set = new Set(codes || []);
  const names = REGION_ORDER_TABLE.filter((r) => set.has(r.code)).map((r) => r.name);
  (codes || []).forEach((c) => !REGION_ORDER_MAP[c] && names.push(c));
  return names.length > 3 ? `${names.slice(0, 3).join("·")} 외 ${names.length - 3}곳` : names.join("·");
}
const PI_CAT_COLOR = {
  일반: { bg: "#EEF1F4", fg: "#3E4750" },
  DC: { bg: "#E4F2EE", fg: "#0E4F3F" },
  당착: { bg: "#FBE9DF", fg: "#7A331A" },
};

// 발주 기록에서 상품 목록과 "기본값"(발주파일·기존 코드 설정으로 들어온 입수)을 뽑는다. 가장 최근 날짜 값 기준.
function buildProductInfoRows(orders) {
  const map = new Map();
  orders.forEach((o) => {
    o.lines.forEach((l) => {
      const name = String(l.name || "").replace(/\n/g, "").trim();
      if (!name) return;
      const prev = map.get(name);
      if (prev && prev.lastDate > o.createdAt) return;
      map.set(name, {
        name,
        sku: l.sku,
        supplier: pickingSupplierKey(o.supplier || ""),
        basePack: Number(l.packQty) || 0,
        lastDate: o.createdAt,
      });
    });
  });
  return Array.from(map.values());
}

function piCategoryOf(dc, dk) {
  if (dk) return { cat: "당착", detail: dk.style === "full" ? "전 지역" : regionNamesOf(dk.regions || [dk.region]) };
  if (dc) return { cat: "DC", detail: dc.group.label };
  return { cat: "일반", detail: "" };
}

function PiCatBadge({ cat, detail }) {
  const c = PI_CAT_COLOR[cat];
  return (
    <span style={{ display: "inline-block", padding: "3px 9px", borderRadius: 999, background: c.bg, color: c.fg, fontSize: 12, fontWeight: 700, whiteSpace: "nowrap" }}>
      {cat}
      {detail ? ` · ${detail}` : ""}
    </span>
  );
}

function ProductInfoPage({ orders, authToken, productInfo, onSaved }) {
  const [q, setQ] = useState("");
  const [supplier, setSupplier] = useState("all");
  const [onlyChanged, setOnlyChanged] = useState(false);
  const [editing, setEditing] = useState(null);

  const rows = useMemo(() => {
    const base = buildProductInfoRows(orders);
    // 발주 기록엔 없지만 예전에 바꿔둔 상품도 목록에 남겨둔다
    Object.keys(productInfo || {}).forEach((name) => {
      if (!base.some((r) => r.name === name)) base.push({ name, sku: "", supplier: "(발주 기록 없음)", basePack: 0, lastDate: "" });
    });
    return base
      .map((r) => {
        const ov = (productInfo || {})[r.name] || null;
        const pack = packQtyOverrideOf(r.name) ?? r.basePack;
        const dc = dcGroupOf(r.name);
        const dk = getDangchakInfo(r.name);
        const expiry = dc && expiryOverrideOf(r.name) == null ? null : expiryDaysOf(r.name);
        return { ...r, ov, changed: !!ov, pack, expiry, displayName: displayNameOf(r.name), category: piCategoryOf(dc, dk), part: detectPart(r.name) };
      })
      .sort((a, b) => pickingSupplierPriority(a.supplier) - pickingSupplierPriority(b.supplier) || a.supplier.localeCompare(b.supplier, "ko") || a.name.localeCompare(b.name, "ko"));
  }, [orders, productInfo]);

  const suppliers = useMemo(() => Array.from(new Set(rows.map((r) => r.supplier))), [rows]);
  const filtered = rows.filter((r) => {
    if (supplier !== "all" && r.supplier !== supplier) return false;
    if (onlyChanged && !r.changed) return false;
    const k = q.trim().toLowerCase();
    if (k && !r.name.toLowerCase().includes(k) && !String(r.sku).toLowerCase().includes(k) && !r.displayName.toLowerCase().includes(k)) return false;
    return true;
  });
  const changedCount = rows.filter((r) => r.changed).length;
  const shown = filtered.slice(0, 400);

  return (
    <div>
      <PageHeader title="XIII. 상품 정보 관리" sub="입수·소비기한·상품명·명세서 구분을 바꾸면 피킹지시서와 거래명세서에 바로 반영돼요 (이미 올린 날짜도 다시 올릴 필요 없어요)" />

      <div style={{ ...cardStyle, padding: 16, marginBottom: 14, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <div style={{ position: "relative", flex: "1 1 260px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 10, color: T.inkSoft }} />
          <input style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} placeholder="상품명 또는 상품코드 검색" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select style={{ ...inputStyle, flex: "0 1 220px" }} value={supplier} onChange={(e) => setSupplier(e.target.value)}>
          <option value="all">전체 공급사</option>
          {suppliers.map((s) => (
            <option key={s} value={s}>
              {s}
            </option>
          ))}
        </select>
        <button
          onClick={() => setOnlyChanged((v) => !v)}
          style={{ ...smallBtnStyle, padding: "8px 12px", background: onlyChanged ? T.steel : T.surface, color: onlyChanged ? "#fff" : T.ink, borderColor: onlyChanged ? T.steel : T.border }}
        >
          변경한 상품만 ({changedCount})
        </button>
        <span style={{ marginLeft: "auto", fontSize: 12.5, color: T.inkSoft }}>
          상품 {filtered.length}개{filtered.length > shown.length ? ` (앞 ${shown.length}개 표시 - 검색으로 좁혀주세요)` : ""}
        </span>
      </div>

      <div className="table-wrap" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, overflow: "hidden" }}>
        <table>
          <thead>
            <tr>
              <th>공급사</th>
              <th>상품명</th>
              <th style={{ textAlign: "center" }}>입수</th>
              <th style={{ textAlign: "center" }}>소비기한</th>
              <th>명세서 구분</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {shown.length === 0 ? (
              <tr>
                <td colSpan={6}>
                  <EmptyRow text={rows.length === 0 ? "발주파일을 올리면 상품이 여기에 나와요." : "조건에 맞는 상품이 없어요."} />

                return (
                  <tr key={r.name} className="rowhover" style={{ cursor: "pointer" }} onClick={() => setEditing(r.name)}>
                    <td style={{ color: T.inkSoft, fontSize: 12.5, whiteSpace: "nowrap" }}>{r.supplier}</td>

      )}

  );
